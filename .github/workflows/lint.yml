# Workspace lint: rustfmt, clippy (as a ratchet), and the #[instrument] skip
# policy, on every pull request to main.
#
# History worth knowing before changing this file: from 748df86 until this
# rewrite, `on.pull_request.branches` was `foo` — no such branch has ever
# existed, so nothing here ran. It was paused because the gate could not
# pass: `.cargo/config.toml` promotes clippy's pedantic/nursery lints to
# errors and the workspace carries well over a thousand findings. Clippy now
# runs as a ratchet over a committed baseline (see
# scripts/check_clippy_baseline.py) instead of as a gate nobody can clear.
#
# Named `Lint`, not `CI Workflow`: test.yml has that name, and `concurrency`
# below is keyed on `github.workflow`, so sharing it put both workflows in
# one concurrency group where each queued behind — or displaced — the other.
name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

defaults:
  run:
    working-directory: ./

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine_jobs:
    name: Determine jobs to run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `apps/**` was missing from this list while the workflow was paused,
      # so a change to file_host alone would never have triggered it.
      - name: Detect Rust-related changes
        id: rust
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            Cargo.toml
            Cargo.lock
            apps/**
            crates/**
            migrations/**
            .cargo/**
            clippy.toml
            rustfmt.toml
            rust-toolchain
            scripts/check_clippy_baseline.py
            scripts/clippy_baseline.json
            scripts/check_instrument_skip.py
            .github/workflows/lint.yml
            !**.md
            !**.mdx

    outputs:
      rust: ${{ steps.rust.outputs.diff != '' }}

  rust_lint:
    name: Rust lint
    runs-on: ubuntu-latest
    needs: determine_jobs
    if: needs.determine_jobs.outputs.rust == 'true'
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/test.db
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Pinned, not `stable`: the clippy baseline is a count of findings, and
      # each clippy release adds lints. An unpinned toolchain would fail every
      # open PR the day a new release ships. Bump this and regenerate
      # scripts/clippy_baseline.json in the same change.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      # The two lexical checks first: they need no build, so a formatting or
      # policy failure is reported in seconds rather than after the compile.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Enforce the #[instrument] skip policy
        run: python3 scripts/check_instrument_skip.py

      # Same database setup as test.yml: `sqlx::query!` checks SQL against a
      # migrated schema at compile time, so clippy cannot build without it.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features sqlite

      - name: Create the database and run every crate's migrations
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/test.db"
          staged="${GITHUB_WORKSPACE}/.migrations"
          rm -rf "$staged" && mkdir -p "$staged"

          find . -path '*/migrations/*.up.sql' -type f | sort | while read -r migration; do
            cp "$migration" "$staged/$(basename "$migration" .up.sql).sql"
          done

          sqlx database create
          sqlx migrate run --source "$staged"
          rm -rf "$staged"

      # `--cap-lints=warn` so a crate with findings still builds and every
      # crate depending on it is still linted; `--all-targets` so test code is
      # linted at all. The baseline check, not clippy's exit code, decides —
      # and it fails on real compiler errors and on a build that did not
      # finish, so ignoring the exit code here hides nothing.
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --keep-going --message-format=json \
            -- --cap-lints=warn -A unknown-lints > clippy.json || true

      - name: Check clippy findings against the baseline
        run: python3 scripts/check_clippy_baseline.py clippy.json
