# The route snapshot `paulgsc/some-ui` consumes: checked against that repo on
# every PR here, and delivered to it on every merge.
#
# `dump-routes` emits this server's HTTP surface
# (apps/servers/file_host/docs/route-inventory.md). some-ui keeps two copies of
# it, `routes.server.json` for its contract harness and `routes.ts` for the
# `ServerRoute` union. Until this workflow, both were copied across by hand, so
# a moved route surfaced in some-ui whenever someone next remembered to copy,
# far from the change that moved it. The day this landed, some-ui's copy was
# missing five routes this server already served.
#
#   snapshot  builds both files and uploads them as the `route-snapshot` artifact.
#   client    (PRs) checks some-ui's main against this PR, three ways:
#             - some-ui's own `scripts/sync-server-routes.sh --verify`: a
#               route change that leaves a contract pointing at nothing;
#             - some-ui's contract harness, every contract (mutating ones
#               included, on a throwaway database), against this PR's
#               file_host, started here: a response that no longer matches
#               what the client expects;
#             - `scripts/check_client_fixtures.py`: a fixture either repo keeps
#               of the other's output that no longer matches a fresh dump.
#             Each fails here, on the PR that caused it. When the break is
#             intended, label the PR `client-breaking-route`: the checks still
#             run and report, but no longer fail, and the matching some-ui
#             change lands with the sync PR below.
#   sync      (main) opens or updates one PR in some-ui carrying the snapshot.
#             Needs the `SOME_UI_SYNC_TOKEN` secret: a fine-grained token on
#             paulgsc/some-ui with Contents and Pull requests read/write. A PR
#             opened with the default GITHUB_TOKEN cannot reach another repo,
#             and one opened by it would not trigger some-ui's own CI. Without
#             the secret the job warns and does nothing else.
#             It is the PR's only writer, and it closes the PR when some-ui's
#             main already carries the snapshot. some-ui's
#             `server-route-snapshot.yml` re-runs it (`workflow_dispatch`)
#             when that main moves, or on a `/resync` comment on the PR.
#
# No some-ui path is named here. The copy destinations live in some-ui's
# script, `sync` commits whatever that script changed, and the fixture check
# finds some-ui's copies by file name, so moving any of them is a change to
# that repo alone.
name: Routes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
    # Everything file_host is built from, since `client` runs it, and the
    # fixtures the check compares.
    paths:
      - 'apps/servers/file_host/**'
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check_client_fixtures.py'
      - '.github/workflows/routes.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/servers/file_host/**'
      - '.github/workflows/routes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Emit the route snapshot
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/routes.db
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The same pin as lint.yml, so the binary that emits the snapshot is
      # built by the toolchain the rest of CI checks.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      # `sqlx::query!` checks SQL against a migrated schema at compile time, and
      # `dump-routes` links the whole crate. Same setup as test.yml, for the
      # same reasons: pinned, locked, never cached.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features sqlite

      - name: Create the database and run every crate's migrations
        run: |
          set -euo pipefail
          staged="${GITHUB_WORKSPACE}/.migrations"
          rm -rf "$staged" && mkdir -p "$staged"

          find . -path '*/migrations/*.up.sql' -type f | sort | while read -r migration; do
            cp "$migration" "$staged/$(basename "$migration" .up.sql).sql"
          done

          sqlx database create
          sqlx migrate run --source "$staged"
          rm -rf "$staged"

      - name: Emit JSON and TypeScript
        run: |
          set -euo pipefail
          mkdir -p route-snapshot
          cargo run -q --bin dump-routes > route-snapshot/routes.server.json
          cargo run -q --bin dump-routes -- --ts > route-snapshot/routes.server.ts
          echo "$(grep -c '"method"' route-snapshot/routes.server.json) routes"

      # Read only by the jobs below, in this same run, so a day is plenty;
      # the default would keep every run's copy for 90. Past that day,
      # "Re-run failed jobs" finds no artifact: use "Re-run all jobs", which
      # rebuilds it. For `sync`, run a fresh sync instead (a manual run, or
      # `/resync` on the some-ui PR): a day-old run would push a day-old
      # snapshot over whatever changed since.
      - uses: actions/upload-artifact@v4
        with:
          name: route-snapshot
          path: route-snapshot/
          if-no-files-found: error
          retention-days: 1

      # What `client` runs some-ui's checks against: this PR's file_host, the
      # database the snapshot was built with (migrated by sqlx-cli above), and
      # the two sessions some-ui keeps a copy of. Stripped: the debug binary
      # is mostly debug info, about 370 MB against 60.
      - name: Build file_host and dump the sessions some-ui copies
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p contract-run
          cargo build -q --bin file_host
          strip -o contract-run/file_host target/debug/file_host
          cargo run -q --bin dump-provisioned-session > contract-run/provisioned-session.json
          cargo run -q --bin dump-proposed-session > contract-run/proposed-session.json
          python3 - routes.db contract-run/file_host.db <<'EOF'
          import sqlite3, sys
          source, copy = sqlite3.connect(sys.argv[1]), sqlite3.connect(sys.argv[2])
          source.backup(copy)
          copy.close()
          EOF

      # Read only by `client`, in this same run, so a day is plenty. Past that
      # day, "Re-run failed jobs" finds no artifact: use "Re-run all jobs",
      # which rebuilds it.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: contract-run
          path: contract-run/
          if-no-files-found: error
          retention-days: 1

  client:
    name: Check some-ui against it
    needs: snapshot
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # file_host connects to NATS at startup and checks Redis in `/ready`, which
    # the start step waits on. Neither needs anything from them beyond that.
    services:
      nats:
        image: nats:2.10
        ports:
          - 4222:4222
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      # This repo: the fixture check and the fixtures it reads.
      - uses: actions/checkout@v5
        with:
          path: server

      # Public repository, so no token: this job only reads some-ui.
      - uses: actions/checkout@v5
        with:
          repository: paulgsc/some-ui
          path: some-ui

      - uses: actions/download-artifact@v4
        with:
          name: route-snapshot
          path: route-snapshot

      - uses: actions/download-artifact@v4
        with:
          name: contract-run
          path: contract-run

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: some-ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: some-ui/.nvmrc

      # Only the packages the checks read, and what they depend on: the
      # contract harness, the route union, and the activity catalogue some-ui
      # dumps. The full some-ui install is far larger than this job needs.
      - name: Install the packages the checks read
        working-directory: some-ui
        run: pnpm install --frozen-lockfile --filter "@some-ui/contract-harness..." --filter "@some-ui/server-routes..." --filter "@some-ui/activity-catalog..."

      - name: Sync and verify
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'client-breaking-route') }}
        run: |
          set -euo pipefail
          script=some-ui/scripts/sync-server-routes.sh
          if [ ! -f "$script" ]; then
            echo "::error::$script does not exist on some-ui's main yet; it lands with the some-ui change that pairs with this workflow."
            exit 1
          fi
          bash "$script" route-snapshot/routes.server.json route-snapshot/routes.server.ts --verify

      # A throwaway database, so every contract runs, mutating ones included,
      # and one signed-in session for the per-person routes. A session is
      # stored as the SHA-256 of the cookie's 32 bytes (`auth/cookie.rs`), so
      # writing that row is signing in; the subject is also an operator, for
      # the operator routes. RATE_LIMIT is per client per minute, and the
      # harness is one client making about sixty requests in a few seconds.
      - name: Start this PR's file_host
        env:
          SUBJECT: subject-00000000000000000000000000c0ffee
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/file_host.db"
          cp contract-run/file_host.db "$db"
          cookie=$(python3 - "$db" <<'EOF'
          import base64, hashlib, os, sqlite3, sys, time
          token = os.urandom(32)
          db = sqlite3.connect(sys.argv[1])
          db.execute("INSERT INTO account (subject_id, user_handle) VALUES (?, ?)", (os.environ["SUBJECT"], os.urandom(16)))
          db.execute(
              "INSERT INTO auth_session (token_hash, subject_id, expires_at) VALUES (?, ?, ?)",
              (hashlib.sha256(token).digest(), os.environ["SUBJECT"], int(time.time()) + 3600),
          )
          db.commit()
          print(base64.urlsafe_b64encode(token).rstrip(b"=").decode())
          EOF
          )
          echo "::add-mask::$cookie"
          echo "CONTRACT_SESSION_COOKIE=$cookie" >> "$GITHUB_ENV"

          chmod +x contract-run/file_host
          env DATABASE_URL="sqlite://$db" NATS_URL=nats://127.0.0.1:4222 REDIS_URL=redis://127.0.0.1:6379 \
            FILE_HOST_BIND=127.0.0.1 FILE_HOST_PORT=3000 RATE_LIMIT=6000 \
            WEBAUTHN_RP_ID=localhost WEBAUTHN_ORIGINS=https://localhost OPERATOR_SUBJECTS="$SUBJECT" \
            ALLOWED_ORIGINS=https://localhost APP_BASE_URL=https://localhost/ \
            OBS_WEBSOCKET_IP=127.0.0.1 OBS_WEBSOCKET_PWD=unused RUST_LOG=info \
            nohup contract-run/file_host > "$RUNNER_TEMP/file_host.log" 2>&1 &

          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:3000/ready; then exit 0; fi
            sleep 1
          done
          echo "::error::file_host was not ready within a minute"
          cat "$RUNNER_TEMP/file_host.log"
          exit 1

      - name: Contracts against this PR's file_host
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'client-breaking-route') }}
        working-directory: some-ui
        run: pnpm --filter @some-ui/contract-harness contract --base-url http://127.0.0.1:3000 --include-mutations

      # some-ui's dumps against this repo's copies, and this PR's dumps against
      # some-ui's copies. See the script for the differences it knows about.
      - name: Fixtures each repo keeps of the other
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'client-breaking-route') }}
        run: |
          set -euo pipefail
          mkdir -p dumps
          (cd some-ui && pnpm -s dump:activity-catalog) > dumps/activity-catalog.json
          (cd some-ui && pnpm -s dump:session-duration-policy) > dumps/session-duration-policy.json
          cp contract-run/provisioned-session.json contract-run/proposed-session.json dumps/
          python3 server/scripts/check_client_fixtures.py --self-test
          python3 server/scripts/check_client_fixtures.py --some-ui some-ui --dumps dumps

      - name: file_host's log
        if: always()
        run: cat "$RUNNER_TEMP/file_host.log" 2>/dev/null || echo "file_host did not start"

      # What this PR would change in some-ui, on the run page, whether or not
      # the check above passed.
      - name: Summarise the snapshot change
        if: always()
        working-directory: some-ui
        run: |
          set -euo pipefail
          {
            echo "## Route snapshot vs. some-ui main"
            if git diff --quiet; then
              echo "No change: some-ui's copy already matches this PR."
            else
              echo '```diff'
              git --no-pager diff
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: Open the sync PR in some-ui
    needs: snapshot
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the sync token
        id: token
        env:
          SOME_UI_SYNC_TOKEN: ${{ secrets.SOME_UI_SYNC_TOKEN }}
        run: |
          if [ -z "$SOME_UI_SYNC_TOKEN" ]; then
            echo "::warning title=Route snapshot not synced::SOME_UI_SYNC_TOKEN is not set, so no PR was opened in paulgsc/some-ui. See the header of .github/workflows/routes.yml."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
        with:
          repository: paulgsc/some-ui
          path: some-ui
          token: ${{ secrets.SOME_UI_SYNC_TOKEN }}

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: route-snapshot
          path: route-snapshot

      # No --verify: the PR this opens runs some-ui's own CI, contract drift
      # included, and a red check there is the report.
      - name: Sync
        if: steps.token.outputs.present == 'true'
        run: bash some-ui/scripts/sync-server-routes.sh route-snapshot/routes.server.json route-snapshot/routes.server.ts

      # One standing branch: each merge here updates the same PR rather than
      # stacking a new one, and a merge that changes no route leaves it alone.
      # No `add-paths`: without it the action commits every change in the
      # checkout, which is only what the script wrote, since nothing else in
      # this job touches it. Naming the files here would stop the sync with no
      # error the day some-ui moved one.
      - uses: peter-evans/create-pull-request@v7
        if: steps.token.outputs.present == 'true'
        with:
          path: some-ui
          token: ${{ secrets.SOME_UI_SYNC_TOKEN }}
          branch: bot/server-route-snapshot
          delete-branch: true
          commit-message: 'chore(server-routes): sync route snapshot from paulgsc/server@${{ steps.token.outputs.short_sha }}'
          title: 'chore(server-routes): sync route snapshot from paulgsc/server@${{ steps.token.outputs.short_sha }}'
          body: |
            The route snapshot as of paulgsc/server@${{ github.sha }}, written by `scripts/sync-server-routes.sh`.

            Generated by paulgsc/server's `.github/workflows/routes.yml` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Both files are `dump-routes` output, copied verbatim; do not edit them here. If `Contract drift` fails on this PR, a contract in `packages/contract-harness/contracts` targets a route the server no longer serves.
