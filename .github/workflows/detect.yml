name: Detect, Build & Stage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Every main push must reach the staging job; otherwise a newer push could
  # cancel an older one before its changeset has been added to the release PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      has_changes: ${{ steps.compute.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache detector binary
        id: cache-detector
        uses: actions/cache@v4
        with:
          path: .github/scripts/detect/target/release/detect
          key: ${{ runner.os }}-detector-${{ hashFiles('.github/scripts/detect/Cargo.lock', '.github/scripts/detect/Cargo.toml', '.github/scripts/detect/src/**') }}
      - name: Build detector
        if: steps.cache-detector.outputs.cache-hit != 'true'
        run: cargo build --release
        working-directory: .github/scripts/detect
      - name: Compute build matrix
        id: compute
        run: |
          # Determine comparison base
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            # Use the SHA before the push
            BASE_REF="${{ github.event.before }}"
          fi

          # Materialize and print the input before running the detector. This
          # makes an unexpectedly empty comparison distinguishable from a
          # detector which saw paths but classified all of them as irrelevant.
          git diff --name-only "$BASE_REF...HEAD" > changed-files.txt
          echo "Changed files passed to detector:"
          sed 's/^/  - /' changed-files.txt

          .github/scripts/detect/target/release/detect < changed-files.txt \
            | tee matrix.json

          # Extract matrix and check if empty
          MATRIX=$(jq -c . matrix.json)
          INCLUDE_COUNT=$(jq '.include | length' matrix.json)

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          if [[ "$INCLUDE_COUNT" -gt 0 ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Building $INCLUDE_COUNT image(s)"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No images require rebuilding"
          fi
  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix }}
  stage:
    needs: [detect, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pending changesets
        env:
          CHANGESET_BRANCH: automation/docker-image-changesets
        run: |
          if git ls-remote --exit-code --heads origin "$CHANGESET_BRANCH" >/dev/null; then
            git fetch origin "$CHANGESET_BRANCH:refs/remotes/origin/$CHANGESET_BRANCH"
            git checkout "refs/remotes/origin/$CHANGESET_BRANCH" -- \
              .github/docker-changesets
          fi
      - name: Record image changeset
        env:
          MATRIX: ${{ needs.detect.outputs.matrix }}
        run: |
          mkdir -p .github/docker-changesets
          jq --arg source_sha "${{ github.sha }}" \
            '{source_sha: $source_sha, include: .include}' \
            <<< "$MATRIX" > ".github/docker-changesets/${{ github.sha }}.json"
      - name: Create or update Docker image changeset pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/docker-image-changesets
          delete-branch: true
          commit-message: "chore(docker): stage image changesets"
          title: "chore(docker): publish pending image changes"
          body: |
            Merging this pull request publishes the accumulated Docker image changes to Docker Hub.

            This pull request is maintained automatically as image-affecting changes land on `main`.
