# Home's release follows what has been published (RELEASE R2, #789; epic #787;
# docs/release.md says what it promises).
#
# `deploy/home/release.json` names every image compose starts on home (R1,
# #788). Each run reconciles it: `scripts/release_lock.py` works out, from
# the sources of truth alone (main's image changesets and Docker Hub's tags),
# the newest published reference of every image the release follows, and
# writes main's release with those. If that differs from main, it becomes the
# one release pull request, `automation/release`, which auto-merges once its
# checks pass (C119: each image keeps the one approval it has where it is
# published, and forming the set adds none).
#
# A run carries no images of its own: what started it is only a reason to
# look. So any run computes the whole set, and the one concurrency group's
# single pending slot loses nothing when GitHub cancels a queued run for a
# newer one: the newer one sees everything the cancelled one would have.
#
# It runs after server's images are pushed (publish-image-changesets.yml's
# `release` job), when some-ui's www and render releases dispatch it (U1,
# #791, `gh workflow run release-lock.yml` with SERVER_ROUTES_DISPATCH_TOKEN),
# and by hand.
#
# Third-party images (R7, #796; C120) move on their own clock: monthly, or
# by hand with `third_party`, `release_lock.py --third-party` moves each
# third-party entry to its tag's current digest and nothing else, into its
# own pull request, `automation/release-third-party`, so a third-party move
# is its own release and rolls back whole without an app image. An app
# publish never starts one. Both pull requests bump main's serial, so the one
# that merges second has to be formed again on the new main: every run forms
# the app release, and forms the third-party one again only while its pull
# request is open (it re-reads the tags it names; it adds no move of its own).
#
# A pull request opened with the default GITHUB_TOKEN gets its checks in an
# approval-required state (docs/assurance.md, "A pull request the image bot …
# opens"), so it waits for "Approve workflows to run" before auto-merge can
# complete. With the `RELEASE_BOT_TOKEN` secret (a token on this repository
# with Contents and Pull requests read/write) its checks run as anyone's and
# auto-merge completes it. Whether to add it is the owner's call.
name: Release lock
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why to look (a published image, say). Only logged: the run reads the sources itself."
        required: false
        type: string
      third_party:
        description: "Also refresh the third-party images' digests, as the monthly run does (R7)."
        required: false
        type: boolean
        default: false
  # The third-party refresh's own clock (C120): the 9th of each month.
  schedule:
    - cron: '17 11 9 * *'
permissions:
  contents: read
concurrency:
  group: release-lock
  cancel-in-progress: false
jobs:
  release:
    name: Reconcile the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      # The schedule, or a dispatch that asks: the only starts of a refresh.
      THIRD_PARTY: ${{ github.event_name == 'schedule' || inputs.third_party == true }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      # Runs are one at a time (the concurrency group), so the only thing that
      # can move under a run is main itself: a release, or anything else,
      # merging meanwhile. Each release forms on main as it is, pushes, and
      # forms again if main moved, so its pull request is never one formed on
      # a main that is gone. main already having it closes a pull request
      # still open for it, which would propose nothing or something main has
      # passed. Otherwise its pull request opens and asks for auto-merge.
      - name: Form each release with what has been published
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [ -z "${REASON:-}" ] || echo "Started for: $REASON"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # form <branch> <title> <what it holds> [release_lock.py flag]
          form() {
            local branch=$1 title=$2 holds=$3 flag=${4:-} changed='' attempt formed_on number body created
            for attempt in 1 2 3 4 5; do
              git fetch -q origin main
              formed_on=$(git rev-parse origin/main)
              git checkout -q --detach "$formed_on"
              python3 scripts/release_lock.py $flag > "$RUNNER_TEMP/changes.md"
              cat "$RUNNER_TEMP/changes.md"
              if git diff --quiet -- deploy/home/release.json; then
                changed=false
                break
              fi
              # The branch is main plus this release, whatever it held
              # before: the run computed the whole set, so nothing on it is
              # owed to an earlier run.
              git commit -q -m "$title" -- deploy/home/release.json
              git push -q --force origin "HEAD:refs/heads/$branch"
              git fetch -q origin main
              if [ "$(git rev-parse origin/main)" = "$formed_on" ]; then
                changed=true
                break
              fi
              echo "main moved while $branch formed; forming it again (attempt $attempt)."
            done
            number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            case $changed in
              false)
                echo "main's release already names $holds."
                if [ -n "$number" ]; then
                  gh pr close "$number" --comment "main's release already names $holds (release-lock.yml)."
                fi ;;
              true)
                body="Home's next release (\`deploy/home/release.json\`, epic #787): main's release with $holds (docs/release.md).

          $(cat "$RUNNER_TEMP/changes.md")

          Formed by \`release-lock.yml\` and merged by auto-merge once its checks pass (C119). Home applies it at the next \`make home-deploy\`, or when a client needs a newer contract epoch."
                if [ -z "$number" ]; then
                  created=$(gh pr create --base main --head "$branch" --title "$title" --body "$body")
                  number=$(grep -oE '[0-9]+$' <<< "$created")
                else
                  gh pr edit "$number" --body "$body"
                fi
                gh pr merge --auto --squash "$number" ;;
              *)
                echo "::error::main kept moving; the next run forms $branch"
                exit 1 ;;
            esac
          }

          # Called plainly, never in `||` or `if`, which would turn off
          # `set -e` inside it: a source it cannot read must fail the run,
          # never read as "nothing changed" and close a pull request.
          form automation/release "chore(release): home's next release" \
            "every image it follows at its newest published reference, by tag and digest"
          open=$(gh pr list --head automation/release-third-party --state open --json number --jq '.[0].number // empty')
          if [ "$THIRD_PARTY" = true ] || [ -n "$open" ]; then
            form automation/release-third-party "chore(release): home's third-party images at their tags' current digests" \
              "every third-party image at its tag's current digest, and nothing else moved" --third-party
          fi
