# Decides the `PR gate` check that gate.yml opens (#762): each time a check
# on a pull request's head commit finishes, judge that commit once and write
# the verdict (scripts/pr_gate.py --event), so no runner waits on the others.
#
# `workflow_run` names every workflow a pull request here can start, by its
# `name:`, plus CodeQL's default setup (a `dynamic` workflow with no file
# here). pr_gate.py fails the gate of a pull request whose workflows include
# one this list leaves out, and its self-test fails a name listed here that
# no workflow has. A `workflow_dispatch` with no inputs runs the sweep by
# hand ("sweep now"); with `pr` and `head_sha` it judges that one head.
#
# Other apps' checks (code scanning's `CodeQL` check run) have no event that
# reaches a workflow here: GitHub fires no `check_run` for a commit whose
# check suite is GitHub Actions', which every pull request head here is. On a
# human's pull request, CodeQL's `dynamic` run finishing judges them. The
# schedule sweeps for a check still unfinished when the last workflow
# finished, or any event GitHub drops: every 15 minutes, `sweep` sends each
# open pull request whose PR gate is unfinished back here
# (`workflow_dispatch`) to be judged again. It judges nothing itself, so every
# write still happens inside the head commit's concurrency group. The schedule
# is best effort, not a bound: GitHub skips most of its slots here (7 runs in
# its whole history by 2026-11-12, hours apart), so nothing relies on it.
#
# A run whose actor is github-actions[bot] (a pull request the image bot
# pushed) fires no `workflow_run` at all when it finishes: events a
# GITHUB_TOKEN causes start no workflow. That includes CodeQL's `dynamic`
# run. So each pull-request workflow ends with a `Tell PR gate` job, run only
# for that actor, that dispatches this workflow with `pr` and `head_sha`
# (#772). A dispatched verdict first waits (scripts/pr_gate.py's `settle`):
# - for runs whose only unfinished job is `Tell PR gate` (still finishing the
#   dispatch; seconds, at most 3 minutes);
# - once no pull-request workflow is still at work, for what tells no one when
#   it finishes: CodeQL's `dynamic` run and other apps' check runs (#814),
#   until each finishes or is an hour old, when the gate fails it anyway. On
#   server#813, the minutes CodeQL's Rust analysis outlasted the rest.
# Nothing else: a run still at work tells the gate itself.
#
# Cost of the backstop: 96 sweep runs a day, one job of about 10 s each
# (GitHub bills each as one minute: 96 runner-minutes a day at most), plus
# one judging job of about 15 s per pull request whose gate is still
# unfinished at a sweep, which is usually none.
#
# Every event runs the default branch's copy of this file and of the script,
# so a pull request that edits either is judged by main's. The pull request's
# own workflow files are read through the API as data, never run.
#
# The jobs succeed when they have done their part, whatever the verdict is:
# GitHub files these runs under main's head commit, not the pull request's.
name: PR gate verdict

on:
  workflow_run:
    workflows:
      - Assurance
      - CI Deny Checks
      - Detect, Build & Stage
      - Lint
      - Lines of code
      - Routes
      - Rust runner
      - CI Workflow
      - CodeQL
    types: [completed]
  # Off the hour, so it does not queue behind every other schedule.
  schedule:
    - cron: '7,22,37,52 * * * *'
  # With pr and head_sha (what the sweep and `Tell PR gate` send): judge that pull request's
  # head. With neither (Actions → Run workflow, empty): sweep now, as the
  # schedule does (#772).
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (leave empty to sweep every open pull request)
        required: false
        default: ''
        type: string
      head_sha:
        description: The head commit whose gate is unfinished (empty to sweep)
        required: false
        default: ''
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  verdict:
    name: PR gate (verdict)
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.pr != '')
    runs-on: ubuntu-latest
    # Shared with gate.yml (see there): one group per head commit, never
    # cancelled, so the gate's writes land in the order they read.
    concurrency:
      group: pr-gate-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
      cancel-in-progress: false
    # Seconds, normally. A dispatched verdict may wait for CodeQL up to the
    # hour the gate allows any run (#814); this is the backstop past that.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github

      - name: Judge the head commit and write PR gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/pr_gate.py --event

  sweep:
    name: PR gate (sweep)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github

      - name: Send every open pull request whose gate is unfinished to be judged again
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/pr_gate.py --sweep
