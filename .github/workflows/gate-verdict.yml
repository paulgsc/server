# Decides the `PR gate` check that gate.yml opens (#762): each time a check
# on a pull request's head commit finishes, judge that commit once and write
# the verdict (scripts/pr_gate.py --event), so no runner waits on the others.
#
# `workflow_run` names every workflow a pull request here can start, by its
# `name:`, plus CodeQL's default setup (a `dynamic` workflow with no file
# here). pr_gate.py fails the gate of a pull request whose workflows include
# one this list leaves out, and its self-test fails a name listed here that
# no workflow has.
#
# Other apps' checks (code scanning's `CodeQL` check run) have no event that
# reaches a workflow here: GitHub fires no `check_run` for a commit whose
# check suite is GitHub Actions', which every pull request head here is. So a
# workflow finishing is what judges them, and the schedule is the backstop for
# one still unfinished when the last workflow finishes, or for any event
# GitHub drops: every 15 minutes, `sweep` sends each open pull request whose
# PR gate is unfinished back here (`workflow_dispatch`) to be judged again.
# It judges nothing itself, so every write still happens inside the head
# commit's concurrency group.
#
# Cost of the backstop: 96 sweep runs a day, one job of about 10 s each
# (GitHub bills each as one minute: 96 runner-minutes a day at most), plus
# one judging job of about 15 s per pull request whose gate is still
# unfinished at a sweep, which is usually none.
#
# Every event runs the default branch's copy of this file and of the script,
# so a pull request that edits either is judged by main's. The pull request's
# own workflow files are read through the API as data, never run.
#
# The jobs succeed when they have done their part, whatever the verdict is:
# GitHub files these runs under main's head commit, not the pull request's.
name: PR gate verdict

on:
  workflow_run:
    workflows:
      - Assurance
      - CI Deny Checks
      - Detect, Build & Stage
      - Lint
      - Lines of code
      - Routes
      - Rust runner
      - CI Workflow
      - CodeQL
    types: [completed]
  # Off the hour, so it does not queue behind every other schedule.
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Only the sweep sends these: one pull request and the head it found pending.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: The head commit whose gate is unfinished
        required: true
        type: string

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  verdict:
    name: PR gate (verdict)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Shared with gate.yml (see there): one group per head commit, never
    # cancelled, so the gate's writes land in the order they read.
    concurrency:
      group: pr-gate-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github

      - name: Judge the head commit and write PR gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/pr_gate.py --event

  sweep:
    name: PR gate (sweep)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github

      - name: Send every open pull request whose gate is unfinished to be judged again
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/pr_gate.py --sweep
