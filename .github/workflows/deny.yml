name: CI Deny Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-deny:
    name: Rust Deny Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  node-deny:
    name: Node Deny Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # A "Check License Compliance" step used to sit here, declared as
      # `uses: github-license-check@v1`. That is not a resolvable action
      # reference -- a `uses:` value has to be `owner/repo@ref`, `./path` or
      # `docker://...` -- so GitHub refused to create a run for this file at
      # all, and every job in it, including the four cargo-deny checks above,
      # has never once executed since #207 added them.
      #
      # Removed rather than repointed at a guess. Which licenses this
      # monorepo accepts on the JS side is a policy decision, and enforcing
      # one for the first time (`pnpm licenses list` can do it with no
      # third-party action at all) is its own change with its own argument to
      # make -- not something to smuggle in behind a syntax fix. The Rust
      # half of that policy is `deny.toml`, which this same commit adds
      # because `cargo deny check licenses` cannot run without one.

      - name: Check for banned dependencies
        run: |
          if pnpm list -r | grep -E "some-banned-package|some-other-banned-package"; then
              echo "Banned packages found"
              exit 1
          fi

  deny-summary:
    name: Deny Checks Summary
    needs: [rust-deny, node-deny]
    runs-on: ubuntu-latest
    steps:
      - name: Check deny results
        run: |
          if [ "${{ needs.rust-deny.result }}" == "failure" ] || [ "${{ needs.node-deny.result }}" == "failure" ]; then
            echo "Deny checks failed"
            exit 1
          else
            echo "All deny checks passed"
          fi
