name: CI Deny Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-deny:
    name: Rust Deny Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  deny-summary:
    name: Deny Checks Summary
    needs: [rust-deny]
    runs-on: ubuntu-latest
    steps:
      - name: Check deny results
        run: |
          if [ "${{ needs.rust-deny.result }}" == "failure" ]; then
            echo "Deny checks failed"
            exit 1
          else
            echo "All deny checks passed"
          fi

  # GitHub starts no `workflow_run` when a run whose actor is github-actions[bot] finishes (a pull
  # request the image bot pushed), so PR gate (verdict) would never hear this one: tell it here, last,
  # with the one event GITHUB_TOKEN may fire (#772). Skipped for everyone else, whose runs it hears.
  tell_gate:
    name: Tell PR gate
    needs: [rust-deny, deny-summary]
    if: always() && github.event_name == 'pull_request' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Send this head to PR gate (verdict)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh workflow run gate-verdict.yml --ref "$REF" -f pr="$PR" -f head_sha="$HEAD_SHA"
