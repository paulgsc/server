name: CI Workflow

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
  release:
    types: [published]

defaults:
  run:
    working-directory: ./

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  determine_jobs:
    name: Determine jobs to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust-related changes
        id: rust
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            Cargo.toml
            Cargo.lock
            apps/**
            crates/**
            fixtures/**
            .cargo/**
            rust-toolchain
            !**.md
            !**.mdx

      - name: Detect Formatting-related changes
        id: format
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            **/*.{yml,yaml,md,mdx,js,jsx,ts,tsx,json,toml,css}
            !Cargo.toml

      - name: Detect infra-related changes
        id: infra
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            infra/**
            docker-compose.yml
            scripts/check_scrape_inventory.py

    outputs:
      rust: ${{ steps.rust.outputs.diff != '' }}
      format: ${{ steps.format.outputs.diff != '' }}
      infra: ${{ steps.infra.outputs.diff != '' }}

  rust_ci:
    runs-on: ubuntu-latest
    needs: determine_jobs
    if: needs.determine_jobs.outputs.rust == 'true'
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/test.db
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # `sqlx::query!` verifies SQL against a real schema at compile time, so
      # `cargo check` needs a migrated database — or the `.sqlx` cache built
      # from one. `.sqlx` is gitignored deliberately, which makes preparing it
      # here the intended pattern rather than an optimisation. Without these
      # three steps `cargo check` fails before compiling anything, which is
      # what it had been doing.
      - name: Install sqlx-cli
        # Do not cache and execute ~/.cargo/bin/sqlx. This workflow also runs
        # for release events, so a shared executable cache populated by a pull
        # request would cross a trust boundary. Installing a locked, exact
        # version is deterministic and avoids cache-poisoning the release job.
        run: cargo install sqlx-cli --version 0.7.4 --locked --no-default-features --features sqlite

      - name: Create the database and run every crate's migrations
        # One SQLite file, several crates' migrations directories. The filename
        # prefixes are timestamps precisely so they order globally across
        # crates; collecting them into one directory preserves that order.
        run: |
          set -euo pipefail
          root_db="${GITHUB_WORKSPACE}/test.db"
          rm -f "$root_db"
          staged="${GITHUB_WORKSPACE}/.migrations"
          rm -rf "$staged" && mkdir -p "$staged"

          find . -path '*/migrations/*.up.sql' -type f | sort | while read -r migration; do
            cp "$migration" "$staged/$(basename "$migration" .up.sql).sql"
          done

          sqlx database create
          sqlx migrate run --source "$staged"
          rm -rf "$staged"

      - name: Prepare sqlx offline metadata
        # Written to .sqlx/, which is gitignored — this is the working copy the
        # compiler reads, regenerated per run rather than committed.
        run: cargo sqlx prepare --workspace

      - name: Run cargo check
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace --verbose

  infra_ci:
    runs-on: ubuntu-latest
    needs: determine_jobs
    if: needs.determine_jobs.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      # `docker compose config` is what resolves `docker-compose.yml`'s
      # `include:` directives into the actual service set — see
      # infra/prometheus/inventory.yml's own header for why the check reads
      # that instead of hand-parsing the compose files.
      - name: Validate docker compose config resolves
        run: REPO_ROOT=${{ github.workspace }} docker compose config --quiet

      # scripts/deploy-file-host.sh runs this exact `config` render (source
      # fragments plus a swarm-only overlay) and feeds its output to
      # `docker stack deploy`, since that command's own compose-file parser
      # doesn't track the current Compose Specification (docker/cli#2527 is
      # still open) — validate here that the render itself still resolves.
      - name: Validate file-host swarm rollout config resolves
        run: |
          FILE_HOST_IMAGE=pgathondu/server:test \
            REPO_ROOT=${{ github.workspace }} \
            docker compose \
              --file docker-compose.yml \
              --file infra/compose/file_host.swarm.yml \
              config file-host redis nats --quiet

      - name: Parse zero-downtime deploy script
        run: bash -n scripts/deploy-file-host.sh

      - name: Check scrape inventory reconciles (#146)
        run: REPO_ROOT=${{ github.workspace }} python3 scripts/check_scrape_inventory.py

  # #212 (G1/#217): unconditional, unlike the two jobs above — a phantom
  # query is introduced by editing infra/grafana/ (the `infra` diff), and an
  # orphaned emitter is introduced by editing apps/ or crates/ (the `rust`
  # diff). Gating this on either alone would miss the other, and the check
  # itself is a stdlib-only regex scan with no docker/database setup, so
  # running it unconditionally costs little.
  metric_contract_ci:
    runs-on: ubuntu-latest
    needs: determine_jobs
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check dashboards query only what the workspace emits (#217)
        run: python3 scripts/check_metric_contract.py
