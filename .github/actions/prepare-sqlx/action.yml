name: Prepare SQLx
inputs:
  image-name:
    required: true
  needs-sqlx:
    required: true
  needs-migrations:
    required: true
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v12
    # Create database and run migrations
    - name: Setup database and run migrations
      if: inputs.needs-migrations == 'true'
      shell: bash
      env:
        DATABASE_URL: sqlite://./dev.db
      run: |
        set -euo pipefail
        echo "Creating database..."
        mkdir -p "$(dirname ./dev.db)"
        nix develop .#ci --command sqlx database create

        # Reversible migrations are owned by the workspace now. SQLx expects
        # the up migrations to have a .sql suffix when given a custom source,
        # so stage that half of each pair before preparing the query cache.
        echo "Staging workspace migrations..."
        staged="$(pwd)/.migrations"
        rm -rf "$staged" && mkdir -p "$staged"

        find migrations -maxdepth 1 -name '*.up.sql' -type f | sort | while read -r migration; do
          cp "$migration" "$staged/$(basename "$migration" .up.sql).sql"
        done

        echo "Running staged migrations..."
        nix develop .#ci --command sqlx migrate run --source "$staged"
        rm -rf "$staged"

        echo "All migrations completed successfully"
    # Generate workspace-level .sqlx metadata
    - name: Generate SQLx metadata
      if: inputs.needs-sqlx == 'true'
      shell: bash
      env:
        DATABASE_URL: sqlite://./dev.db
      run: |
        echo "Generating workspace-level SQLx metadata..."
        nix develop .#ci --command \
          cargo sqlx prepare --workspace -- --bin ${{ inputs.image-name }}
