name: Prepare SQLx
inputs:
  image-name:
    required: true
  needs-sqlx:
    required: true
  needs-migrations:
    required: true
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v12
    # flake.nix pins nixpkgs to nixos-24.05, a snapshot that predates sqlx
    # 0.8's release -- the sqlx-cli the devshell provides is 0.7.x. Rather
    # than move the nixpkgs pin (broader blast radius: every other tool the
    # devshell provides), install the exact version we need with cargo inside
    # the same devshell (so it shares its rustc/cargo), and invoke it below
    # by absolute path rather than relying on PATH precedence over the
    # nix-provided binary of the same name.
    - name: Install matching sqlx-cli
      shell: bash
      run: |
        set -euo pipefail
        nix develop .#ci --command \
          cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features sqlite
    # Create database and run migrations
    - name: Setup database and run migrations
      if: inputs.needs-migrations == 'true'
      shell: bash
      env:
        DATABASE_URL: sqlite://./dev.db
      run: |
        set -euo pipefail
        echo "Creating database..."
        mkdir -p "$(dirname ./dev.db)"
        nix develop .#ci --command "$HOME/.cargo/bin/sqlx" database create

        # Reversible migrations are owned by the workspace now. SQLx expects
        # the up migrations to have a .sql suffix when given a custom source,
        # so stage that half of each pair before preparing the query cache.
        echo "Staging workspace migrations..."
        staged="$(pwd)/.migrations"
        rm -rf "$staged" && mkdir -p "$staged"

        find migrations -maxdepth 1 -name '*.up.sql' -type f | sort | while read -r migration; do
          cp "$migration" "$staged/$(basename "$migration" .up.sql).sql"
        done

        echo "Running staged migrations..."
        nix develop .#ci --command "$HOME/.cargo/bin/sqlx" migrate run --source "$staged"
        rm -rf "$staged"

        echo "All migrations completed successfully"
    # Generate workspace-level .sqlx metadata
    - name: Generate SQLx metadata
      if: inputs.needs-sqlx == 'true'
      shell: bash
      env:
        DATABASE_URL: sqlite://./dev.db
      run: |
        echo "Generating workspace-level SQLx metadata..."
        nix develop .#ci --command \
          "$HOME/.cargo/bin/sqlx" prepare --workspace -- --bin ${{ inputs.image-name }}
