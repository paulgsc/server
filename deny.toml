# cargo-deny policy for this workspace.
#
# `.github/workflows/deny.yml` has referenced `cargo deny check` since #207,
# but that workflow never actually ran (an invalid `uses:` reference made
# GitHub refuse to create the run at all), so this file never had to exist.
# With the workflow fixed, it does: `cargo deny check licenses` treats an
# absent config as "no license is allowed" and rejects all 655 crates in the
# graph, plain `MIT` included.
#
# The allow list below is therefore *derived from what is already in the
# tree*, not invented: every entry was observed in `cargo deny list` output
# for this workspace, and nothing was added speculatively. It extends the set
# the deny.yml author originally wrote down (MIT, Apache-2.0, ISC,
# BSD-2-Clause, BSD-3-Clause) with the other permissive licenses that are
# genuinely present. Trimming it is a policy call worth making deliberately;
# it is not trimmed here, because removing a license that a current
# dependency actually uses would just fail the build.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft, satisfied by not modifying the crates themselves:
  # cssparser, selectors, ece, webpki-roots and three of their helpers.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# `LGPL-2.1-or-later` shows up in `cargo deny list` and is deliberately *not*
# allowed. The only crates offering it are `r-efi` 5 and 6, whose expression
# is `MIT OR Apache-2.0 OR LGPL-2.1-or-later` -- an `OR`, so `MIT` already
# satisfies them. Leaving LGPL off the list means a future dependency that
# genuinely requires it fails this check and gets a human decision instead of
# inheriting one made here by accident.

# An `[[licenses.exceptions]]` entry for `aws-lc-sys` used to live here:
# 0.34.0's expression was `ISC AND (Apache-2.0 OR ISC) AND OpenSSL`, an `AND`
# with no alternative to satisfy instead of the OpenSSL clause. #344's first
# `cargo update` pass bumped it to 0.45.0, whose expression dropped the
# OpenSSL clause entirely (`ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND
# MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC
# OR MIT-0)`, verified directly via `cargo metadata`) -- every component is
# already in the allow list above, so the exception is gone rather than left
# as dead config `cargo deny check licenses` would otherwise warn is unmatched.

# `bans` and `sources` are deliberately left at their defaults; both already
# pass unconfigured. `advisories` does not: the graph carried 46 open RUSTSEC
# entries before #344 started -- which is exactly why deny.yml marks that one
# matrix leg `continue-on-error`. #344 is working through them PR by PR
# (cargo-update bumps, dead-dependency removals, targeted version/feature
# bumps); see that issue for the running tally.
#
# The two entries below are the first `ignore` additions of that effort,
# added deliberately rather than reflexively: each is for a crate this
# workspace genuinely still uses (confirmed by direct `grep`, not assumed),
# reachable through a dependency neither this workspace nor its immediate
# dependent controls, where the advisory's own "Solution:" field reads "No
# safe upgrade is available!" -- verified directly via `cargo deny check
# advisories`, not inferred from the advisory's prose. This is *not* a
# blanket policy: every other still-open advisory (the legacy `oauth2`
# 4.4.2/`reqwest` 0.11.27/`rustls` 0.21.12 stack and the
# `google-youtubeanalytics2`/`yup-oauth2` 1.0.12/`hyper` 0.10.16 stack, both
# in `sdk`) stays a visible failure pending a real fix or an explicit
# scoping decision, not a silenced one.
#
# A third entry, for `RUSTSEC-2025-0134` (rustls-pemfile), lived here
# briefly and was wrong: it claimed the crate's own `google-apis-common`
# leg had "no fix available", but that leg was actually a redundant
# duplicate `yup-oauth2 11.0.0` resolution pulled in only by the
# then-current `google-apis-common 7.0.0`/`google-drive3` etc `6.0.0`
# generation -- `sdk` already depended on `yup-oauth2 12.1.0` directly, and
# the next `google-apis-common`/Google API crate generation (8.0.0/7.0.0)
# already resolves to that same 12.x line, which doesn't need
# `rustls-pemfile` at all (caught by Codex review on the PR that introduced
# this entry; verified directly, not taken on faith -- see that PR's commit
# history for the version bump and the one-line `CustomHyperClientBuilder`
# fix it required). Bumping those four crates collapses the duplicate and
# removes the `rustls-pemfile 2.2.0` leg entirely, confirmed via `cargo
# deny check advisories` before/after. The advisory still fires for
# `rustls-pemfile 1.0.4` via the separate legacy `oauth2 4.4.2` chain, so
# it stays visible (not re-added here) pending that chain's own scoping
# decision, same as the rest of that list.
[advisories]
ignore = [
  # Marvin Attack (timing side-channel key recovery). Reachable only via
  # `web-push 0.11.0` -> `jwt-simple 0.12.17` (feature `pure-rust`, not
  # optional -- confirmed via `cargo tree -e features -i rsa@0.9.10`) ->
  # `superboring` -> `rsa`. `web-push` has no newer release (0.11.0 is
  # latest on crates.io) and doesn't feature-gate `jwt-simple`/`rsa` out,
  # so there is no version bump or feature trim that removes it -- the
  # only escape is dropping `push_kit`'s web-push functionality entirely.
  # `push_kit` is genuinely used (`file_host`, `push_repo`; confirmed via
  # `grep -rln web_push crates/push_kit/src/`), so that's a product
  # decision, not a dependency-hygiene one.
  { id = "RUSTSEC-2023-0071", reason = "rsa via web-push 0.11.0 (latest) -> jwt-simple's non-optional pure-rust feature -> superboring; no upstream fix, push_kit genuinely uses web-push" },

  # Whole `google-apis-rs` project marked unmaintained upstream (not a
  # specific vulnerable version range -- there is no patched version to
  # move to; confirmed 8.0.0 still carries the same advisory via `cargo
  # deny check advisories`). This is the dependency underneath
  # `google-drive3`/`google-gmail1`/`google-sheets4`/`google-youtube3`,
  # all of which `sdk` genuinely calls (confirmed via
  # `grep -rln google_drive3\|google_gmail1\|google_sheets4\|google_youtube3
  # crates/sdk/src/`). The advisory's own suggested replacement
  # (`google-cloud-rust`) does not cover Drive/Gmail/Sheets/YouTube --
  # it's Google Cloud Platform bindings, a different API surface entirely
  # -- so there is no drop-in migration, only a full rewrite of `sdk`'s
  # Google integrations. This holds regardless of the crate's own version
  # (7.0.0 -> 8.0.0 bumped elsewhere in this same change for unrelated
  # reasons; the advisory follows the project, not the version).
  { id = "RUSTSEC-2025-0066", reason = "google-apis-common: whole google-apis-rs project unmaintained upstream, no patched version exists, sdk genuinely uses drive3/gmail1/sheets4/youtube3" },
]
