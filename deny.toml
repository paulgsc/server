# cargo-deny policy for this workspace.
#
# `.github/workflows/deny.yml` has referenced `cargo deny check` since #207,
# but that workflow never actually ran (an invalid `uses:` reference made
# GitHub refuse to create the run at all), so this file never had to exist.
# With the workflow fixed, it does: `cargo deny check licenses` treats an
# absent config as "no license is allowed" and rejects all 655 crates in the
# graph, plain `MIT` included.
#
# The allow list below is therefore *derived from what is already in the
# tree*, not invented: every entry was observed in `cargo deny list` output
# for this workspace, and nothing was added speculatively. It extends the set
# the deny.yml author originally wrote down (MIT, Apache-2.0, ISC,
# BSD-2-Clause, BSD-3-Clause) with the other permissive licenses that are
# genuinely present. Trimming it is a policy call worth making deliberately;
# it is not trimmed here, because removing a license that a current
# dependency actually uses would just fail the build.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft, satisfied by not modifying the crates themselves:
  # cssparser, selectors, ece, webpki-roots and three of their helpers.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# `LGPL-2.1-or-later` shows up in `cargo deny list` and is deliberately *not*
# allowed. The only crates offering it are `r-efi` 5 and 6, whose expression
# is `MIT OR Apache-2.0 OR LGPL-2.1-or-later` -- an `OR`, so `MIT` already
# satisfies them. Leaving LGPL off the list means a future dependency that
# genuinely requires it fails this check and gets a human decision instead of
# inheriting one made here by accident.

# An `[[licenses.exceptions]]` entry for `aws-lc-sys` used to live here:
# 0.34.0's expression was `ISC AND (Apache-2.0 OR ISC) AND OpenSSL`, an `AND`
# with no alternative to satisfy instead of the OpenSSL clause. #344's first
# `cargo update` pass bumped it to 0.45.0, whose expression dropped the
# OpenSSL clause entirely (`ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND
# MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC
# OR MIT-0)`, verified directly via `cargo metadata`) -- every component is
# already in the allow list above, so the exception is gone rather than left
# as dead config `cargo deny check licenses` would otherwise warn is unmatched.

# `bans` and `sources` are deliberately left at their defaults; both already
# pass unconfigured. `advisories` carried 46 open RUSTSEC entries before
# #344 started -- which is exactly why deny.yml marks that matrix leg
# `continue-on-error`. #344 worked through them PR by PR (cargo-update
# bumps, dead-dependency removals, targeted version/feature bumps, and
# finally removing the orphaned `sdk` crate -- see #344 for the full
# history), reaching zero open advisories.
#
# The one entry below is the only surviving `ignore`, added deliberately
# rather than reflexively: it's for a crate this workspace genuinely still
# uses (confirmed by direct `grep`, not assumed), reachable through a
# dependency neither this workspace nor its immediate dependent controls,
# where the advisory's own "Solution:" field reads "No safe upgrade is
# available!" -- verified directly via `cargo deny check advisories`, not
# inferred from the advisory's prose. A second entry, for
# `google-apis-common` (RUSTSEC-2025-0066), lived here until the crate that
# needed it (`sdk`) was removed entirely as dead weight -- it had zero
# consumers in the workspace, orphaned since an earlier PR stripped its
# only caller without removing the crate itself. That removal also cleared
# the two legacy `oauth2`/`yup-oauth2` dependency chains that were the rest
# of #344's remaining advisories, without needing the scoping decision
# originally planned for them.
[advisories]
ignore = [
  # Marvin Attack (timing side-channel key recovery). Reachable only via
  # `web-push 0.11.0` -> `jwt-simple 0.12.17` (feature `pure-rust`, not
  # optional -- confirmed via `cargo tree -e features -i rsa@0.9.10`) ->
  # `superboring` -> `rsa`. `web-push` has no newer release (0.11.0 is
  # latest on crates.io) and doesn't feature-gate `jwt-simple`/`rsa` out,
  # so there is no version bump or feature trim that removes it -- the
  # only escape is dropping `push_kit`'s web-push functionality entirely.
  # `push_kit` is genuinely used (`file_host`, `push_repo`; confirmed via
  # `grep -rln web_push crates/push_kit/src/`), so that's a product
  # decision, not a dependency-hygiene one.
  { id = "RUSTSEC-2023-0071", reason = "rsa via web-push 0.11.0 (latest) -> jwt-simple's non-optional pure-rust feature -> superboring; no upstream fix, push_kit genuinely uses web-push" },
]
