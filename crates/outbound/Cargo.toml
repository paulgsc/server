[package]
name = "outbound"
description = "The one way home reaches outside: an instrumented HTTP client per closed caller"
categories = ["web-programming::http-client"]
keywords = ["http", "metrics", "egress"]
readme = "README.md"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
# The same major `reqwest` 0.12 is built on, for its header bounds' error type.
http = "1.1"
metrics = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
metrics-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true

[lib]
doctest = false
