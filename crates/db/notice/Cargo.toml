[package]
name = "notice_repo"
description = "The phones that asked to hear of the morning run, and what home told them — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["jobs", "notice", "fcm", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
