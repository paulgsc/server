[package]
name = "leetype_log_repo"
description = "The owner's LeetType session log: append-only events per session, per subject — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["leetype", "record", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `float_roundtrip`: a phone's `seconds` (performance.now() / 1000) carries 16
# to 17 significant digits, and without it about one in nine reads back a
# different last digit, so the phone's read-back would never match.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "sqlite"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
