[package]
name = "game_feed_repo"
description = "Home's append-only record of ESPN's NFL feed: every raw response, and the play log read from them — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["nfl", "espn", "play-by-play", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4.3"
nfl_feed = { workspace = true }
sha2 = "0.10.9"
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
