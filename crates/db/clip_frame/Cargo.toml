[package]
name = "clip_frame_repo"
description = "Home's append-only record of the clip frames it keeps — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["clips", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4.3"
sha2 = "0.10.9"
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
