[package]
name = "study_note_repo"
description = "The owner's study notes: a soundbite's or a LeetType answer's text, append-only per subject — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["study", "record", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
curriculum_repo = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "sqlite"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
