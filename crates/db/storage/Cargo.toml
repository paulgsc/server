[package]
name = "storage_repo"
description = "What home keeps, by table, once a day: the append-only storage_sample record and the growth figures read from it — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["storage", "dbstat", "growth", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
