[package]
name = "mailbox_repo"
description = "Home's append-only copy of the Jobs mailbox's files, per subject — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["jobs", "mailbox", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
