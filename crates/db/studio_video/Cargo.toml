[package]
name = "studio_video_repo"
description = "A finished Studio video's DNA, queued on home: append-only, per subject — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["studio", "video", "record", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10.9"
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "sqlite"] }
studio_log_repo = { workspace = true }
voice_repo = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
