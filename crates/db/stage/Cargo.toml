[package]
name = "stage_repo"
description = "What waits on what across home's shared stages: the edges a stage's queue orders by — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["stage", "scheduling", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
