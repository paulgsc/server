[package]
name = "publication_repo"
description = "The append-only log of published material, and its epoch"
readme = "README.md"
categories = ["database"]
keywords = ["curriculum", "publication", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
  "uuid",
  "time",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
