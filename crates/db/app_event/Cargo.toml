[package]
name = "app_event_repo"
description = "What the app saw happen as it ran: append-only events per subject, one table for every family — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["outcome", "events", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "sqlite"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
