[package]
name = "drama_prompt_repo"
description = "The owner's drama prompts: append-only, one per stamp, per subject — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["drama", "prompt", "record", "sqlite"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "sqlite"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
