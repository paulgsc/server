[package]
name = "learner_shelf_repo"
description = "Learner-owned content a subject chose to keep: the per-subject shelf — storage layer"
readme = "README.md"
categories = ["database"]
keywords = ["shelf", "lessons", "sqlite", "repository"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
curriculum_repo = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
  "uuid",
  "time",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
