[package]
name = "fcm_kit"
description = "Firebase Cloud Messaging (HTTP v1) — a service account's token and one send, behind a transport seam"
categories = ["web-programming"]
keywords = ["fcm", "firebase", "push", "android"]
readme = "README.md"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
# The same crate and feature web-push already builds (pure-Rust RSA), so the
# RS256 assertion adds nothing to the dependency tree.
jwt-simple = { version = "0.12.11", default-features = false, features = ["pure-rust"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
# The only adapter shipped here; a test implements `FcmTransport` itself.
reqwest-transport = ["dep:reqwest"]

[lints]
workspace = true

[lib]
doctest = false
