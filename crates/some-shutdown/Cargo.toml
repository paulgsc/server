[package]
name = "some-shutdown"
description = "The one shutdown signal every service waits on: Ctrl-C or SIGTERM"
categories = ["os::unix-apis"]
keywords = ["shutdown", "signal", "sigterm"]
readme = "README.md"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
# `rt`: `tokio::signal::unix::signal` registers with the runtime's driver.
# `tests/sigterm.rs` uses these features too (`#[tokio::test]`).
tokio = { workspace = true, features = ["macros", "rt", "signal"] }
tracing = { workspace = true }

[lints]
workspace = true

[lib]
test = false
doctest = false
