[package]
name = "rust_runner"
description = "Compiles and runs one Rust program under limits, for LeetType's recorder and the rust-runner service that records Rust Rounds"
readme = "README.md"
categories = ["development-tools"]
keywords = ["rustc", "runner", "sandbox", "rust-rounds"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
# `serve` and `ask`'s arguments, the one config a binary reads (#484).
clap = { workspace = true }
# `kill(-pgid)` as a system call, so killing a program's process group never
# needs a process of its own; `getuid`, the not-dumpable and (`thread`)
# no-new-privileges flags; and (`net`) `SO_PEERCRED`, so the service serves
# only its clients' uids.
rustix = { version = "1.1.5", features = ["process", "net", "thread"] }
# The protocol and what a recording holds, which a client links alone.
rust_rounds_wire = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# A fresh directory per program, removed when it is done.
tempfile = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "rust-runner"
path = "src/bin/rust_runner.rs"
