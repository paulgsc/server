[package]
name = "mailbox_kit"
description = "A client for the Jobs mailbox (paulgsc/some-ui apps/mailbox) — list, get and put, behind a transport seam"
categories = ["web-programming"]
keywords = ["mailbox", "cloudflare", "client", "jobs"]
readme = "README.md"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10.9"

reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
# The only adapter shipped here; a test implements `MailboxTransport` itself.
reqwest-transport = ["dep:reqwest"]

[lints]
workspace = true

[lib]
doctest = false
