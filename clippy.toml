allow-dbg-in-tests = true
allow-unwrap-in-tests = true
too-many-arguments-threshold = 7
too-many-lines-threshold = 100
type-complexity-threshold = 250
enum-variant-size-threshold = 200
# `..` keeps clippy's defaults. WebAuthn is the standard's own spelling, not an
# identifier to backtick (`doc_markdown`).
doc-valid-idents = ["WebAuthn", ".."]

# --- Tracing safety enhancements ---

# Prevent accidental expensive serialization before logging
disallowed-methods = [
  { path = "serde_json::to_string", reason = "expensive before tracing; prefer tracing!(?value)" },
  { path = "serde_json::to_vec", reason = "expensive before tracing; prefer tracing!(?value)" },
  # file_host's route inventory is recorded as routes are registered, so a
  # route registered any other way is served but missing from the client's
  # snapshot. See apps/servers/file_host/src/routes/table.rs.
  { path = "axum::routing::Router::route", reason = "register on file_host::routes::table::RouteTable so the route inventory records it" },
  # Each binary reads its environment through one clap `Config` (#410, #484):
  # a value read around it is one that can fall back to a default when it
  # does not parse, instead of stopping the binary at start. Libraries take
  # their config from their caller. The reads that are not configuration (a
  # build script's inputs, what `leetype_runner` forwards to a child, a test's
  # own marker) and file_host's retired-variable check carry an `#[allow]`
  # saying so.
  { path = "std::env::var", reason = "declare it on the binary's clap Config (`env = \"...\"`) and pass the value down (#484)" },
  { path = "std::env::var_os", reason = "declare it on the binary's clap Config (`env = \"...\"`) and pass the value down (#484)" },
  { path = "std::env::vars", reason = "declare it on the binary's clap Config (`env = \"...\"`) and pass the value down (#484)" },
  { path = "std::env::vars_os", reason = "declare it on the binary's clap Config (`env = \"...\"`) and pass the value down (#484)" },
  { path = "dotenvy::var", reason = "declare it on the binary's clap Config (`env = \"...\"`) and pass the value down (#484)" },
  { path = "dotenvy::vars", reason = "declare it on the binary's clap Config (`env = \"...\"`) and pass the value down (#484)" },
  { path = "tracing_subscriber::EnvFilter::from_default_env", reason = "reads RUST_LOG around the Config, ignoring a bad one; declare RUST_LOG there and use EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::EnvFilter::try_from_default_env", reason = "reads RUST_LOG around the Config; declare RUST_LOG there and use EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::EnvFilter::from_env", reason = "reads the environment around the Config, ignoring a bad value; declare it there and use EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::EnvFilter::try_from_env", reason = "reads the environment around the Config; declare it there and use EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::filter::Builder::from_env", reason = "reads the environment around the Config; declare it there and use EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::filter::Builder::from_env_lossy", reason = "reads the environment around the Config, dropping a bad value; declare it there and use EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::filter::Builder::try_from_env", reason = "reads the environment around the Config; declare it there and use EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::fmt::init", reason = "reads RUST_LOG around the Config; declare RUST_LOG there and build the subscriber with EnvFilter::try_new (#484)" },
  { path = "tracing_subscriber::fmt::try_init", reason = "reads RUST_LOG around the Config; declare RUST_LOG there and build the subscriber with EnvFilter::try_new (#484)" },
]

# Ban std logging macros (enforce tracing-only)
disallowed-macros = [
  { path = "std::format", reason = "may cause eager allocation; use tracing!(?value) or lazy display" },
  { path = "std::println", reason = "use tracing macros instead" },
  { path = "std::eprintln", reason = "use tracing macros instead" },
  { path = "std::dbg", reason = "use tracing::debug!(?value) or allow only in tests (see allow-dbg-in-tests)" },
]

# --- Privacy (#371/#372) ---

# The peer's address reaches file_host only through `net::Peer`, which turns
# it into a keyed, daily-rotating `PeerKey` before anything else sees it. That
# one reader carries an `#[allow]`; anywhere else, holding the raw address is
# a lint error. See docs/identity.md.
disallowed-types = [
  { path = "axum::extract::ConnectInfo", reason = "privacy: use file_host::net::Peer, which yields a keyed PeerKey instead of the address (docs/identity.md)" },
]
