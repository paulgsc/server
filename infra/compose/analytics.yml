services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      # Box only: Caddy on the host (paulgsc/dotfiles, nixos/subdomains)
      # serves it to the LAN as https://metabase.home.maishatu.com.
      - '127.0.0.1:3030:3000'
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      # The address browsers use, for links in emails, embeds and exports.
      - MB_SITE_URL=${METABASE_SITE_URL:-https://metabase.home.maishatu.com}
      - JAVA_OPTS=-Xmx1500m -Xms512m
    volumes:
      # METABASE_DATA_DIR: where Metabase keeps its own database, and
      # DATABASES_DIR: the directory of SQLite databases it reads, at /data.
      # HOST-SPECIFIC defaults: the nixos.local dev host's storage mount
      # (#406); another host sets both.
      - ${METABASE_DATA_DIR:-/mnt/storage/users/dev/metabase-data}:/metabase-data
      - ${DATABASES_DIR:-/mnt/storage/users/dev/databases}:/data:rw
    networks:
      - monitoring-network
    mem_limit: 2G
    cpus: 1.5
    pids_limit: 500
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
          pids: 500
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
