services:
  file-host:
    image: pgathondu/server:latest
    container_name: file-host-server
    # Pass all variables from your .env file into the container, if present:
    env_file:
      - path: ${REPO_ROOT}/.env
        required: false
    ports:
      # Box only: Caddy on the host serves it to the LAN, the phone included,
      # as https://file-host.home.maishatu.com (paulgsc/dotfiles,
      # nixos/subdomains). Other containers use file-host-server:3000 on
      # shared-dev-network; some-ui's www needs FILE_HOST_UPSTREAM set to
      # that, since the Docker host gateway is not 127.0.0.1. A 0.0.0.0
      # publish skips the host firewall: Docker forwards published ports
      # ahead of the INPUT chain that firewall filters.
      - '127.0.0.1:3000:3000'
    environment:
      - RUST_LOG=${RUST_LOG:-info,async_nats=warn}
      - RUST_BACKTRACE=1
      - TOKIO_WORKER_THREADS=${TOKIO_WORKER_THREADS:-4}
      - POLARS_MAX_THREADS=${POLARS_MAX_THREADS:-4}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=sqlite:///app/dbs/hopium.db
      - SQLX_OFFLINE=false
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
    volumes:
      # HOST-SPECIFIC: the nixos.local dev host's storage mount (#406). Any
      # other host must change this path (example.env's STORAGE is the same one).
      - /mnt/storage/users/dev/databases/hopium:/app/dbs
      - ${REPO_ROOT}/data:/app/data:rw
      - ${REPO_ROOT}/config:/app/config:ro
      - ${REPO_ROOT}/logs:/app/logs:rw
      # The voice-note transcriber's models, read-only: the multilingual
      # Whisper model and the Silero VAD model `nix/whisper-manager`'s
      # `whisper fetch` downloads. TRANSCRIBE_MODEL and TRANSCRIBE_VAD_MODEL
      # default to these under /models. HOST-SPECIFIC default: the
      # nixos.local dev host's models directory (#406); another host sets
      # TRANSCRIBE_MODELS_DIR.
      - ${TRANSCRIBE_MODELS_DIR:-/mnt/storage/users/dev/models/whisper-models}:/models:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    # Bounds how long whatever this container writes to stdout lives. The
    # default `json-file` driver keeps it until the container is removed, with
    # no size cap. `file_host` writes no peer address to a log line, but its
    # logs and exported spans do carry subject ids (docs/identity.md, "What is
    # still exposed"), so they get a horizon too.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    mem_limit: 4G
    cpus: 2.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 200
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ['CMD', '/usr/local/bin/file_host', '--health-check']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
