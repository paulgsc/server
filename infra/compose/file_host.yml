services:
  file-host:
    image: ${IMAGE_FILE_HOST:?deploy/<role>/release.json sets it, so run compose through make up or make compose}
    container_name: file-host-server
    # Who the kernel kills first when home runs out of memory: protected
    # (docs/home-compute.md, "Who is killed first").
    oom_score_adj: -500
    # The binary whose variables `make preflight` checks this service's
    # environment against (infra/env/file_host.json, #504).
    labels:
      env-schema: file_host
    env_file:
      # file_host's own variables and nothing else: deploy/<role>/file_host.sops.env,
      # decrypted by `make up` (or `make compose`) to tmpfs, mode 600, and
      # removed once compose has read it (#614). ENV_DIR is where: envctl
      # sets it to its run's own $XDG_RUNTIME_DIR/server/<pid>. Required,
      # because without it the container would start on none of its variables.
      - path: ${ENV_DIR:?make sets ENV_DIR, so run compose through make up or make compose}/file_host.env
        required: true
    ports:
      # Box only: Caddy on the host serves it to the LAN, the phone included,
      # as https://file-host.home.maishatu.com (paulgsc/dotfiles,
      # nixos/subdomains). Other containers use file-host-server:3000 on
      # shared-dev-network, which is www's image default
      # (infra/compose/www.yml). A 0.0.0.0
      # publish skips the host firewall: Docker forwards published ports
      # ahead of the INPUT chain that firewall filters.
      - '127.0.0.1:3000:3000'
    environment:
      - RUST_BACKTRACE=1
      # Whose X-Forwarded-For names the client (net::TrustedProxies): only
      # this container's default gateway, where the host's processes, Caddy
      # among them, reach the port above from. file_host reads it at start,
      # since the daemon picks the bridge's subnet. Never a range: anyone
      # trusted can choose its own rate-limit bucket, and a range would trust
      # every container on shared-dev-network and LAN addresses with them.
      # Without this, every client on the LAN is one peer: one bucket for
      # the phone, the laptop and everything else.
      - TRUSTED_PROXIES=gateway
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=sqlite:///app/dbs/hopium.db
    volumes:
      # STORAGE: the host directory holding file_host's SQLite database, mounted
      # at /app/dbs (DATABASE_URL above). A deployment constant, so it has no
      # default here: each role's compose.sops.env sets it (#614). The call's
      # weeks are written beside it, in call-weeks/ (call_weeks::RENDER_FOLDER),
      # for the render worker (infra/compose/call-render.yml).
      - ${STORAGE:?set STORAGE in deploy/<role>/compose.sops.env}:/app/dbs
      - ${STATE_ROOT:?envctl sets STATE_ROOT, so run compose through make up or make compose}/data:/app/data:rw
      - ${STATE_ROOT:?envctl sets STATE_ROOT, so run compose through make up or make compose}/config:/app/config:ro
      - ${STATE_ROOT:?envctl sets STATE_ROOT, so run compose through make up or make compose}/logs:/app/logs:rw
      # The voice-note transcriber's models, read-only: the multilingual
      # Whisper model and the Silero VAD model `nix/whisper-manager`'s
      # `whisper fetch` downloads. transcribe::MODEL and transcribe::VAD_MODEL
      # name these under /models, and meaning::DIR the take library's
      # meaning model, which the same fetch puts in its own directory beside
      # them (read only when MEANING_ENABLED). TRANSCRIBE_MODELS_DIR: that
      # directory on the host, set in each role's compose.sops.env (#614).
      - ${TRANSCRIBE_MODELS_DIR:?set TRANSCRIBE_MODELS_DIR in deploy/<role>/compose.sops.env}:/models:ro
      # The rust-runner's socket (infra/compose/rust_runner.yml), where
      # rust_rounds::SOCKET names: Rust Rounds' recording pass asks the
      # runner there, as uid 10000, the one client uid it serves. Read-only:
      # connecting needs no write to the volume, and file-host may put
      # nothing beside the socket (RX2 checks the directory holds only it).
      - rust_runner_socket:/run/rust-runner:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    # Bounds how long whatever this container writes to stdout lives. The
    # default `json-file` driver keeps it until the container is removed, with
    # no size cap. `file_host` writes no peer address to a log line, but its
    # logs and exported spans do carry subject ids (docs/identity.md, "What is
    # still exposed"), so they get a horizon too.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      # Its migrations, applied by their own step before it starts, every
      # `up` (file-host-migrate, below). The server never migrates: its start
      # refuses a database behind its build (migrate::require_current).
      file-host-migrate:
        condition: service_completed_successfully
    mem_limit: 4G
    # Three cores, so the transcriber hears on two threads: docs/home-compute.md.
    cpus: 3.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
          pids: 200
        reservations:
          cpus: '0.5'
          memory: 1G
    # Fails only when /ready says unavailable (a critical dependency down),
    # not when it says degraded: see apps/servers/file_host/src/health.rs.
    # It covers serving and nothing else: the migrations and their backup
    # are file-host-migrate's, which compose finishes before this container
    # starts, so no migration's time counts against it (C1620: a start that
    # copied the database first outlasted the old 300 s window and rolled
    # release 186 back). start_period is a start's own: the server reads that
    # the schema is current, opens its pool and listens. start_interval probes
    # every 5 s meanwhile (Docker Engine 25+), so a ready container reads
    # healthy within seconds. Home's deploy (`make home-deploy`, `envctl
    # deploy`, AS18 #564) waits on this to decide whether to roll the image
    # back, and its bound (DEFAULT_READY_TIMEOUT) is above start_period.
    healthcheck:
      test: ['CMD', '/usr/local/bin/file_host', '--health-check']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 5s

  # file_host's migrations, after a verified backup, as their own step: a
  # one-shot on file-host's own image (`file_host --migrate`,
  # apps/servers/file_host/src/migrate.rs), which compose runs to completion
  # before it starts file-host, on every `up`: `make up`, `make home-deploy`
  # and the deploy's rollback alike. With nothing pending it reads one table
  # and exits. With migrations pending, the backup is Litestream's replica
  # (infra/compose/litestream.yml): the step asks Litestream over its control
  # socket to sync, and applies nothing until the replica has caught up to the
  # database at a TXID its level 1 keeps, so it restores for the retention
  # (owner, 2026-11-10: a backup on every migrating run, on the database's own
  # disk). That waits for Litestream's next compaction, at most about 30 s. It copies nothing. A refusal or a failed migration
  # exits non-zero, so compose does not start file-host on the build that
  # needed it, and the deploy puts the previous release back.
  #
  # A reboot or a restart starts file-host again on the image this step
  # already migrated for, so it is not run then (`restart: 'no'`); a file-host
  # whose database is behind it refuses to start, naming this step.
  file-host-migrate:
    # file-host's image, the same reference (deploy/home/release.json; envctl
    # check refuses a release where the two differ).
    image: ${IMAGE_FILE_HOST_MIGRATE:?deploy/<role>/release.json sets it, so run compose through make up or make compose}
    container_name: file-host-migrate
    # Who the kernel kills first when home runs out of memory: protected, as
    # file-host is: it is file-host's own start (docs/home-compute.md).
    oom_score_adj: -500
    # The replica's directory is the one infra/litestream/litestream.yml
    # names, as both containers mount ${STORAGE} at /app/dbs.
    command: ['--migrate', '--replica-socket', '/run/litestream/control.sock', '--replica-dir', '/app/dbs/litestream/hopium']
    # It parses file_host's whole configuration, as the server does, so it
    # reads the same variables (infra/env/file_host.json, #504).
    labels:
      env-schema: file_host
    env_file:
      - path: ${ENV_DIR:?make sets ENV_DIR, so run compose through make up or make compose}/file_host.env
        required: true
    environment:
      - RUST_BACKTRACE=1
      - TRUSTED_PROXIES=gateway
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=sqlite:///app/dbs/hopium.db
    volumes:
      # The database, at the path Litestream's configuration names it
      # (infra/litestream/litestream.yml), so the step asks for the database
      # it opens.
      - ${STORAGE:?set STORAGE in deploy/<role>/compose.sops.env}:/app/dbs
      # Litestream's control socket, read-only: connecting writes nothing.
      - litestream_socket:/run/litestream:ro
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      litestream:
        condition: service_started
    # A migration rebuilds a table through SQLite's page cache and temp
    # files, not in memory, so it needs far less than the server.
    mem_limit: 1G
    cpus: 1.0
    pids_limit: 50
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 50
