services:
  file-host:
    image: pgathondu/server:latest
    container_name: file-host-server
    # Pass all variables from your .env file into the container, if present:
    env_file:
      - path: ${REPO_ROOT}/.env
        required: false
    ports:
      - '3000:3000'
    environment:
      - RUST_BACKTRACE=1
      - TOKIO_WORKER_THREADS=${TOKIO_WORKER_THREADS:-4}
      - POLARS_MAX_THREADS=${POLARS_MAX_THREADS:-4}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=sqlite:///app/dbs/hopium.db
      - SQLX_OFFLINE=false
      - CLIENT_SECRET_FILE=/app/secrets/client_secret_file.json
      - HMAC_KEY=${HMAC_KEY:-placeholder}
      - GITHUB_API_TOKEN=${GITHUB_API_TOKEN:-placeholder}
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
    volumes:
      - /mnt/storage/users/dev/databases/hopium:/app/dbs
      - ${REPO_ROOT}/data:/app/data:rw
      - ${REPO_ROOT}/client_secret_file.json:/app/secrets/client_secret_file.json:ro
      - ${REPO_ROOT}/config:/app/config:ro
      - ${REPO_ROOT}/logs:/app/logs:rw
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    mem_limit: 4G
    cpus: 2.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 200
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ['CMD', '/usr/local/bin/file_host', '--health-check']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
