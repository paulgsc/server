services:
  file-host:
    image: pgathondu/server:latest
    # Pass all variables from your .env file into the container, if present:
    env_file:
      - path: ${REPO_ROOT}/.env
        required: false
    ports:
      - '3000:3000'
    environment:
      - RUST_LOG=${RUST_LOG:-info,async_nats=warn}
      - RUST_BACKTRACE=1
      - TOKIO_WORKER_THREADS=${TOKIO_WORKER_THREADS:-4}
      - POLARS_MAX_THREADS=${POLARS_MAX_THREADS:-4}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=sqlite:///app/dbs/hopium.db
      - SQLX_OFFLINE=false
      - HMAC_KEY=${HMAC_KEY:-placeholder}
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
    volumes:
      - /mnt/storage/users/dev/databases/hopium:/app/dbs
      - ${REPO_ROOT}/data:/app/data:rw
      - ${REPO_ROOT}/config:/app/config:ro
      - ${REPO_ROOT}/logs:/app/logs:rw
    # A fixed container_name can't be shared by more than one replica, so it
    # isn't set here — infra/prometheus/*.yml and
    # scripts/check_scrape_inventory.py still target `file-host-server:3000`
    # by that name, so it lives on as a network alias instead. Under plain
    # `docker compose up` this resolves to the one container exactly as
    # container_name used to; under the Swarm rollout
    # (file_host.swarm.yml) it resolves to the service's VIP.
    networks:
      monitoring-network:
        aliases: [file-host-server]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    mem_limit: 4G
    cpus: 2.0
    pids_limit: 200
    # Long enough for an upgraded WebSocket connection to drain during a
    # rolling replacement; harmless for a plain `docker compose down` since
    # the SIGTERM handler below exits as soon as its own cleanup finishes.
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 200
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ['CMD', '/usr/local/bin/file_host', '--health-check']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
