services:
  file-host:
    image: pgathondu/server:latest
    container_name: file-host-server
    # The binary whose variables `make preflight` checks this service's
    # environment against (infra/env/file_host.json, #504).
    labels:
      env-schema: file_host
    env_file:
      # file_host's own variables and nothing else: deploy/<role>/file_host.sops.env,
      # decrypted by `make up` (or `make compose`) to tmpfs, mode 600, and
      # removed once compose has read it (#614). ENV_DIR is where: envctl
      # sets it to its run's own $XDG_RUNTIME_DIR/server/<pid>. Required,
      # because without it the container would start on none of its variables.
      - path: ${ENV_DIR:?make sets ENV_DIR, so run compose through make up or make compose}/file_host.env
        required: true
    ports:
      # Box only: Caddy on the host serves it to the LAN, the phone included,
      # as https://file-host.home.maishatu.com (paulgsc/dotfiles,
      # nixos/subdomains). Other containers use file-host-server:3000 on
      # shared-dev-network; some-ui's www needs FILE_HOST_UPSTREAM set to
      # that, since the Docker host gateway is not 127.0.0.1. A 0.0.0.0
      # publish skips the host firewall: Docker forwards published ports
      # ahead of the INPUT chain that firewall filters.
      - '127.0.0.1:3000:3000'
    environment:
      - RUST_LOG=${RUST_LOG:-info,async_nats=warn}
      - RUST_BACKTRACE=1
      - TOKIO_WORKER_THREADS=${TOKIO_WORKER_THREADS:-4}
      - POLARS_MAX_THREADS=${POLARS_MAX_THREADS:-4}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=sqlite:///app/dbs/hopium.db
      - SQLX_OFFLINE=false
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
    volumes:
      # STORAGE: the host directory holding file_host's SQLite database, mounted
      # at /app/dbs (DATABASE_URL above). A deployment constant, so it has no
      # default here: each role's compose.sops.env sets it (#614).
      - ${STORAGE:?set STORAGE in deploy/<role>/compose.sops.env}:/app/dbs
      - ${REPO_ROOT:?make sets REPO_ROOT, so run compose through make up or make compose}/data:/app/data:rw
      - ${REPO_ROOT:?make sets REPO_ROOT, so run compose through make up or make compose}/config:/app/config:ro
      - ${REPO_ROOT:?make sets REPO_ROOT, so run compose through make up or make compose}/logs:/app/logs:rw
      # The voice-note transcriber's models, read-only: the multilingual
      # Whisper model and the Silero VAD model `nix/whisper-manager`'s
      # `whisper fetch` downloads. transcribe::MODEL and transcribe::VAD_MODEL
      # name these under /models. TRANSCRIBE_MODELS_DIR: that
      # directory on the host, set in each role's compose.sops.env (#614).
      - ${TRANSCRIBE_MODELS_DIR:?set TRANSCRIBE_MODELS_DIR in deploy/<role>/compose.sops.env}:/models:ro
      # The rust-runner's socket (infra/compose/rust_runner.yml), where
      # rust_rounds::SOCKET names: Rust Rounds' recording pass asks the
      # runner there, as uid 10000, the one client uid it serves. Read-only:
      # connecting needs no write to the volume, and file-host may put
      # nothing beside the socket (RX2 checks the directory holds only it).
      - rust_runner_socket:/run/rust-runner:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    # Bounds how long whatever this container writes to stdout lives. The
    # default `json-file` driver keeps it until the container is removed, with
    # no size cap. `file_host` writes no peer address to a log line, but its
    # logs and exported spans do carry subject ids (docs/identity.md, "What is
    # still exposed"), so they get a horizon too.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    mem_limit: 4G
    cpus: 2.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 200
        reservations:
          cpus: '0.5'
          memory: 1G
    # Fails only when /ready says unavailable (a critical dependency down),
    # not when it says degraded: see apps/servers/file_host/src/health.rs.
    healthcheck:
      test: ['CMD', '/usr/local/bin/file_host', '--health-check']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
