services:
  file-host:
    image: pgathondu/server:latest
    container_name: file-host-server
    # The binary whose variables `make preflight` checks this service's
    # environment against (infra/env/file_host.json, #504).
    labels:
      env-schema: file_host
    env_file:
      # Every "ours" setting of file_host, decided per host in git (CFG9,
      # #604). Only this file reaches the container whole; the box's .env
      # reaches it through the names `environment:` lists below.
      # DEPLOY: the deploy/ role this host runs, `home` on the box. Each
      # container takes deploy/<role>/<binary>.env; `make dev` takes
      # deploy/dev/ itself, without compose.
      # REPO_ROOT: this checkout's absolute path. Every service mounts files
      # from under it; required, because with it unset /data, /config and
      # /logs were bind-mounted from the host's root (#407). HOST-SPECIFIC:
      # wherever the checkout is.
      - path: ${REPO_ROOT:?set REPO_ROOT in .env to this checkout's absolute path}/deploy/${DEPLOY:?set DEPLOY in .env to the deploy/ role this host runs, home on the box}/file_host.env
        required: true
    ports:
      # Box only: Caddy on the host serves it to the LAN, the phone included,
      # as https://file-host.home.maishatu.com (paulgsc/dotfiles,
      # nixos/subdomains). Other containers use file-host-server:3000 on
      # shared-dev-network; some-ui's www needs FILE_HOST_UPSTREAM set to
      # that, since the Docker host gateway is not 127.0.0.1. A 0.0.0.0
      # publish skips the host firewall: Docker forwards published ports
      # ahead of the INPUT chain that firewall filters.
      - '127.0.0.1:3000:3000'
    environment:
      # Compose's own network: these win over the deployment file.
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=sqlite:///app/dbs/hopium.db
      - RUST_LOG=${RUST_LOG:-info,async_nats=warn}
      - RUST_BACKTRACE=1
      - TOKIO_WORKER_THREADS=${TOKIO_WORKER_THREADS:-4}
      - POLARS_MAX_THREADS=${POLARS_MAX_THREADS:-4}
      # From the box's .env, each only when it sets it: file_host's secrets
      # and the neutral variables an override may change. Exactly those
      # (`make deploy-check`): an "ours" variable is decided in the
      # deployment file, never here.
      - MAX_IN_FLIGHT
      - FILE_HOST_BIND
      - FILE_HOST_PORT
      - FILE_HOST_PORT_FALLBACK
      - FILE_HOST_PORT_FILE
      - RATE_LIMIT
      - CACHE_TTL
      - MAX_REQUEST_SIZE_MB
      - MAX_CONCURRENT_REQUESTS
      - TASK_TIMEOUT_MS
      - VAPID_PRIVATE_KEY
      - NUDGE_WAKER_SECONDS
      - PUSH_DELIVERY_TIMEOUT_MS
      - WAKER_PASS_DEADLINE_MS
      - NUDGE_PRESENCE_LEASE_TTL_SECONDS
      - MAILBOX_TOKEN
      - MAILBOX_SECONDS
      - MAILBOX_ARCHIVE_TOKEN
      - TRANSCRIBE_VAD_MODEL
      - TRANSCRIBE_THREADS
      - TRANSCRIBE_DEADLINE_SECONDS
      - TRANSCRIBE_SECONDS
      - RUST_ROUNDS_SOCKET
      - RUST_ROUNDS_SECONDS
      - RUST_ROUNDS_PASS_DEADLINE_SECONDS
      - GAME_FEED_SCOREBOARD_SECONDS
      - GAME_FEED_LIVE_SECONDS
      - GAME_FEED_BACKOFF_CAP_SECONDS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_TRACES_SAMPLER
      - OTEL_TRACES_SAMPLER_ARG
      - OTEL_SERVICE_NAME
    volumes:
      # STORAGE: the host directory holding file_host's SQLite database, mounted
      # at /app/dbs (DATABASE_URL above). HOST-SPECIFIC default: the nixos.local
      # dev host's storage mount (#406); another host sets STORAGE.
      - ${STORAGE:-/mnt/storage/users/dev/databases/hopium}:/app/dbs
      - ${REPO_ROOT:?set REPO_ROOT in .env to this checkout's absolute path}/data:/app/data:rw
      - ${REPO_ROOT:?set REPO_ROOT in .env to this checkout's absolute path}/config:/app/config:ro
      - ${REPO_ROOT:?set REPO_ROOT in .env to this checkout's absolute path}/logs:/app/logs:rw
      # The voice-note transcriber's models, read-only: the multilingual
      # Whisper model and the Silero VAD model `nix/whisper-manager`'s
      # `whisper fetch` downloads. TRANSCRIBE_MODEL and TRANSCRIBE_VAD_MODEL
      # default to these under /models. HOST-SPECIFIC default: the
      # nixos.local dev host's models directory (#406); another host sets
      # TRANSCRIBE_MODELS_DIR.
      - ${TRANSCRIBE_MODELS_DIR:-/mnt/storage/users/dev/models/whisper-models}:/models:ro
      # The rust-runner's socket (infra/compose/rust_runner.yml), where
      # RUST_ROUNDS_SOCKET defaults to: Rust Rounds' recording pass asks the
      # runner there, as uid 10000, the one client uid it serves. Read-only:
      # connecting needs no write to the volume, and file-host may put
      # nothing beside the socket (RX2 checks the directory holds only it).
      - rust_runner_socket:/run/rust-runner:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    # Bounds how long whatever this container writes to stdout lives. The
    # default `json-file` driver keeps it until the container is removed, with
    # no size cap. `file_host` writes no peer address to a log line, but its
    # logs and exported spans do carry subject ids (docs/identity.md, "What is
    # still exposed"), so they get a horizon too.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    mem_limit: 4G
    cpus: 2.0
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 200
        reservations:
          cpus: '0.5'
          memory: 1G
    # Fails only when /ready says unavailable (a critical dependency down),
    # not when it says degraded: see apps/servers/file_host/src/health.rs.
    healthcheck:
      test: ['CMD', '/usr/local/bin/file_host', '--health-check']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
