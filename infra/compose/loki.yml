#
# Log aggregation: makes the Tracing Error Events by Target panel's counts
# answerable with the actual log line, not just "how many, from which
# module" — see infra/grafana/dashboards/lib/panels.libsonnet's
# fileHostLogs panel. loki-config.yml sets real retention from day one
# (see its own header comment); promtail ships every container's stdout
# into it via the Docker API, unaffected by cadvisor's own container-label
# whitelisting trouble (infra/compose/monitoring.yml).
#
services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - monitoring-network
    # No host port: loki-config.yml sets auth_enabled: false, meaning
    # anything that can reach this port can read every container's logs.
    # Grafana (the datasource) and Prometheus (the loki scrape job) both
    # reach it as `loki:3100` over monitoring-network already — publishing
    # it to the host would expose an unauthenticated log API to the whole
    # LAN (or further) for no actual need; Explore in Grafana's own
    # already-published UI is how a human queries it.
    volumes:
      - ${REPO_ROOT}/infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    mem_limit: 512M
    cpus: 0.5
    pids_limit: 30
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 30
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # A read-only bind mount of the Docker socket only stops the mount point
  # itself from being replaced — it does nothing to restrict which Docker
  # API calls go over it. Anything with access to the raw socket has the
  # same practical control over the host as root, so a bug or supply-chain
  # compromise in promtail's own `latest`-tag image would too. This proxy
  # is the one thing in this compose stack that touches the real socket.
  #
  # CONTAINERS=1 is coarser than "discovery and logs": it's the whole GET
  # /containers/* prefix, which also covers /containers/{id}/json (full
  # inspect output, including any secrets passed via that container's own
  # `environment:` block) and /containers/{id}/archive (arbitrary file
  # reads from inside a container's filesystem view — a real risk here
  # specifically, since node_exporter and cadvisor both bind-mount the
  # host root read-only, and archive would expose that same host
  # filesystem through the API regardless of what's actually running
  # inside either of them). tecnativa/docker-socket-proxy has no finer
  # "logs only" grant than this, so the actual mitigation is network
  # isolation, not the permission flag: docker-proxy-network
  # (infra/compose/base.yml) is joined only by this service and promtail,
  # not shared-dev-network — every other workload in this stack (which
  # doesn't get a say in whether it's ever compromised) has no route to
  # this proxy at all, whatever CONTAINERS=1 would otherwise let it ask for.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks:
      - docker-proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Everything else (POST, EXEC, IMAGES, VOLUMES, NETWORKS, ...)
      # defaults off.
      - CONTAINERS=1
    mem_limit: 128M
    cpus: 0.25
    pids_limit: 20
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 20

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    networks:
      # loki (below) lives on monitoring-network; docker-socket-proxy
      # (above) deliberately doesn't — promtail is the one service that
      # needs both.
      - monitoring-network
      - docker-proxy-network
    volumes:
      - ${REPO_ROOT}/infra/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/promtail-data
    command:
      - '-config.file=/etc/promtail/promtail-config.yml'
    depends_on:
      loki:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    mem_limit: 256M
    cpus: 0.25
    pids_limit: 20
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 20
