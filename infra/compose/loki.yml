#
# Log aggregation: makes the Tracing Error Events by Target panel's counts
# answerable with the actual log line, not just "how many, from which
# module" — see infra/grafana/dashboards/lib/panels.libsonnet's
# fileHostLogs panel. loki-config.yml sets real retention from day one
# (see its own header comment); promtail ships every container's stdout
# into it via the Docker API, unaffected by cadvisor's own container-label
# whitelisting trouble (infra/compose/monitoring.yml).
#
services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - monitoring-network
    ports:
      - '3100:3100'
    volumes:
      - ${REPO_ROOT}/infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    mem_limit: 512M
    cpus: 0.5
    pids_limit: 30
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 30
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    networks:
      - monitoring-network
    volumes:
      - ${REPO_ROOT}/infra/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/promtail-data
      # Read-only: promtail talks to dockerd's API to discover containers
      # and stream their logs — it never touches the daemon's storage
      # directly, so this is the only access it needs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/promtail-config.yml'
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 256M
    cpus: 0.25
    pids_limit: 20
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 20
