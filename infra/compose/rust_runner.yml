# The rust-runner: Rust Rounds' sandboxed recorder (paulgsc/some-ui#2234,
# RR3). It compiles and runs programs a tutor wrote, and treats every one as
# hostile, whoever wrote it and however it arrived: there is no trusted
# source and no relaxed path. Its invariants (RX1-RX4) are in
# apps/servers/file_host/docs/leetype-execution.md; each line below that
# holds one says which.
#
# Not in docker-compose.yml's `include` yet: nothing asks it anything until
# file_host's recording pass (RR3's second slice) lands, and that change adds
# it to the stack, mounts the socket's volume into file-host, and gives it an
# inventory entry. Until then, run it on its own:
#
#   docker compose -f infra/compose/rust_runner.yml up -d
#   echo '{"ask":"toolchain"}' | docker compose -f infra/compose/rust_runner.yml \
#     exec -T --user 10002 rust-runner rust-runner ask
#
# `ask` runs as another uid (10002) so the runner's sweep (RX2), which kills
# every process of its own uid after each job, leaves the client alone.
# scripts/check_rust_runner_sandbox.py brings this file up as it is and runs
# the hostile programs against it.
services:
  rust-runner:
    image: pgathondu/rust-runner:latest
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rust-runner
    container_name: rust-runner
    # RX1: no network at all, not an internal one. A program shares the
    # runner's network namespace, so on any network it could reach whatever
    # else is on it (file_host included). The only way in is the socket.
    network_mode: none
    # tini as pid 1 reaps what the sweep kills; the runner is never pid 1, so
    # a program's orphans cannot pile up as zombies under it.
    init: true
    # RX1: a read-only root, the image's own non-root uid, no capabilities,
    # and no way to gain any (no setuid binary helps a program).
    read_only: true
    user: '10001:10001'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The only writable places: /work and the socket's directory, both
    # emptied by the runner after every job (RX2). No /tmp: rustc and its
    # linker get TMPDIR set to the program's own directory.
    tmpfs:
      # Each program's directory, emptied after every job. `exec` because
      # the compiled program runs from here; capped, so a program that fills
      # it fails its own run and nothing else.
      - /work:rw,exec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      # The socket, shared with whoever asks (file_host, in the next slice).
      - rust_runner_socket:/run/rust-runner
    # RX3: one job at a time is the service's own loop; these bound what one
    # job can take. pids counts threads too: the runner's own few, and the
    # program's, which `RUST_RUNNER_PROCESS_CEILING` holds below this.
    mem_limit: 1G
    memswap_limit: 1G
    cpus: 1.0
    pids_limit: 128
    ulimits:
      core: 0
    environment:
      # No secret ever: a program can read the runner's environment from
      # /proc, and rustc's include_str! can at compile time. Only the
      # runner's own settings, which the image already sets.
      - RUST_RUNNER_PROCESS_CEILING=64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '2'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128

volumes:
  # tmpfs, so a stale socket or anything a program wrote beside it goes with
  # the host's restart, and it is capped.
  rust_runner_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: 'size=1m,uid=10001,gid=10001,mode=0755'
