services:
  redis:
    image: ${IMAGE_REDIS:?deploy/<role>/release.json sets it, so run compose through make up or make compose}
    container_name: some-redis
    # Who the kernel kills first when home runs out of memory: protected
    # (docs/home-compute.md, "Who is killed first").
    oom_score_adj: -500
    ports:
      # Box only. No password; containers use redis:6379 on the network,
      # host tools (cargo tests, some-cache's default) use 127.0.0.1:6379.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - monitoring-network
    restart: unless-stopped
    mem_limit: 1G
    cpus: 1.0
    pids_limit: 50
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 50
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
