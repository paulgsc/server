# Swarm-only overlay for `file-host`'s production rollout.
#
# This is NOT a standalone stack: scripts/deploy-file-host.sh (the only
# supported way to apply this file) layers it directly on top of root
# docker-compose.yml — the same file `docker compose up` reads for local
# dev, `include:` list and all — then narrows the merged result to
# file-host's own service subgraph (file-host, redis, nats) by name. Root
# docker-compose.yml stays the one place every compose fragment is
# enumerated; nothing here or in the script re-lists fragment paths.
# file-host has no image/env/volumes/network-alias of its own in this
# overlay because those already live in file_host.yml and base.yml;
# duplicating them would let the definitions drift, and `docker stack
# deploy`'s own compose-file parser does not track the current Compose
# Specification the way `docker compose` does (docker/cli#2527 is still
# open), so this file also avoids anything beyond plain, decades-stable
# compose-v3 fields — see scripts/deploy-file-host.sh for how the two
# parsers' gap is bridged.
#
# Only file-host gets replica/rolling-update treatment. orchestrator,
# ollama, monitoring and analytics are intentionally left out of this
# rollout's service subgraph — they're internal services with no uptime
# SLA, so they stay on the plain `docker compose up` path where Swarm never
# even enters the picture, rather than riding along with default (single
# replica, restart-on-failure) Swarm semantics for no benefit.
services:
  file-host:
    image: ${FILE_HOST_IMAGE:?set FILE_HOST_IMAGE to an immutable tag or digest}
    deploy:
      mode: replicated
      replicas: ${FILE_HOST_REPLICAS:-2}
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 45s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 45s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 2m
