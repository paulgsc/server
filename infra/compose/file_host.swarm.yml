# Swarm-only overlay for `file-host`'s production rollout.
#
# This is NOT a standalone stack: it is layered on top of the same
# fragments `docker-compose.yml` already includes for local dev — base.yml
# (network/volumes), redis.yml and nats.yml (file-host's actual
# dependencies), and file_host.yml itself. See scripts/deploy-file-host.sh,
# which is the only supported way to apply this file. file-host has no
# image/env/volumes/network-alias of its own here because those already
# live in file_host.yml and base.yml; duplicating them would let the
# definitions drift, and `docker stack deploy`'s own compose-file parser
# does not track the current Compose Specification the way `docker compose`
# does (docker/cli#2527 is still open), so this file also avoids anything
# beyond plain, decades-stable compose-v3 fields — see
# scripts/deploy-file-host.sh for how the two parsers' gap is bridged.
#
# Only file-host gets replica/rolling-update treatment. orchestrator,
# ollama, monitoring and analytics are intentionally left out of this
# rollout stack entirely — they're internal services with no uptime SLA, so
# they stay on the plain `docker compose up` path where Swarm never even
# enters the picture, rather than riding along with default (single
# replica, restart-on-failure) Swarm semantics for no benefit.
services:
  file-host:
    image: ${FILE_HOST_IMAGE:?set FILE_HOST_IMAGE to an immutable tag or digest}
    deploy:
      mode: replicated
      replicas: ${FILE_HOST_REPLICAS:-2}
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 45s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 45s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 2m
