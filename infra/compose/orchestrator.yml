services:
  orchestrator:
    image: ${IMAGE_ORCHESTRATOR:?deploy/<role>/release.json sets it, so run compose through make up or make compose}
    container_name: orchestrator-service
    # Who the kernel kills first when home runs out of memory: interactive
    # (docs/home-compute.md, "Who is killed first").
    oom_score_adj: 0
    # The binary whose variables `make preflight` checks this service's
    # environment against (infra/env/orchestrator.json, #504).
    labels:
      env-schema: orchestrator
    # orchestrator's own variables, as file-host's are
    # (infra/compose/file_host.yml, #614).
    env_file:
      - path: ${ENV_DIR:?make sets ENV_DIR, so run compose through make up or make compose}/orchestrator.env
        required: true
    environment:
      RUST_BACKTRACE: "1"
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_started
    networks:
      - monitoring-network
    restart: unless-stopped
    # /metrics only — reachable by Prometheus on monitoring-network, never
    # published to the host. See #143 (C1): this service has no other HTTP
    # surface, and pipeline.yml's "no ports exposed" property is deliberate.
    expose:
      - '9464'
    # Healthy while its /metrics listener answers 200 (RELEASE R5, #794), so
    # the deploy gates it on `healthy`. Asked from inside the container over
    # bash's /dev/tcp: the image has no HTTP client, and the probe needs no
    # new binary, so the release's image already passes it. The listener
    # starts before NATS is reached, and a NATS it cannot reach at start ends
    # the process.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9464
          && printf 'GET /metrics HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' >&3
          && read -r -t 5 status <&3
          && [[ $$status == 'HTTP/1.'?' 200'* ]]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    mem_limit: 1G
    cpus: 1.0
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 100
        reservations:
          cpus: "0.25"
          memory: 256M
