services:
  orchestrator:
    image: pgathondu/orchestrator:latest
    container_name: orchestrator-service
    # The binary whose variables `make preflight` checks this service's
    # environment against (infra/env/orchestrator.json, #504).
    labels:
      env-schema: orchestrator
    # orchestrator's "ours" settings, per host in git, as file-host's are
    # (CFG9, #604; infra/compose/file_host.yml).
    env_file:
      - path: ${REPO_ROOT:?set REPO_ROOT in .env to this checkout's absolute path}/deploy/${DEPLOY:?set DEPLOY in .env to the deploy/ role this host runs, home on the box}/orchestrator.env
        required: true
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: "1"
      TOKIO_WORKER_THREADS: ${TOKIO_WORKER_THREADS:-4}
      NATS_URL: nats://nats:4222
      # From the box's .env when it sets it (neutral).
      METRICS_ADDR:
    depends_on:
      nats:
        condition: service_started
    networks:
      - monitoring-network
    restart: unless-stopped
    # /metrics only — reachable by Prometheus on monitoring-network, never
    # published to the host. See #143 (C1): this service has no other HTTP
    # surface, and pipeline.yml's "no ports exposed" property is deliberate.
    expose:
      - '9464'
    mem_limit: 1G
    cpus: 1.0
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 100
        reservations:
          cpus: "0.25"
          memory: 256M
