# Home's speaker for the weekly call (paulgsc/some-ui#2635, ST36's third
# slice). Kokoro v1.0 says each scene's words in its section's voice, the
# same bytes for the same words every time; infra/kokoro/say.py says how and
# infra/docker/Dockerfile.kokoro pins what. The call's recorder
# (paulgsc/some-ui `apps/www/tests/record/call.ts`, `--voices kokoro`) asks
# it at http://127.0.0.1:8880, on the box only.
#
#   make compose ARGS="up -d --build kokoro"
#   curl -s http://127.0.0.1:8880/health
services:
  kokoro:
    image: some-kokoro:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.kokoro
    container_name: kokoro
    restart: unless-stopped
    # Its own bridge: it needs nothing from the internet or the stack, and
    # the port below is the only way in.
    networks:
      - kokoro-network
    ports:
      - '127.0.0.1:8880:8880'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    cpus: 2.0
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 64
    healthcheck:
      test: ['CMD', '/app/.venv/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  kokoro-network:
    internal: false
