# Home makes the weekly call's video (paulgsc/some-ui#2635, ST36): every
# deterministic step after the written week runs here, the same bytes for the
# same week. Three services on one network that reaches nothing else:
#
# - `kokoro`, the speaker: Kokoro v1.0, seeded per line
#   (infra/kokoro/say.py; infra/docker/Dockerfile.kokoro pins what).
# - `call-stage`, the stage: the published home-network app image, pinned by
#   digest (the owner's choice on paulgsc/some-ui#2639), serving `/call`.
#   Bump the pin when the call's stage changes.
# - `render`, the worker (GWB10, paulgsc/some-ui#2084): for each week
#   `file_host` writes to ${STORAGE}/call-weeks (`call_weeks::RENDER_FOLDER`)
#   that has no video yet, it records the stage with each scene said by the
#   speaker and renders it (infra/render/render-calls.sh). Every video is kept
#   for good in ${STORAGE}/renders/call/<from>/ (the owner's choice on
#   paulgsc/some-ui#2640), on the same drive as home's database.
#
#   make compose ARGS="up -d --build kokoro call-stage render"
#   curl -s http://127.0.0.1:8880/health
services:
  kokoro:
    image: some-kokoro:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.kokoro
    container_name: kokoro
    # Who the kernel kills first when home runs out of memory: batch
    # (docs/home-compute.md, "Who is killed first").
    oom_score_adj: 800
    restart: unless-stopped
    networks:
      - call-render-network
      # A port can't be published from an internal network alone.
      - kokoro-network
    # On the box only, for `record:call --voices kokoro` run by hand.
    ports:
      - '127.0.0.1:8880:8880'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Measured on the week of Oct 30 (36 lines, paulgsc/some-ui#2635): the
    # speaker holds about 1.25 GB between lines and peaks at 2.02 GB inside
    # the longest. 2G killed it four times on Nov 6, when it also kept each
    # line's memory (infra/kokoro/say.py now hands it back).
    mem_limit: 3G
    cpus: 2.0
    # The render's weight (below), since the speaker is the render's work:
    # at the default weight it took home's CPU at full share while each
    # line was said, so the render yielded only in its ffmpeg phase (#707).
    cpu_shares: 256
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
          pids: 64
    healthcheck:
      test: ['CMD', '/app/.venv/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  call-stage:
    image: pgathondu/www:0.1.59@sha256:532130ec1cbcb98603b163a1a9e3dfc21e956b9642479816911e7f514611c6af
    container_name: call-stage
    # Who the kernel kills first when home runs out of memory: batch
    # (docs/home-compute.md, "Who is killed first").
    oom_score_adj: 800
    restart: unless-stopped
    networks:
      - call-render-network
    # Only the static files are served; infra/render/call-stage.nginx.conf
    # says why the image's own config is not used. nginx's entrypoint writes
    # its cache at start, so its root stays writable.
    volumes:
      - ../render/call-stage.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 256M
    cpus: 0.5
    pids_limit: 32
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 32

  render:
    image: some-render:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.render
    container_name: render
    # Who the kernel kills first when home runs out of memory: batch
    # (docs/home-compute.md, "Who is killed first").
    oom_score_adj: 800
    restart: unless-stopped
    depends_on:
      kokoro:
        condition: service_started
      call-stage:
        condition: service_started
      # file_host makes ${STORAGE}/call-weeks before it answers its health
      # check (call_weeks::start), so the folder is its own, never Docker's.
      file-host:
        condition: service_healthy
    networks:
      - call-render-network
    volumes:
      # Written by file_host (`call_weeks::RENDER_FOLDER`), read here only,
      # through `call_week_files` (below).
      - type: volume
        source: call_week_files
        target: /weeks
        read_only: true
        volume:
          nocopy: true
      # Every video and what it was made from, kept until the owner lets a
      # week go from My data (paulgsc/some-ui#2661). file_host makes the
      # folders under it (call_weeks::start) before it answers its health
      # check, as its own uid, which the worker runs as too (`user` below).
      - ${STORAGE:?set STORAGE in deploy/<role>/compose.sops.env}/renders:/renders:rw
      # The owner's files a template's series names, by their sums (the music
      # bed, paulgsc/some-ui#2673), read only. Never a repository's: the owner
      # puts them on home's drive.
      - ${STORAGE:?set STORAGE in deploy/<role>/compose.sops.env}/brand:/brand:ro
    # file_host's uid and gid (infra/docker/Dockerfile.server's `nonroot`):
    # what the worker writes is file_host's to delete when the owner lets a
    # week go, and nothing here runs as root.
    user: '10000:10001'
    read_only: true
    # Chromium's profile and the tools' caches only: a render's own files are
    # written on the drive (render-calls.sh's WORK), since what is written
    # here counts against mem_limit.
    tmpfs:
      - /tmp:size=1G
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4G
    cpus: 2.0
    # A quarter of the default weight: when home's own services want the CPU,
    # they get it first, and the render takes what is left over.
    cpu_shares: 256
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 512

volumes:
  # ${STORAGE}/call-weeks, where file_host writes each week, beside its
  # database. A volume bound to the folder, not a bind mount: Docker mounts a
  # volume when the worker starts, which is after file_host is healthy and has
  # made the folder (call_weeks::start), while a bind mount's folder must
  # exist when compose creates the worker, before anything starts, and one
  # Docker made would be root's, where file_host could never write. A folder
  # still missing then fails the start, and Docker never makes it.
  call_week_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE:?set STORAGE in deploy/<role>/compose.sops.env}/call-weeks

networks:
  # Internal: none of the three reaches the internet or the rest of the stack.
  # The stage's reads of paulgsc/testing are answered by the recorder from
  # the week file, and the speaker needs nothing.
  call-render-network:
    internal: true
  kokoro-network:
    internal: false
