# The call's stage (infra/compose/call-render.yml): the published home-network
# app's static files, served to the render worker alone. The image's own
# baked config is empty (paulgsc/some-ui#2652), and its compose template
# proxies home's services, which the stage needs none of.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
