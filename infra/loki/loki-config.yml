auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Unlike Prometheus (infra/compose/monitoring.yml's --storage.tsdb.retention.*
# flags), Loki does not self-limit disk usage by default — an unconfigured
# instance accumulates log chunks forever, the exact "blow up the disk"
# failure mode this repo already avoided for metrics. 7 days matches the
# rough order of Prometheus's own ~8.3-day/10GB retention; adjust here, not
# by editing chunks on disk.
limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
