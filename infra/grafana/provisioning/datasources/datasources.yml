apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit and stable across `grafana_data` volume resets — every
    # dashboard in infra/grafana/dashboards references this literal uid
    # (see lib/config.libsonnet). Without it Grafana generates one at
    # provisioning time and nothing checked in can predict it. See #218.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    # Same reasoning as Prometheus's own uid above — lib/config.libsonnet's
    # lokiDataSource pins this literal value.
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
