apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit and stable across `grafana_data` volume resets — every
    # dashboard in infra/grafana/dashboards references this literal uid
    # (see lib/config.libsonnet). Without it Grafana generates one at
    # provisioning time and nothing checked in can predict it. See #218.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
