apiVersion: 1

# One alert, scoped to the whole file_host server rather than to any single
# subsystem: `metrics::observability::ErrorEventMetricsLayer` mirrors every
# ERROR-level `tracing` event into `tracing_events_total{target}`, so this
# rule fires on a sustained increase from *any* target — the nudge config
# path that motivated it, a WS handler, a REST route, or anything else that
# hasn't earned a dedicated counter of its own. Routine 4xx responses log at
# WARN (apps/servers/file_host/src/error.rs's `into_response`), not ERROR,
# so ordinary client traffic (a bad token, a 404) never trips this — only
# genuine operational faults do.
#
# Grafana provisioning convention per infra/grafana/README.md's "Known trap"
# note (#220): this directory is bind-mounted read-only into
# /etc/grafana/provisioning by infra/compose/monitoring.yml's grafana
# service, so a file placed here is loaded automatically, not opt-in.

contactPoints:
  - orgId: 1
    name: file-host-operations
    receivers:
      - uid: file-host-error-slack
        type: slack
        settings:
          title: '{{ template "default.title" . }}'
          text: '{{ template "default.message" . }}'
        secureSettings:
          # See example.env's FILE_HOST_ALERT_SLACK_WEBHOOK_URL and
          # infra/compose/monitoring.yml's grafana service — Grafana
          # substitutes $-prefixed names in secureSettings from its own
          # process environment at provisioning time.
          url: $FILE_HOST_ALERT_SLACK_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: file-host-operations
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: file-host-operations
        object_matchers:
          - [alert_scope, '=', file_host_errors]
        # One notification per target rather than one bundled digest, so a
        # Slack message says which module faulted instead of "N firing".
        group_by:
          - target
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 4h

groups:
  - orgId: 1
    name: file-host-error-events
    folder: file_host operations
    interval: 1m
    rules:
      - uid: file-host-tracing-error-events
        title: file_host reported ERROR-level events
        condition: C
        data:
          # 15m window, 1m evaluation: the file_host Prometheus job scrapes
          # every 5s (infra/prometheus/prometheus.yml), and this needs to
          # catch a single boot-time failure — the nudge timezone case is
          # exactly one such non-recurring event — before the window closes.
          #
          # Plain `increase(...[15m])` alone misses exactly that case: a
          # target's series is born the instant its first ERROR fires, at
          # value 1, with no earlier "0" sample for Prometheus to diff
          # against — increase() needs 2+ samples to extrapolate a rate, so
          # a series that appears once and never changes again reads as a
          # flat, unchanging 1 forever, not an increase. The nudge-timezone
          # counter is exactly this shape (build_nudge runs once at
          # startup), so the naive query would silently never fire on the
          # one fault it exists to catch. The `unless ... offset 15m` half
          # below catches "this target's series didn't exist 15m ago" (a
          # pure label-presence check, needs only the one current sample);
          # the `increase()` half still handles a fresh error from a target
          # that was already known, so a quiet target correctly stops
          # firing ~15m after its last event either way.
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (
                  sum by (target) (tracing_events_total{level="error"})
                  unless
                  sum by (target) (tracing_events_total{level="error"} offset 15m)
                )
                or
                (
                  sum by (target) (increase(tracing_events_total{level="error"}[15m]))
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # Grafana's Threshold expression (refId C) evaluates per series when
        # its input has multiple label sets, so query A's `by (target)`
        # produces one alert instance per target rather than one collapsed
        # verdict — a REST fault and a WS fault page as two distinct alerts.
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          description: 'file_host logged a sustained ERROR-level event from {{ $labels.target }}. See the "Tracing Error Events by Target" panel on the file_host Operational Dashboard for the breakdown, and the file_host logs for the event this counter mirrors.'
          summary: 'file_host: ERROR-level events from {{ $labels.target }}'
        labels:
          alert_scope: file_host_errors
          severity: warning
        isPaused: false
