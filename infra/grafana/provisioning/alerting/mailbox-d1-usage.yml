apiVersion: 1

# The Jobs mailbox's Cloudflare D1 database, against its free plan's daily
# limits (5,000,000 rows read, 100,000 rows written per UTC day). Past either,
# every query fails until 00:00 UTC and the mailbox answers 503, so the
# warning has to come before the limit. Numbers from file_host's `d1_usage`
# collector (apps/servers/file_host/src/metrics/d1_usage.rs).
#
# No contact point or policy here: these route to the root policy's receiver
# in file-host-errors.yml (one notification policy tree per org).
#
# "No data" never reads as healthy: the two limit rules stay OK without data
# only because the third fires whenever the numbers are missing or stale
# while the collector is on, and the third itself alerts on no data at all
# (file_host not scraped).

groups:
  - orgId: 1
    name: mailbox-d1-usage
    folder: file_host operations
    interval: 5m
    rules:
      - uid: mailbox-d1-rows-written-near-limit
        title: Mailbox D1 rows written today past 80% of the free limit
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: d1_usage_rows_written_today / 100000
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [0.8]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Mailbox D1: {{ humanizePercentage $values.A.Value }} of today''s 100,000 row writes used'
          description: 'Past 100,000 rows written in a UTC day, every mailbox query fails until 00:00 UTC. A runaway writer (a poller putting on every pass) is the likely cause. See the MAILBOX dashboard.'
        labels:
          severity: warning

      - uid: mailbox-d1-rows-read-near-limit
        title: Mailbox D1 rows read today past 80% of the free limit
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: d1_usage_rows_read_today / 5000000
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [0.8]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Mailbox D1: {{ humanizePercentage $values.A.Value }} of today''s 5,000,000 row reads used'
          description: 'Past 5,000,000 rows read in a UTC day, every mailbox query fails until 00:00 UTC. See the MAILBOX dashboard.'
        labels:
          severity: warning

      - uid: mailbox-d1-usage-unknown
        title: Mailbox D1 usage is not being read
        condition: C
        data:
          # 1 when the collector is on and has not read the usage for three
          # intervals (or never has), 0 when it is off or fresh. Empty only
          # when file_host itself is not scraped: that is no data, and alerts.
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: |
                max(d1_usage_enabled)
                * on()
                (
                  (time() - max(d1_usage_last_success_timestamp_seconds or on() vector(0)))
                  > bool
                  (3 * max(d1_usage_interval_seconds or on() vector(300)))
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 10m
        annotations:
          summary: 'Mailbox D1 usage is unknown'
          description: 'The usage numbers on the MAILBOX dashboard are stale or missing, so the two limit alerts cannot fire. d1_usage_failing{error} names why (unauthorized: the CF_API_TOKEN cannot read the account).'
        labels:
          severity: warning
