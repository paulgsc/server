# promtool test rules home.test.yml: each alert in home.yml fires when its
# behaviour breaks, and stays quiet while it holds or is switched off.
# Times are seconds from 0, so a stamp of 0 was taken at the start.
rule_files:
  - home.yml
evaluation_interval: 1m
tests:
  - name: a mailbox poller that stopped is stale past interval + budget + 60 s
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_interval_seconds{job="file_host"}'
        values: '900x40'
      - series: 'mailbox_poll_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 17m
        alertname: MailboxPollerStale
        exp_alerts: []
      - eval_time: 19m
        alertname: MailboxPollerStale
        exp_alerts:
          - exp_labels:
              objective: MI3
              says: "The Jobs mailbox poller has not started a pass within its interval, its budget and a minute."
      - eval_time: 19m
        alertname: MailboxPollerMetricsMissing
        exp_alerts: []

  - name: a poller that keeps stamping, or is off, is not stale
    interval: 1m
    input_series:
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_interval_seconds{job="file_host"}'
        values: '900x40'
      - series: 'mailbox_poll_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0+60x40'
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '0x40'
      - series: 'nudge_waker_interval_seconds{job="file_host"}'
        values: '60x40'
      - series: 'nudge_waker_pass_deadline_seconds{job="file_host"}'
        values: '30x40'
      - series: 'nudge_waker_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
      - series: 'game_feed_enabled{job="file_host"}'
        values: '0x40'
      - series: 'game_feed_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MailboxPollerStale
        exp_alerts: []
      - eval_time: 30m
        alertname: NudgeWakerStale
        exp_alerts: []
      - eval_time: 30m
        alertname: GameFeedStale
        exp_alerts: []

  - name: a mailbox poller that is off is neither stale nor missing its stamp
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '0x40'
      - series: 'mailbox_poll_interval_seconds{job="file_host"}'
        values: '900x40'
      - series: 'mailbox_poll_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MailboxPollerStale
        exp_alerts: []
      - eval_time: 30m
        alertname: NudgeWakerMetricsMissing
        exp_alerts: []

  - name: a watcher that is on with no stamp at all is its own alert
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x20'
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x20'
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: MailboxPollerMetricsMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: MailboxPollerMetricsMissing
        exp_alerts:
          - exp_labels:
              objective: MI3
              says: "The Jobs mailbox poller is on, but home reports no pass at all."
      - eval_time: 6m
        alertname: NudgeWakerMetricsMissing
        exp_alerts:
          - exp_labels:
              objective: NW2
              says: "The study nudge waker is on, but home reports no pass at all."

  - name: a nudge waker that stopped is stale past interval + deadline + 60 s
    interval: 1m
    input_series:
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '1x10'
      - series: 'nudge_waker_interval_seconds{job="file_host"}'
        values: '60x10'
      - series: 'nudge_waker_pass_deadline_seconds{job="file_host"}'
        values: '30x10'
      - series: 'nudge_waker_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: NudgeWakerStale
        exp_alerts: []
      - eval_time: 3m
        alertname: NudgeWakerStale
        exp_alerts:
          - exp_labels:
              objective: NW2
              says: "The study nudge waker has not started a pass within its interval, its deadline and a minute."

  - name: a game feed that is on and stopped waking is stale after two minutes
    interval: 1m
    input_series:
      - series: 'game_feed_enabled{job="file_host"}'
        values: '1x10'
      - series: 'game_feed_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: GameFeedStale
        exp_alerts: []
      - eval_time: 3m
        alertname: GameFeedStale
        exp_alerts:
          - exp_labels:
              objective: GA4
              says: "The game feed has not woken for two minutes."

  - name: a routine with no run 30 minutes after it was due is overdue
    # Due at 6000 s. jobs has only an older run; reflections' run started
    # 10 s before its due time, which still counts for it.
    interval: 1m
    input_series:
      - series: 'routine_due_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '6000x140'
      - series: 'routine_last_run_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '1000x140'
      - series: 'routine_due_timestamp_seconds{job="file_host",routine="reflections"}'
        values: '6000x140'
      - series: 'routine_last_run_timestamp_seconds{job="file_host",routine="reflections"}'
        values: '5990x140'
    alert_rule_test:
      - eval_time: 130m
        alertname: RoutineRunOverdue
        exp_alerts: []
      - eval_time: 131m
        alertname: RoutineRunOverdue
        exp_alerts:
          - exp_labels:
              job: file_host
              routine: jobs
              objective: RR2
              says: "A routine was due more than 30 minutes ago, and home has no record of its run."

  - name: a routine home holds no run of at all is overdue too
    interval: 1m
    input_series:
      - series: 'routine_due_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '6000x140'
      - series: 'routine_last_run_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '0x140'
    alert_rule_test:
      - eval_time: 131m
        alertname: RoutineRunOverdue
        exp_alerts:
          - exp_labels:
              job: file_host
              routine: jobs
              objective: RR2
              says: "A routine was due more than 30 minutes ago, and home has no record of its run."

  - name: a file_host that stops answering is down after two minutes
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: FileHostDown
        exp_alerts: []
      - eval_time: 3m
        alertname: FileHostDown
        exp_alerts:
          - exp_labels:
              objective: MI3 NW2 GA4 RR2
              says: "Home's server has not answered for 2 minutes, so nothing on it is being watched."

  - name: a file_host Prometheus has no target for is down too
    interval: 1m
    input_series:
      - series: 'up{job="prometheus"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: FileHostDown
        exp_alerts:
          - exp_labels:
              job: file_host
              objective: MI3 NW2 GA4 RR2
              says: "Home's server has not answered for 2 minutes, so nothing on it is being watched."
