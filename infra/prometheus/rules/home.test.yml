# promtool test rules home.test.yml: each alert in home.yml fires when its
# behaviour breaks, and stays quiet while it holds or is switched off.
# Times are seconds from 0, so a stamp of 0 was taken at the start.
# Rules are evaluated every 15 s, as ../prometheus.yml does on home, so a
# `for:` shorter than a minute (GameFeedFailing's) is tested as it runs.
rule_files:
  - home.yml
evaluation_interval: 15s
tests:
  - name: a mailbox poller that stopped is stale past interval + budget + 60 s
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_interval_seconds{job="file_host"}'
        values: '900x40'
      - series: 'mailbox_poll_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 17m
        alertname: MailboxPollerStale
        exp_alerts: []
      - eval_time: 19m
        alertname: MailboxPollerStale
        exp_alerts:
          - exp_labels:
              objective: MI3
              says: "The Jobs mailbox poller has not started a pass within its interval, its budget and a minute."
      - eval_time: 19m
        alertname: MailboxPollerMetricsMissing
        exp_alerts: []

  - name: a mailbox poller whose every pass fails alerts after three passes, naming why (#641)
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x60'
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x60'
      - series: 'mailbox_poll_interval_seconds{job="file_host"}'
        values: '900x60'
      - series: 'mailbox_poll_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0+60x60'
      - series: 'mailbox_poll_failing{job="file_host",error="not_found"}'
        values: '1x60'
      - series: 'mailbox_poll_failing{job="file_host",error="unauthorized"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: MailboxPollerFailing
        exp_alerts: []
      - eval_time: 50m
        alertname: MailboxPollerFailing
        exp_alerts:
          - exp_labels:
              objective: MI3
              says: "The Jobs mailbox poller has failed every pass for 45 minutes; the MAILBOX dashboard's FAILING panel says why."
      - eval_time: 50m
        alertname: MailboxPollerStale
        exp_alerts: []

  - name: an outage whose class changes every pass still alerts (Codex on #643)
    interval: 1m
    input_series:
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x60'
      - series: 'mailbox_poll_failing{job="file_host",error="transport"}'
        values: '1x14 0x15 1x14 0x15'
      - series: 'mailbox_poll_failing{job="file_host",error="http"}'
        values: '0x14 1x15 0x14 1x15'
    alert_rule_test:
      - eval_time: 50m
        alertname: MailboxPollerFailing
        exp_alerts:
          - exp_labels:
              objective: MI3
              says: "The Jobs mailbox poller has failed every pass for 45 minutes; the MAILBOX dashboard's FAILING panel says why."

  - name: one failing pass that recovers does not alert
    interval: 1m
    input_series:
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x60'
      - series: 'mailbox_poll_failing{job="file_host",error="not_found"}'
        values: '1x14 0x45'
    alert_rule_test:
      - eval_time: 55m
        alertname: MailboxPollerFailing
        exp_alerts: []

  - name: a failing mailbox poller that is switched off does not alert
    interval: 1m
    input_series:
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '0x60'
      - series: 'mailbox_poll_failing{job="file_host",error="not_found"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: MailboxPollerFailing
        exp_alerts: []

  - name: a nudge waker whose every pass fails alerts after three passes, whatever the class (#644)
    interval: 1m
    input_series:
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '1x21'
      - series: 'nudge_waker_interval_seconds{job="file_host"}'
        values: '300x21'
      - series: 'nudge_waker_pass_deadline_seconds{job="file_host"}'
        values: '120x21'
      - series: 'nudge_waker_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0+60x21'
      - series: 'nudge_waker_pass_failing{job="file_host",error="schema"}'
        values: '1x4 0x5 1x4 0x5'
      - series: 'nudge_waker_pass_failing{job="file_host",error="locked"}'
        values: '0x4 1x5 0x4 1x5'
      - series: 'nudge_waker_pass_failing{job="file_host",error="io"}'
        values: '0x21'
    alert_rule_test:
      - eval_time: 14m
        alertname: NudgeWakerFailing
        exp_alerts: []
      - eval_time: 16m
        alertname: NudgeWakerFailing
        exp_alerts:
          - exp_labels:
              objective: NW2
              says: "The study nudge waker has failed every pass for 15 minutes; the file_host dashboard's LOOPS panel says why."
      - eval_time: 16m
        alertname: NudgeWakerStale
        exp_alerts: []

  - name: one failing nudge pass that recovers does not alert
    interval: 1m
    input_series:
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '1x30'
      - series: 'nudge_waker_pass_failing{job="file_host",error="schema"}'
        values: '1x4 0x25'
    alert_rule_test:
      - eval_time: 25m
        alertname: NudgeWakerFailing
        exp_alerts: []

  - name: a failing nudge waker that is switched off does not alert
    interval: 1m
    input_series:
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '0x30'
      - series: 'nudge_waker_pass_failing{job="file_host",error="schema"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: NudgeWakerFailing
        exp_alerts: []

  # The transcriber's gauge has no class: storage is its one way to fail.
  - name: a transcriber whose every pass fails alerts after three passes (#644)
    interval: 1m
    input_series:
      - series: 'transcribe_enabled{job="file_host"}'
        values: '1x10'
      - series: 'transcribe_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0+60x10'
      - series: 'transcribe_pass_failing{job="file_host"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: TranscriberFailing
        exp_alerts: []
      - eval_time: 4m
        alertname: TranscriberFailing
        exp_alerts:
          - exp_labels:
              objective: VH1
              says: "The voice-note transcriber has failed every pass on home's storage for 3 minutes; the TRANSCRIBE dashboard's FAILING panel shows it."

  - name: one failing transcriber pass that recovers does not alert
    interval: 1m
    input_series:
      - series: 'transcribe_enabled{job="file_host"}'
        values: '1x10'
      - series: 'transcribe_pass_failing{job="file_host"}'
        values: '1 0x9'
    alert_rule_test:
      - eval_time: 10m
        alertname: TranscriberFailing
        exp_alerts: []

  - name: a failing transcriber that is switched off does not alert
    interval: 1m
    input_series:
      - series: 'transcribe_enabled{job="file_host"}'
        values: '0x10'
      - series: 'transcribe_pass_failing{job="file_host"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: TranscriberFailing
        exp_alerts: []

  # The game feed wakes every 5 s, so its series are sampled that often.
  - name: a game feed whose every wake fails alerts after three wakes (#644)
    interval: 5s
    input_series:
      - series: 'game_feed_enabled{job="file_host"}'
        values: '1x24'
      - series: 'game_feed_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0+5x24'
      - series: 'game_feed_pass_failing{job="file_host"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 10s
        alertname: GameFeedFailing
        exp_alerts: []
      - eval_time: 30s
        alertname: GameFeedFailing
        exp_alerts:
          - exp_labels:
              objective: GA4
              says: "The game feed has failed every pass on home's storage for 15 seconds; the GAME FEED dashboard's FAILING panel shows it."
      - eval_time: 2m
        alertname: GameFeedStale
        exp_alerts: []

  - name: one failing game feed wake that recovers does not alert
    interval: 5s
    input_series:
      - series: 'game_feed_enabled{job="file_host"}'
        values: '1x24'
      - series: 'game_feed_pass_failing{job="file_host"}'
        values: '1 0x23'
    alert_rule_test:
      - eval_time: 2m
        alertname: GameFeedFailing
        exp_alerts: []

  - name: a failing game feed that is switched off does not alert
    interval: 5s
    input_series:
      - series: 'game_feed_enabled{job="file_host"}'
        values: '0x24'
      - series: 'game_feed_pass_failing{job="file_host"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 2m
        alertname: GameFeedFailing
        exp_alerts: []

  - name: a poller that keeps stamping, or is off, is not stale
    interval: 1m
    input_series:
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_interval_seconds{job="file_host"}'
        values: '900x40'
      - series: 'mailbox_poll_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0+60x40'
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '0x40'
      - series: 'nudge_waker_interval_seconds{job="file_host"}'
        values: '60x40'
      - series: 'nudge_waker_pass_deadline_seconds{job="file_host"}'
        values: '30x40'
      - series: 'nudge_waker_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
      - series: 'game_feed_enabled{job="file_host"}'
        values: '0x40'
      - series: 'game_feed_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MailboxPollerStale
        exp_alerts: []
      - eval_time: 30m
        alertname: NudgeWakerStale
        exp_alerts: []
      - eval_time: 30m
        alertname: GameFeedStale
        exp_alerts: []

  - name: a mailbox poller that is off is neither stale nor missing its stamp
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x40'
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '0x40'
      - series: 'mailbox_poll_interval_seconds{job="file_host"}'
        values: '900x40'
      - series: 'mailbox_poll_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x40'
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MailboxPollerStale
        exp_alerts: []
      - eval_time: 30m
        alertname: NudgeWakerMetricsMissing
        exp_alerts: []

  - name: a watcher that is on with no stamp at all is its own alert
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x20'
      - series: 'mailbox_poll_enabled{job="file_host"}'
        values: '1x20'
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: MailboxPollerMetricsMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: MailboxPollerMetricsMissing
        exp_alerts:
          - exp_labels:
              objective: MI3
              says: "The Jobs mailbox poller is on, but home reports no pass at all."
      - eval_time: 6m
        alertname: NudgeWakerMetricsMissing
        exp_alerts:
          - exp_labels:
              objective: NW2
              says: "The study nudge waker is on, but home reports no pass at all."

  - name: a nudge waker that stopped is stale past interval + deadline + 60 s
    interval: 1m
    input_series:
      - series: 'nudge_waker_enabled{job="file_host"}'
        values: '1x10'
      - series: 'nudge_waker_interval_seconds{job="file_host"}'
        values: '60x10'
      - series: 'nudge_waker_pass_deadline_seconds{job="file_host"}'
        values: '30x10'
      - series: 'nudge_waker_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: NudgeWakerStale
        exp_alerts: []
      - eval_time: 3m
        alertname: NudgeWakerStale
        exp_alerts:
          - exp_labels:
              objective: NW2
              says: "The study nudge waker has not started a pass within its interval, its deadline and a minute."

  - name: a game feed that is on and stopped waking is stale after two minutes
    interval: 1m
    input_series:
      - series: 'game_feed_enabled{job="file_host"}'
        values: '1x10'
      - series: 'game_feed_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: GameFeedStale
        exp_alerts: []
      - eval_time: 3m
        alertname: GameFeedStale
        exp_alerts:
          - exp_labels:
              objective: GA4
              says: "The game feed has not woken for two minutes."

  - name: a routine with no run 30 minutes after it was due is overdue
    # Due at 6000 s. jobs has only an older run; reflections' run started
    # 10 s before its due time, which still counts for it.
    interval: 1m
    input_series:
      - series: 'routine_due_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '6000x140'
      - series: 'routine_last_run_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '1000x140'
      - series: 'routine_due_timestamp_seconds{job="file_host",routine="reflections"}'
        values: '6000x140'
      - series: 'routine_last_run_timestamp_seconds{job="file_host",routine="reflections"}'
        values: '5990x140'
    alert_rule_test:
      - eval_time: 130m
        alertname: RoutineRunOverdue
        exp_alerts: []
      - eval_time: 131m
        alertname: RoutineRunOverdue
        exp_alerts:
          - exp_labels:
              job: file_host
              routine: jobs
              objective: RR2
              says: "A routine was due more than 30 minutes ago, and home has no record of its run."

  - name: a routine home holds no run of at all is overdue too
    interval: 1m
    input_series:
      - series: 'routine_due_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '6000x140'
      - series: 'routine_last_run_timestamp_seconds{job="file_host",routine="jobs"}'
        values: '0x140'
    alert_rule_test:
      - eval_time: 131m
        alertname: RoutineRunOverdue
        exp_alerts:
          - exp_labels:
              job: file_host
              routine: jobs
              objective: RR2
              says: "A routine was due more than 30 minutes ago, and home has no record of its run."

  - name: a file_host that stops answering is down after two minutes
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: FileHostDown
        exp_alerts: []
      - eval_time: 3m
        alertname: FileHostDown
        exp_alerts:
          - exp_labels:
              objective: MI3 NW2 GA4 RR2 AV2
              says: "Home's server has not answered for 2 minutes, so nothing on it is being watched."

  - name: a file_host Prometheus has no target for is down too
    interval: 1m
    input_series:
      - series: 'up{job="prometheus"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: FileHostDown
        exp_alerts:
          - exp_labels:
              job: file_host
              objective: MI3 NW2 GA4 RR2 AV2
              says: "Home's server has not answered for 2 minutes, so nothing on it is being watched."

  - name: a database behind its build for 5 minutes is DatabaseBehindBuild
    interval: 1m
    input_series:
      - series: 'up{job="file_host"}'
        values: '1x10'
      - series: 'dependency_up{job="file_host",dependency="sqlite"}'
        values: '1x10'
      - series: 'dependency_up{job="file_host",dependency="schema"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: DatabaseBehindBuild
        exp_alerts: []
      - eval_time: 6m
        alertname: DatabaseBehindBuild
        exp_alerts:
          - exp_labels:
              objective: AV2
              says: "Home's database has been behind this build for 5 minutes: /ready names the migrations to run."

  - name: a database migrated within 5 minutes, and current after, is not DatabaseBehindBuild
    # Behind for its first 3 minutes (a deploy mid-migration), then current.
    interval: 1m
    input_series:
      - series: 'dependency_up{job="file_host",dependency="sqlite"}'
        values: '1x20'
      - series: 'dependency_up{job="file_host",dependency="schema"}'
        values: '0 0 0 1x17'
    alert_rule_test:
      - eval_time: 2m
        alertname: DatabaseBehindBuild
        exp_alerts: []
      - eval_time: 10m
        alertname: DatabaseBehindBuild
        exp_alerts: []

  - name: a schema unchecked because sqlite is down is not DatabaseBehindBuild
    interval: 1m
    input_series:
      - series: 'dependency_up{job="file_host",dependency="sqlite"}'
        values: '0x10'
      - series: 'dependency_up{job="file_host",dependency="schema"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: DatabaseBehindBuild
        exp_alerts: []

  - name: the call weeks worker that stopped stamping is stale past 2 hours (CW2)
    interval: 1m
    input_series:
      - series: 'call_weeks_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x130'
    alert_rule_test:
      - eval_time: 115m
        alertname: CallWeeksStale
        exp_alerts: []
      - eval_time: 125m
        alertname: CallWeeksStale
        exp_alerts:
          - exp_labels:
              objective: CW2
              says: "Home has not read the weekly call's weeks for 2 hours (it reads them hourly)."

  - name: a call weeks worker stamping each hour is not stale (CW2)
    interval: 1m
    input_series:
      - series: 'call_weeks_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x59 3600x60 7200x60 10800x60 14400x60 18000x60 21600x60 25200x60 28800x60 32400x60'
    alert_rule_test:
      - eval_time: 9h50m
        alertname: CallWeeksStale
        exp_alerts: []

  - name: call weeks passes failing for 3 hours alert, and one that recovers does not (CW2)
    interval: 1m
    input_series:
      - series: 'call_weeks_pass_failing{job="file_host",instance="a"}'
        values: '1x200'
      - series: 'call_weeks_pass_failing{job="file_host",instance="b"}'
        values: '1x60 0x140'
    alert_rule_test:
      - eval_time: 2h55m
        alertname: CallWeeksFailing
        exp_alerts: []
      - eval_time: 3h05m
        alertname: CallWeeksFailing
        exp_alerts:
          - exp_labels:
              objective: CW2
              says: "Every pass reading the weekly call's weeks has failed for 3 hours; file-host-server's log names what failed."

  - name: a Playoff Delta fills worker that stops stamping alerts after 2 hours (PK2)
    interval: 1m
    input_series:
      - series: 'pd_fills_last_attempt_timestamp_seconds{job="file_host"}'
        values: '0x130'
    alert_rule_test:
      - eval_time: 115m
        alertname: PlayoffDeltaFillsStale
        exp_alerts: []
      - eval_time: 125m
        alertname: PlayoffDeltaFillsStale
        exp_alerts:
          - exp_labels:
              objective: PK2
              says: "Home has not read Playoff Delta's fills for 2 hours (it reads them hourly)."

  - name: Playoff Delta fills passes failing for 3 hours alert, and one that recovers does not (PK2)
    interval: 1m
    input_series:
      - series: 'pd_fills_pass_failing{job="file_host",instance="a"}'
        values: '1x200'
      - series: 'pd_fills_pass_failing{job="file_host",instance="b"}'
        values: '1x60 0x140'
    alert_rule_test:
      - eval_time: 2h55m
        alertname: PlayoffDeltaFillsFailing
        exp_alerts: []
      - eval_time: 3h05m
        alertname: PlayoffDeltaFillsFailing
        exp_alerts:
          - exp_labels:
              objective: PK2
              says: "Every pass reading Playoff Delta's fills has failed for 3 hours; file-host-server's log names what failed."

  - name: a week whose render failed alerts at once, and not as overdue (CW5)
    interval: 1m
    input_series:
      - series: 'call_render_weeks_waiting{job="file_host"}'
        values: '1x300'
      - series: 'call_render_weeks_failed{job="file_host"}'
        values: '0 1x299'
      - series: 'call_render_oldest_waiting_taken_timestamp_seconds{job="file_host"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 0m
        alertname: CallRenderFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: CallRenderFailed
        exp_alerts:
          - exp_labels:
              objective: CW5
              says: "A week of the call failed to render: renders/call-worker/<week>.failed.log on home's database drive has the whole attempt. It is tried again hourly."
      - eval_time: 4h
        alertname: CallRenderOverdue
        exp_alerts: []

  - name: a week waiting 3 hours with no failed attempt is overdue, and a rendered one is not (CW5)
    interval: 1m
    input_series:
      - series: 'call_render_weeks_waiting{job="file_host"}'
        values: '1x200 0x60'
      - series: 'call_render_weeks_failed{job="file_host"}'
        values: '0x260'
      - series: 'call_render_oldest_waiting_taken_timestamp_seconds{job="file_host"}'
        values: '0x260'
    alert_rule_test:
      - eval_time: 2h55m
        alertname: CallRenderOverdue
        exp_alerts: []
      - eval_time: 3h05m
        alertname: CallRenderOverdue
        exp_alerts:
          - exp_labels:
              objective: CW5
              says: "A week of the call has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck (docker logs render)."
      - eval_time: 3h35m
        alertname: CallRenderOverdue
        exp_alerts: []
      - eval_time: 3h35m
        alertname: CallRenderFailed
        exp_alerts: []

  - name: a Playoff Delta episode whose render failed alerts at once, and one waiting 3 hours unattempted is overdue (PK5)
    interval: 1m
    input_series:
      - series: 'pd_render_episodes_waiting{job="file_host"}'
        values: '1x400'
      - series: 'pd_render_episodes_failed{job="file_host"}'
        values: '0x200 1x200'
      - series: 'pd_render_oldest_waiting_taken_timestamp_seconds{job="file_host"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 2h55m
        alertname: PlayoffDeltaRenderOverdue
        exp_alerts: []
      - eval_time: 3h05m
        alertname: PlayoffDeltaRenderOverdue
        exp_alerts:
          - exp_labels:
              objective: PK5
              says: "A week of Playoff Delta has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck (docker logs render)."
      - eval_time: 3h05m
        alertname: PlayoffDeltaRenderFailed
        exp_alerts: []
      - eval_time: 3h25m
        alertname: PlayoffDeltaRenderFailed
        exp_alerts:
          - exp_labels:
              objective: PK5
              says: "A week of Playoff Delta failed to render: renders/playoff-delta-worker/<key>.failed.log on home's database drive has the whole attempt. It is tried again hourly."
      - eval_time: 3h25m
        alertname: PlayoffDeltaRenderOverdue
        exp_alerts: []

  - name: a render worker that stopped stamping is stale past 4 hours, and one never deployed is not (CW5)
    interval: 1m
    input_series:
      - series: 'call_render_worker_last_pass_timestamp_seconds{job="file_host"}'
        values: '60x300'
    alert_rule_test:
      - eval_time: 3h55m
        alertname: CallRenderWorkerStale
        exp_alerts: []
      - eval_time: 4h05m
        alertname: CallRenderWorkerStale
        exp_alerts:
          - exp_labels:
              objective: CW5
              says: "Home's render worker has not started a pass for 4 hours (it starts one hourly): docker logs render says why."

  - name: a render worker that never stamped is not stale (CW5)
    interval: 1m
    input_series:
      - series: 'call_render_worker_last_pass_timestamp_seconds{job="file_host"}'
        values: '0x700'
    alert_rule_test:
      - eval_time: 11h
        alertname: CallRenderWorkerStale
        exp_alerts: []

  - name: a call container that crashes and restarts alerts, naming it, and a deploy does not (CW5)
    interval: 1m
    input_series:
      # The speaker, restarted in place at 20m: the same container, its CPU
      # counter starting again from zero with its new cgroup. Its start time
      # (creation) stays where it was, as cAdvisor reports it through Docker.
      - series: 'container_cpu_usage_seconds_total{name="kokoro",id="/system.slice/docker-a.scope",cpu="total"}'
        values: '0+5x19 1+5x40'
      - series: 'container_start_time_seconds{name="kokoro",id="/system.slice/docker-a.scope"}'
        values: '0x60'
      # The render worker, redeployed at 20m: the old container's series ends
      # and a new container's begins, with its own counter.
      - series: 'container_cpu_usage_seconds_total{name="render",id="/system.slice/docker-b.scope",cpu="total"}'
        values: '0+5x19'
      - series: 'container_cpu_usage_seconds_total{name="render",id="/system.slice/docker-c.scope",cpu="total"}'
        values: '_x20 1+5x40'
    alert_rule_test:
      - eval_time: 19m
        alertname: CallServiceRestarted
        exp_alerts: []
      - eval_time: 25m
        alertname: CallServiceRestarted
        exp_alerts:
          - exp_labels:
              objective: CW5
              name: kokoro
              says: "Home's kokoro crashed and restarted: the OOM tile on the system dashboard says if memory ran out, and docker logs kokoro says why."
      - eval_time: 40m
        alertname: CallServiceRestarted
        exp_alerts: []

  - name: no cache warning ever written does not alert (CW6)
    interval: 1h
    input_series:
      # 0: no `*.cache.log` was ever written.
      - series: 'call_render_cache_warning_timestamp_seconds{job="file_host"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 1h
        alertname: CallRenderCacheFull
        exp_alerts: []

  - name: a recent cache warning alerts, and ages out after a day (CW6)
    interval: 1h
    input_series:
      - series: 'call_render_cache_warning_timestamp_seconds{job="file_host"}'
        values: '3600x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: CallRenderCacheFull
        exp_alerts:
          - exp_labels:
              objective: CW6
              says: "A render passed its cache policy in the last day, so some steps ran uncached: renders/call-worker/*.cache.log on home's database drive names them."
      - eval_time: 26h
        alertname: CallRenderCacheFull
        exp_alerts: []

  - name: a drive under a tenth free for ten minutes alerts, and one with room does not (CW6)
    interval: 1m
    input_series:
      - series: 'call_render_drive_size_bytes{job="file_host"}'
        values: '1000x40'
      - series: 'call_render_drive_avail_bytes{job="file_host"}'
        values: '200x10 50x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: HomeDriveLow
        exp_alerts: []
      - eval_time: 19m
        alertname: HomeDriveLow
        exp_alerts: []
      - eval_time: 22m
        alertname: HomeDriveLow
        exp_alerts:
          - exp_labels:
              objective: CW6
              says: "Home's database drive, which keeps the call's videos and caches, has under a tenth of its space free."

  # LN2 (#707): every kill the kernel makes for memory is heard.
  - name: a container's OOM kill names it, and is not also said as unattributed (LN2)
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{job="node"}'
        values: '5x10 6x90'
      - series: 'container_oom_events_total{name="kokoro"}'
        values: '0x10 1x90'
      - series: 'container_oom_events_total{name="file-host-server"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 5m
        alertname: HomeOomKill
        exp_alerts: []
      - eval_time: 15m
        alertname: HomeOomKill
        exp_alerts:
          - exp_labels:
              objective: LN2
              name: kokoro
              says: "Home's kokoro lost a process to the kernel for memory in the last hour: docs/home-compute.md (What a kill costs) says what that cost and what retries it."
      - eval_time: 15m
        alertname: HomeOomKillUnattributed
        exp_alerts: []
      - eval_time: 80m
        alertname: HomeOomKill
        exp_alerts: []

  - name: a kill no container is named for is still heard (LN2)
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{job="node"}'
        values: '5x10 6x90'
      - series: 'container_oom_events_total{name="kokoro"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 15m
        alertname: HomeOomKillUnattributed
        exp_alerts:
          - exp_labels:
              objective: LN2
              says: "The kernel killed a process on home for memory in the last hour that no container is named for: the WHO DUNNIT dashboard's OOM tile counts it, and journalctl -k on home names it."
      - eval_time: 15m
        alertname: HomeOomKill
        exp_alerts: []
      - eval_time: 80m
        alertname: HomeOomKillUnattributed
        exp_alerts: []

  - name: a kill is heard when cAdvisor names no container at all (LN2)
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{job="node"}'
        values: '5x10 6x90'
    alert_rule_test:
      - eval_time: 15m
        alertname: HomeOomKillUnattributed
        exp_alerts:
          - exp_labels:
              objective: LN2
              says: "The kernel killed a process on home for memory in the last hour that no container is named for: the WHO DUNNIT dashboard's OOM tile counts it, and journalctl -k on home names it."

  - name: two kills with one named are one named and one unattributed (LN2)
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{job="node"}'
        values: '5x10 7x90'
      - series: 'container_oom_events_total{name="render"}'
        values: '0x10 1x90'
    alert_rule_test:
      - eval_time: 15m
        alertname: HomeOomKill
        exp_alerts:
          - exp_labels:
              objective: LN2
              name: render
              says: "Home's render lost a process to the kernel for memory in the last hour: docs/home-compute.md (What a kill costs) says what that cost and what retries it."
      - eval_time: 15m
        alertname: HomeOomKillUnattributed
        exp_alerts:
          - exp_labels:
              objective: LN2
              says: "The kernel killed a process on home for memory in the last hour that no container is named for: the WHO DUNNIT dashboard's OOM tile counts it, and journalctl -k on home names it."

  - name: no kill since boot says nothing (LN2)
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{job="node"}'
        values: '3x100'
      - series: 'container_oom_events_total{name="kokoro"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 30m
        alertname: HomeOomKill
        exp_alerts: []
      - eval_time: 30m
        alertname: HomeOomKillUnattributed
        exp_alerts: []

  # The kernel's count is scraped a minute before cAdvisor names the kill:
  # the gap is under the rule's 2 m, so nothing is said as unattributed.
  - name: a container named a scrape after the kernel counted it is not unattributed (LN2)
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{job="node"}'
        values: '5x10 6x90'
      - series: 'container_oom_events_total{name="kokoro"}'
        values: '0x11 1x89'
    alert_rule_test:
      - eval_time: 12m
        alertname: HomeOomKillUnattributed
        exp_alerts: []
      - eval_time: 14m
        alertname: HomeOomKillUnattributed
        exp_alerts: []
