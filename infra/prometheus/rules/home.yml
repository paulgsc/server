# What home owes and did not do (AS7, #525): each alert here is one
# objective in paulgsc/some-ui's assurance ledger, named on its `objective`
# label. Prometheus evaluates them (rule_files in ../prometheus.yml); it has
# no Alertmanager, so Grafana reads the firing ones from `ALERTS` and sends
# them to the owner (infra/grafana/provisioning/alerting/home-alerts.yml).
#
# `promtool test rules home.test.yml` proves each fires when its behaviour
# breaks and stays quiet when it holds, in CI (test.yml, metric_contract_ci).
#
# Each alert's words are its `says` label, not an annotation: `ALERTS`, all
# Grafana sees, carries labels only.
#
# A watcher that is switched off is not stale: every stale rule requires its
# `*_enabled` gauge at 1, and its value is the age of its last stamp. A
# mailbox poller or nudge waker that is on with its stamp gone is its own
# alert, and so is file_host itself not answering a scrape.
#
# A watcher whose passes start but keep failing still stamps every attempt,
# so its stale rule never sees it: each `*Failing` rule fires on its
# `*_pass_failing` gauge (any class) held for three of its intervals, while
# its `*_enabled` gauge is 1.
#
# home-health holds what /ready finds wrong with a file_host that is
# answering: a degraded home serves, so the container healthcheck never says.
groups:
  - name: home-watchers
    rules:
      - alert: FileHostDown
        # Every watcher's gauges come from this one scrape, so without it
        # every rule below reads nothing, and nothing would say why.
        expr: (max(up{job="file_host"}) == 0) or absent(up{job="file_host"})
        for: 2m
        labels:
          objective: MI3 NW2 GA4 RR2 AV2
          says: "Home's server has not answered for 2 minutes, so nothing on it is being watched."

      - alert: MailboxPollerStale
        # MI3, two ways. No pass started within the interval, the pass budget
        # (120 s, AS4 #524) and 60 s. The interval follows the bell (#500,
        # C64): 900 s while home doesn't hold it, so 1,080 s as before the
        # bell; 3,600 s while it does (owner, 2026-11-10), when every put
        # rings and an hour without a pass is normal. So the loop also stamps
        # that it is alive every minute while idle and after each pass, never
        # during one: stale past the heartbeat, the budget and 60 s (240 s)
        # means the task died or a pass hangs, in either mode.
        expr: |
          (
            (time() - max(mailbox_poll_alive_timestamp_seconds)) > 60 + 120 + 60
            or
            (time() - max(mailbox_poll_last_attempt_timestamp_seconds))
              > max(mailbox_poll_interval_seconds) + 120 + 60
          )
          and on() max(mailbox_poll_enabled) == 1
        labels:
          objective: MI3
          says: "The Jobs mailbox poller has not started a pass within its interval, its budget and a minute."

      - alert: MailboxPollerMetricsMissing
        # MI3: the poller is on (file_host says so) but its stamp is gone.
        expr: |
          max(mailbox_poll_enabled) == 1
          unless on() max(mailbox_poll_last_attempt_timestamp_seconds)
        for: 5m
        labels:
          objective: MI3
          says: "The Jobs mailbox poller is on, but home reports no pass at all."

      - alert: MailboxPollerFailing
        # MI3: passes start but every one fails (a 404, a refused token, a
        # mailbox that changed under home), which the stale rule cannot see:
        # a failing pass still stamps its attempt (#641). Three passes in a
        # row, so one blip does not page: a failed pass is tried again 15
        # minutes later (`mailbox::UNHELD`, #500) even while the bell holds
        # the backstop at an hour, so three failures still take 45 minutes. Any class at all, not
        # one: an outage whose class changes from pass to pass (transport,
        # then http) is still an outage, and a per-class timer would restart
        # with each change (Codex on #643). The dashboard's FAILING panel
        # names the class; Grafana forwards labels only.
        expr: |
          max(mailbox_poll_failing) == 1
          and on() max(mailbox_poll_enabled) == 1
        for: 45m
        labels:
          objective: MI3
          says: "The Jobs mailbox poller has failed every pass for 45 minutes; the MAILBOX dashboard's FAILING panel says why."

      - alert: MailboxBellDown
        # #500: home has held no connection to the mailbox's bell for 30
        # minutes. Nothing is lost, since the backstop is back to every 15
        # minutes while the bell is down (C64), but nothing reaches home in
        # seconds either, so it is said. 30 minutes rides over a Worker deploy or a reconnect's
        # backoff (5 minutes at most). The MAILBOX dashboard's bell row says
        # why (mailbox_bell_failures_total{why}).
        expr: |
          max(mailbox_bell_connected) == 0
          and on() max(mailbox_poll_enabled) == 1
        for: 30m
        labels:
          objective: MI3
          says: "Home has not held its connection to the mailbox's bell for 30 minutes, so files reach it only on the 15-minute backstop, not in seconds; the MAILBOX dashboard's bell row says why."

      - alert: NudgeWakerStale
        # NW2: no pass started within the waker's interval, its pass deadline
        # and 60 s.
        expr: |
          (time() - max(nudge_waker_last_attempt_timestamp_seconds))
            > max(nudge_waker_interval_seconds) + max(nudge_waker_pass_deadline_seconds) + 60
          and on() max(nudge_waker_enabled) == 1
        labels:
          objective: NW2
          says: "The study nudge waker has not started a pass within its interval, its deadline and a minute."

      - alert: NudgeWakerMetricsMissing
        expr: |
          max(nudge_waker_enabled) == 1
          unless on() max(nudge_waker_last_attempt_timestamp_seconds)
        for: 5m
        labels:
          objective: NW2
          says: "The study nudge waker is on, but home reports no pass at all."

      - alert: NudgeWakerFailing
        # NW2: passes start but every one fails (a database missing a
        # migration, a locked or full disk), which NudgeWakerStale cannot
        # see: a failing pass still stamps its attempt (#644). Three passes
        # of WAKER_INTERVAL (300 s, a source constant: nudge.rs) in a row.
        # Any class at all, as MailboxPollerFailing: a per-class timer would
        # restart each time the class changed. The file_host dashboard's
        # LOOPS panel names the class (FAILING · <class>).
        expr: |
          max(nudge_waker_pass_failing) == 1
          and on() max(nudge_waker_enabled) == 1
        for: 15m
        labels:
          objective: NW2
          says: "The study nudge waker has failed every pass for 15 minutes; the file_host dashboard's LOOPS panel says why."

      - alert: TranscriberFailing
        # VH1: every pass ends on a storage failure, so no note is heard or
        # given its recorded reason, and the pass still stamps its attempt
        # (#644). Three passes of transcribe::INTERVAL (60 s, a source
        # constant) in a row. Storage is the only way a pass fails: a note
        # that cannot be heard is kept as an attempt, not a failing pass.
        expr: |
          max(transcribe_pass_failing) == 1
          and on() max(transcribe_enabled) == 1
        for: 3m
        labels:
          objective: VH1
          says: "The voice-note transcriber has failed every pass on home's storage for 3 minutes; the TRANSCRIBE dashboard's FAILING panel shows it."

      - alert: TranscriptGarbled
        # HEARD1 (paulgsc/server#908): home judged a take it transcribed
        # garbled (its own signals say the words are not what was said) or
        # failed (every attempt failed), so the owner hears it from home,
        # not from a routine that reads the take later. Final verdicts only:
        # a failure the worker will retry raises nothing. The counter starts
        # every kind at 0 (metrics::transcribe::record_started), so the first
        # garbled take is an increase; resolved an hour after the last.
        expr: sum(increase(transcribe_verdicts_total{verdict=~"garbled|failed"}[1h])) > 0
        labels:
          objective: VH4
          says: "Home could not hear a voice note it transcribed in the last hour (garbled or failed): GET /voice-notes/:id/heard and the mailbox transcript carry its verdict, reasons and signals."

      - alert: GameFeedStale
        # GA4: the feed wakes every 5 s whether or not a game is due, so two
        # minutes without a wake is a task that stopped, not a quiet week.
        # Not gated on game_feed_enabled: the worker always runs and stamps
        # every wake, paused or not, and only a live worker writes that gauge,
        # so a worker that died while paused would leave it at 0 and hide its
        # own death from the alert.
        expr: |
          (time() - max(game_feed_last_attempt_timestamp_seconds)) > 120
        labels:
          objective: GA4
          says: "The game feed has not woken for two minutes."

      - alert: GameFeedFailing
        # GA4: the feed wakes but every pass ends on a storage failure, which
        # GameFeedStale cannot see: a failing pass still stamps its wake
        # (#644). Three wakes of game_feed::TICK (5 s, a source constant) in
        # a row: at the 15 s evaluation interval (../prometheus.yml), two
        # evaluations that both find it failing. Storage is the only way a
        # pass fails: an ESPN refusal or no answer is counted and backed off.
        expr: |
          max(game_feed_pass_failing) == 1
          and on() max(game_feed_enabled) == 1
        for: 15s
        labels:
          objective: GA4
          says: "The game feed has failed every pass on home's storage for 15 seconds; the GAME FEED dashboard's FAILING panel shows it."

      - alert: RoutineRunOverdue
        # RR2: 30 minutes after a routine was due, home holds no run that
        # started for it. A run counts for a due time if it started no more
        # than an hour before it, so a run that starts a little early is not
        # missing. `crate::routine_watch` sets both gauges, after each mailbox
        # pass and every 5 minutes between them (`mailbox::WATCH`, #500, since
        # the backstop pass is hourly while the bell is held). A record
        # arrives when its run ends: its put rings the bell and a pass keeps
        # it within seconds, or the 15-minute backstop does while the bell is
        # down. RR2's 30 minutes is the owner's bound (#525).
        expr: |
          (time() - routine_due_timestamp_seconds > 1800)
          and on(routine) (routine_last_run_timestamp_seconds + 3600 < routine_due_timestamp_seconds)
        labels:
          objective: RR2
          says: "A routine was due more than 30 minutes ago, and home has no record of its run."

      - alert: CallWeeksStale
        # CW2 (some-ui#2635, server#684): the call weeks worker reads
        # paulgsc/testing's index every hour (call_weeks::INTERVAL), sooner
        # after a failure, and stamps each pass it starts. Two hours without
        # one is a task that stopped, not a slow pass: a pass is a few
        # requests of at most 30 s each.
        expr: |
          (time() - max(call_weeks_last_attempt_timestamp_seconds)) > 7200
        labels:
          objective: CW2
          says: "Home has not read the weekly call's weeks for 2 hours (it reads them hourly)."

      - alert: CallWeeksFailing
        # CW2: every pass for 3 hours failed, on storage or on a week it
        # could not read or write; a failing pass is retried after 5, 10, 20
        # and 40 minutes, then hourly, so that is about six passes. A
        # failing source that recovers clears it on its next pass.
        expr: |
          max(call_weeks_pass_failing) == 1
        for: 3h
        labels:
          objective: CW2
          says: "Every pass reading the weekly call's weeks has failed for 3 hours; file-host-server's log names what failed."

      - alert: CallWeekOverdue
        # CW2 (some-ui#3478): the week the weekly routine owes has passed its
        # Friday at home and home holds none: the routine wrote none to
        # paulgsc/testing, or home has not read it (CallWeeks* say the
        # latter). The call weeks pass sets it hourly from the board's own
        # `coming` read (feeds::renders::overdue). A call quiet for
        # ACTIVE_DAYS (three weeks) expects nothing, so it ends there.
        expr: |
          max(call_weeks_next_overdue) == 1
        labels:
          objective: CW2
          says: "The weekly call's week is past its Friday and has not reached home: the weekly routine wrote none to paulgsc/testing (Studio's Renders page shows it overdue under Coming)."

      - alert: PlayoffDeltaFillsStale
        # PK2 (some-ui#2647): the Playoff Delta fills worker reads
        # paulgsc/testing's index every hour (pd_fills::INTERVAL), sooner
        # after a failure, and stamps each pass it starts, as the call weeks
        # worker does (CallWeeksStale).
        expr: |
          (time() - max(pd_fills_last_attempt_timestamp_seconds)) > 7200
        labels:
          objective: PK2
          says: "Home has not read Playoff Delta's fills for 2 hours (it reads them hourly)."

      - alert: PlayoffDeltaFillsFailing
        # PK2: every pass for 3 hours failed, on storage or on a fill or
        # season it could not read; retried as CallWeeksFailing's are.
        expr: |
          max(pd_fills_pass_failing) == 1
        for: 3h
        labels:
          objective: PK2
          says: "Every pass reading Playoff Delta's fills has failed for 3 hours; file-host-server's log names what failed."

      - alert: CallRenderFailed
        # CW5: a week home holds has no video and the render worker's last
        # attempt at it failed (infra/render/render-calls.sh keeps that
        # attempt's whole output, and removes it once the week renders).
        # file_host reads that each minute (call_weeks::render). The worker
        # tries again hourly (a refusal by the render policy, once what it was refused for changes), so a failure that clears on its own stops this.
        expr: |
          max(call_render_weeks_failed) > 0
        labels:
          objective: CW5
          says: "A week of the call failed to render: renders/call-worker/<week>.failed.log on home's database drive has the whole attempt. It is tried again hourly, or, refused as too long, too large or past the frame, once what it was refused for changes (its input, its cap, the render or speaker image, or the brand files)."

      - alert: CallRenderOverdue
        # CW5: a week has waited 3 hours since home took it, with no failed
        # attempt: the worker is stopped, stuck in a render, or held back by
        # the lane for want of room (L4c, docs/home-compute.md, "What the
        # render worker does"). The worker looks every minute and a render
        # takes well under an hour, so 3 hours is past any render that
        # started. A week whose attempt failed is CallRenderFailed's; a lane
        # that holds one job back for good is LaneStuck's too.
        expr: |
          max(call_render_weeks_waiting) > 0
          and on() (time() - max(call_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(call_render_weeks_failed) == 0
        labels:
          objective: CW5
          says: "A week of the call has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: PlayoffDeltaRenderFailed
        # PK5 (some-ui#2647): a voiced fill home holds has no video and the
        # render worker's last attempt at it failed (render-calls.sh's
        # playoff-delta job keeps that attempt's whole output, and removes it
        # once the episode renders). file_host reads that each minute
        # (pd_fills::render). The worker tries again hourly (a refusal by the render policy, once what it was refused for changes).
        expr: |
          max(pd_render_episodes_failed) > 0
        labels:
          objective: PK5
          says: "A week of Playoff Delta failed to render: renders/playoff-delta-worker/<key>.failed.log on home's database drive has the whole attempt. It is tried again hourly, or, refused as too long, too large or past the frame, once what it was refused for changes (its input, its cap, the render or speaker image, or the brand files)."

      - alert: PlayoffDeltaRenderOverdue
        # PK5: a voiced fill has waited 3 hours since home took it, with no
        # failed attempt, so the worker is not trying it, as
        # CallRenderOverdue reads the call's weeks.
        expr: |
          max(pd_render_episodes_waiting) > 0
          and on() (time() - max(pd_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(pd_render_episodes_failed) == 0
        labels:
          objective: PK5
          says: "A week of Playoff Delta has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: RustEssayRenderFailed
        # RR16 (some-ui#2691): an essay home gave the render worker has no
        # video and the worker's last attempt at it failed (render-calls.sh's
        # rust-essay job keeps that attempt's whole output, and removes it
        # once the essay renders). file_host reads that each minute
        # (rust_essays::observe). The worker tries again hourly (a refusal by the render policy, once what it was refused for changes).
        expr: |
          max(rust_essay_render_failed) > 0
        labels:
          objective: RR16
          says: "A week's Rust Rounds essay failed to render: renders/rust-essay-worker/<week>.failed.log on home's database drive has the whole attempt. It is tried again hourly, or, refused as too long, too large or past the frame, once what it was refused for changes (its input, its cap, the render or speaker image, or the brand files)."

      - alert: RustEssayRenderOverdue
        # RR16: an essay has waited 3 hours since home gave it, with no
        # failed attempt, as CallRenderOverdue reads the call's weeks.
        expr: |
          max(rust_essay_render_waiting) > 0
          and on() (time() - max(rust_essay_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(rust_essay_render_failed) == 0
        labels:
          objective: RR16
          says: "A week's Rust Rounds essay has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: RustEssayRefused
        # RR16: home holds an essay it will not give the worker, because it
        # does not read as an essay of the week its name gives, or plays
        # takes other than the ones the week's final record names
        # (rust_essays::export). It stays refused: the mailbox keeps a file
        # once, so the routine puts a corrected essay under a new name only
        # once the owner says so.
        expr: |
          max(rust_essays_refused) > 0
        labels:
          objective: RR16
          says: "A Rust Rounds essay was refused before rendering: renders/rust-essay-worker/<week>.refused.log on home's database drive says which fields and why."

      - alert: RustEssaysFailing
        # RR16: every pass giving essays for 3 hours failed, on storage or on
        # an essay it could not write.
        expr: |
          max(rust_essays_pass_failing) == 1
        for: 3h
        labels:
          objective: RR16
          says: "Every pass giving Rust Rounds essays to the render worker has failed for 3 hours; file-host-server's log names what failed."

      - alert: RustEssayOverdue
        # RR16, EV3 (some-ui#3478): the essay home is owed for a week of Rust
        # Rounds has passed its Monday at home and was never given to the
        # worker: the routine wrote none, or it waits (refused, a take home
        # couldn't hear or hasn't heard, a week not final). RustEssayRender*
        # read only an essay already given, so this one read as a quiet week.
        # The rust_essays pass sets it every 10 minutes from the board's own
        # `coming` read (feeds::renders::overdue), which says what it waits on.
        expr: |
          max(rust_essays_owed_overdue) == 1
        labels:
          objective: RR16
          says: "A week's Rust Rounds essay is past its Monday and has not come to home: Studio's Renders page says under Coming what it waits on (a take home couldn't hear, a week not final, a refused essay, or nothing written)."

      - alert: InterviewEssayRenderFailed
        # IW6 (some-ui#2937, #899): RustEssayRenderFailed's rule for a week
        # of mock interview's essay, by the same export (essays, its
        # interview kind). An essay home gave the render worker has no
        # video and the worker's last attempt at it failed (render-calls.sh's
        # interview-essay job keeps that attempt's whole output, and removes it
        # once the essay renders). file_host reads that each minute
        # (rust_essays::observe). The worker tries again hourly (a refusal by the render policy, once what it was refused for changes).
        expr: |
          max(interview_essay_render_failed) > 0
        labels:
          objective: IW6
          says: "A week of mock interview's essay failed to render: renders/interview-essay-worker/<week>.failed.log on home's database drive has the whole attempt. It is tried again hourly, or, refused as too long, too large or past the frame, once what it was refused for changes (its input, its cap, the render or speaker image, or the brand files)."

      - alert: InterviewEssayRenderOverdue
        # IW6, as RustEssay*: an essay has waited 3 hours since home gave it, with no
        # failed attempt, as CallRenderOverdue reads the call's weeks.
        expr: |
          max(interview_essay_render_waiting) > 0
          and on() (time() - max(interview_essay_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(interview_essay_render_failed) == 0
        labels:
          objective: IW6
          says: "A week of mock interview's essay has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: InterviewEssayRefused
        # IW6, as RustEssay*: home holds an essay it will not give the worker, because it
        # does not read as an essay of the week its name gives, or plays
        # takes other than the ones the week's final record names
        # (rust_essays::export). It stays refused: the mailbox keeps a file
        # once, so the routine puts a corrected essay under a new name only
        # once the owner says so.
        expr: |
          max(interview_essays_refused) > 0
        labels:
          objective: IW6
          says: "A mock interview essay was refused before rendering: renders/interview-essay-worker/<week>.refused.log on home's database drive says which fields and why."

      - alert: InterviewEssaysFailing
        # IW6, as RustEssay*: every pass giving essays for 3 hours failed, on storage or on
        # an essay it could not write.
        expr: |
          max(interview_essays_pass_failing) == 1
        for: 3h
        labels:
          objective: IW6
          says: "Every pass giving mock interview essays to the render worker has failed for 3 hours; file-host-server's log names what failed."

      - alert: InterviewEssayOverdue
        # IW6, as RustEssayOverdue (some-ui#3478): the essay home is owed for a
        # week of mock interview has passed its Monday at home and was never
        # given to the worker.
        expr: |
          max(interview_essays_owed_overdue) == 1
        labels:
          objective: IW6
          says: "A week of mock interview's essay is past its Monday and has not come to home: Studio's Renders page says under Coming what it waits on (a take home couldn't hear, a week not final, a refused essay, or nothing written)."

      - alert: ReportRenderFailed
        # RW1 (some-ui#2700, #821): a week's engagement report home gave the
        # render worker has no video and the worker's last attempt at it
        # failed (render-calls.sh's report job keeps that attempt's whole
        # output, and removes it once the week renders). file_host reads that
        # each minute (report_weeks::observe). The worker tries again hourly
        # (a refusal by the render policy, once what it was refused for changes).
        expr: |
          max(report_render_weeks_failed) > 0
        labels:
          objective: RW1
          says: "A week's engagement report failed to render: renders/report-worker/<week>.failed.log on home's database drive has the whole attempt. It is tried again hourly, or, refused as too long, too large or past the frame, once what it was refused for changes (its input, its cap, the render or speaker image, or the brand files)."

      - alert: ReportRenderOverdue
        # RW1: a week's report has waited 3 hours since home gave it, with no
        # failed attempt, as CallRenderOverdue reads the call's weeks.
        expr: |
          max(report_render_weeks_waiting) > 0
          and on() (time() - max(report_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(report_render_weeks_failed) == 0
        labels:
          objective: RW1
          says: "A week's engagement report has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: ReportWeeksStale
        # RW1 (some-ui#2700, #821): the report_weeks worker passes every hour
        # (report_weeks::INTERVAL) and stamps each pass it starts, as the
        # cards essays worker does (CardsEssaysStale).
        expr: |
          (time() - max(report_weeks_last_attempt_timestamp_seconds)) > 7200
        labels:
          objective: RW1
          says: "Home has not looked for a week of the engagement report to write for 2 hours (it looks hourly)."

      - alert: ReportWeeksFailing
        # RW1 (some-ui#2700, #821): for 3 hours every pass keeping the ended
        # weeks' engagement reports and giving them to the render worker
        # failed (storage, or a week it could not write to the drive), or the
        # minute's tidy could not remove a week no longer the owner's. A week
        # with no records to report is not a failure: the dashboard row says
        # it (report_weeks_unmeasured).
        expr: |
          max(report_weeks_pass_failing) == 1 or max(report_weeks_tidy_failing) == 1
        for: 3h
        labels:
          objective: RW1
          says: "Writing the weekly engagement report for the render worker, or removing a week no longer the owner's from home's drive, has failed for 3 hours; file-host-server's log names what failed."

      - alert: CardsEssaysStale
        # CE1 (#854, some-ui#2979): the cards essays worker reads
        # paulgsc/testing's cards index every hour (cards_essays::INTERVAL),
        # sooner after a failure, and stamps each pass it starts, as the
        # call weeks worker does (CallWeeksStale).
        expr: |
          (time() - max(cards_essays_last_attempt_timestamp_seconds)) > 7200
        labels:
          objective: CE1
          says: "Home has not read paulgsc/testing's cards essays for 2 hours (it reads them hourly)."

      - alert: CardsEssaysFailing
        # CE1: every pass for 3 hours failed, on storage or on an essay it
        # could not read or write; retried as CallWeeksFailing's are. An
        # essay the index lists that is not a cut list of its key's day is
        # one it could not read, so it fails every pass until it is fixed.
        expr: |
          max(cards_essays_pass_failing) == 1
        for: 3h
        labels:
          objective: CE1
          says: "Every pass reading paulgsc/testing's cards essays has failed for 3 hours; file-host-server's log names what failed by kind (an unreadable essay is one cards-check should have refused)."

      - alert: CardsEssayRenderFailed
        # CE1: an essay home holds has no video and the render worker's last
        # attempt at it failed (render-calls.sh's cards-essay job keeps that
        # attempt's whole output, and removes it once the essay renders).
        # file_host reads that each minute (cards_essays::observe). The
        # worker tries again hourly (a refusal by the render policy, once what it was refused for changes).
        expr: |
          max(cards_essay_render_failed) > 0
        labels:
          objective: CE1
          says: "A cards essay failed to render: renders/cards-essay-worker/<key>.failed.log on home's database drive has the whole attempt (record:cards names what it refused). It is tried again hourly, or, refused as too long, too large or past the frame, once what it was refused for changes (its input, its cap, the render or speaker image, or the brand files)."

      - alert: CardsEssayRenderOverdue
        # CE1: an essay has waited 3 hours since home took it, with no
        # failed attempt, as CallRenderOverdue reads the call's weeks.
        expr: |
          max(cards_essay_render_waiting) > 0
          and on() (time() - max(cards_essay_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(cards_essay_render_failed) == 0
        labels:
          objective: CE1
          says: "A cards essay has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: CallRenderWorkerStale
        # CW5: the worker stamps each pass it starts, a minute apart, and
        # every minute while a job waits for room or is paused (L4c), never
        # while a render runs: four hours is a worker that stopped, or a
        # render that hung (one longer than four hours trips it too), which this
        # catches even with no week waiting. A worker that never stamped
        # (not deployed) is not this; a week it leaves waiting is
        # CallRenderOverdue's.
        expr: |
          max(call_render_worker_last_pass_timestamp_seconds) > 0
          and on() (time() - max(call_render_worker_last_pass_timestamp_seconds)) > 14400
        labels:
          objective: CW5
          says: "Home's render worker has not stamped a pass for 4 hours (it stamps one every minute, waiting for room or not): docker logs render says why."

      - alert: CallServiceRestarted
        # CW5: the speaker, the stage or the render worker died and Docker's
        # restart policy started the same container again, as the speaker
        # did four times on Nov 6 when it ran out of memory twelve lines into
        # a week. Each start gets a new cgroup, so the container's CPU counter
        # starts again from zero on the same series: a reset. cAdvisor's
        # container_start_time_seconds is the container's creation time when
        # it resolves the container through Docker, which a restart in place
        # does not move, so it cannot say this. A deploy makes a new
        # container, a new series, so it is not counted. The render worker's
        # own alerts say which week it cost.
        expr: |
          max by (name) (resets(container_cpu_usage_seconds_total{name=~"kokoro|render"}[15m])) > 0
        labels:
          objective: CW5
          says: "Home's {{ $labels.name }} crashed and restarted: the OOM tile on the system dashboard says if memory ran out, and docker logs {{ $labels.name }} says why."

      - alert: CallRenderCacheFull
        # CW6: the render policy caps what one week's step cache keeps
        # (record:call --cache-mb, infra/render/render-calls.sh), and a step
        # past it runs uncached rather than failing; the worker writes each
        # such warning, and each week's work it removed past the total cap,
        # to renders/call-worker/*.cache.log (and Playoff Delta's job to
        # renders/playoff-delta-worker/*.cache.log), whose newest time file_host
        # reads each minute (call_weeks::render::disk). Said for a day, so a
        # render that warned and then finished is still heard.
        expr: |
          max(call_render_cache_warning_timestamp_seconds) > 0
          and on() (time() - max(call_render_cache_warning_timestamp_seconds)) < 86400
        labels:
          objective: CW6
          says: "A render passed its cache policy in the last day, so some steps ran uncached: renders/call-worker/*.cache.log on home's database drive names them."

      - alert: HomeDriveLow
        # CW6: the drive that holds home's database also keeps every video
        # of the call for good and the waiting weeks' caches; file_host reads
        # its free bytes each minute (call_weeks::render::disk). Ten minutes
        # under a tenth free is a drive filling, not a render's moment.
        expr: |
          max(call_render_drive_size_bytes) > 0
          and on() max(call_render_drive_avail_bytes) / max(call_render_drive_size_bytes) < 0.10
        for: 10m
        labels:
          objective: CW6
          says: "Home's database drive, which keeps the call's videos and caches, has under a tenth of its space free."

  - name: home-admission
    rules:
      - alert: ClientRateLimited
        # AD2: home's limiter turned a client away (a 429, which the phone
        # shows as "Home busy"). A client under its limit is never refused
        # (AD1), so a refusal is either a client sending too fast or the
        # limiter wrong again; both are worth hearing, and before the GCRA
        # rewrite neither reached anyone. Over 15 minutes, so a burst of
        # refusals is one message, resolved after a quiet quarter hour. The
        # series exists at 0 from boot (metrics::rate_limit::register_all),
        # so the first refusal after a restart is an increase too.
        expr: sum(increase(rate_limit_decisions_total{outcome="rejected"}[15m])) > 0
        labels:
          objective: AD2
          says: "Home turned a client away for sending too fast in the last 15 minutes (a 429; the phone shows Home busy). The Rate limiting row on the file_host dashboard shows when."

      - alert: HomeShedding
        # AD4: home answered a request busy (a 503 with Retry-After) rather
        # than serve it. Every slot of the concurrency limit was taken, no
        # database connection came free within 3 s, or the 8 s deadline was
        # reached (apps/servers/file_host/src/admission.rs). Shedding keeps
        # the phone from reading home as away, but it is still a person's
        # request not served, and those answers log at WARN, so nothing else
        # pages for them (#935). Over 15 minutes, as ClientRateLimited is. The
        # series exist at 0 from boot (metrics::refusals::register_all).
        expr: sum(increase(refusals_total{stage="http",reason=~"load_shed|timeout|pool_timeout"}[15m])) > 0
        labels:
          objective: AD4
          says: "Home answered requests busy in the last 15 minutes (a 503 with Retry-After): too many at once, no database connection free, or the 8 s deadline reached. refusals_total by reason on the file_host dashboard shows which."

  - name: home-health
    rules:
      - alert: DatabaseBehindBuild
        # AV2 (AS19, #565): the database is missing migrations this build's
        # queries need. /ready is then degraded, not unavailable (AS15,
        # #560), so the container stays healthy and only the queries that
        # touch what the pending migrations add fail. A database never
        # migrated at all trips this too; /ready's body says which it is.
        #
        # dependency_up is fresh without anyone asking /ready:
        # metrics::periodic re-checks every dependency every 10 s. When
        # sqlite itself is down, schema reads 0 as "not checked", so that
        # case is left to sqlite's own answer rather than sent here as a
        # migration to run. 5 minutes is past a deploy that applies the
        # migrations and restarts (#563); a failed migrate that leaves the
        # new binary serving is what this is for.
        expr: |
          max(dependency_up{dependency="schema"}) == 0
          unless on() max(dependency_up{dependency="sqlite"}) == 0
        for: 5m
        labels:
          objective: AV2
          says: "Home's database has been behind this build for 5 minutes: /ready names the migrations to run."

  # Home's on-demand deploy (README.md, "Deploying to home"): it runs only
  # when a client needs a newer server, outside file_host, from a systemd
  # path unit, so nobody is watching when it fails. file_host reads what it
  # recorded (${STORAGE}/deploy/state.json) on metrics::periodic's sweep.
  - name: home-deploy
    rules:
      - alert: DeployFailed
        # HD2: a deploy a client asked for rolled back, or failed before it
        # could start anything. Either way home still serves the image it had
        # (or nothing, which FileHostDown says); the client that asked stays
        # unserved until someone looks. home_deploy_runs only rises (the
        # deploy's own totals), so increase() over the hour sees each one;
        # resolved an hour after the last.
        expr: sum(increase(home_deploy_runs{outcome=~"rolled_back|failed"}[1h])) > 0
        labels:
          objective: HD2
          says: "Home's on-demand deploy rolled back or failed in the last hour: `journalctl -u home-deploy` says why. If it names a missing or refused variable, the image needs a newer checkout on home."
      - alert: DeployStuck
        # HD2: a client asked for a newer server and the marker has waited 30
        # minutes unanswered: the path unit is not running (not installed,
        # stopped, or hit systemd's start limit) or the deploy hung. A deploy
        # takes minutes: a pull, a start that may migrate, at most 360 s of
        # waiting, twice when it rolls back.
        expr: max(home_deploy_wanted_age_seconds) > 1800
        labels:
          objective: HD2
          says: "A client has needed a newer server for 30 minutes and home's deploy has not answered: check `systemctl status home-deploy.path home-deploy`."
      - alert: DeployCannotRequest
        # HD2: a client needed a newer server and /compat answered
        # cannot_request: file_host could not write the deploy-wanted marker
        # (the folder could not be made or the file written: a storage that
        # is not writable or full), so no deploy will run and DeployStuck,
        # which reads the marker's age, never sees it.
        # compat_checks_total is at 0 from boot (metrics::deploy::register_all),
        # so the first such ask after a restart is an increase too. Over the
        # hour, as DeployFailed: one message, resolved an hour after the last.
        expr: sum(increase(compat_checks_total{result="cannot_request"}[1h])) > 0
        labels:
          objective: HD2
          says: "A client needed a newer server in the last hour, but home could not write the deploy request (/compat answered cannot_request), so no deploy will run: file-host-server's log names what failed."

  # Home runs out of memory (LN2, #707): every kill the kernel makes for
  # memory reaches the owner, named when it can be and never dropped when it
  # can't. Home has no swap (paulgsc/dotfiles swapDevices = []), so a kill is
  # how a shortage ends. docs/home-compute.md says who is killed first and
  # what each kill costs.
  #
  # The kernel's own count, node_vmstat_oom_kill (/proc/vmstat oom_kill), is
  # the truth: it counts every OOM kill, inside a container's cap or across
  # the host. cAdvisor names the container from the kernel's log
  # (container_oom_events_total, by `name`). HomeOomKill says which container
  # lost a process; HomeOomKillUnattributed fires when the kernel counted
  # more kills than cAdvisor named, so a kill outside any container, or one
  # cAdvisor missed, is still heard. Both look back an hour, so a kill made
  # while Prometheus itself was down for less than that is still caught.
  - name: home-memory
    rules:
      - alert: HomeOomKill
        expr: |
          max by (name) (round(increase(container_oom_events_total{name!=""}[1h]))) > 0
        labels:
          objective: LN2
          says: "Home's {{ $labels.name }} lost a process to the kernel for memory in the last hour: docs/home-compute.md (What a kill costs) says what that cost and what retries it."

      - alert: HomeOomKillUnattributed
        # Each side rounded, since increase() extrapolates to the window's
        # edges; held 2 m, since the two counters are scraped apart and one
        # can see a kill a scrape before the other.
        expr: |
          max(round(increase(node_vmstat_oom_kill[1h])))
          > on() (sum(round(increase(container_oom_events_total{name!=""}[1h]))) or on() vector(0))
        for: 2m
        labels:
          objective: LN2
          says: "The kernel killed a process on home for memory in the last hour that no container is named for: the WHO DUNNIT dashboard's OOM tile counts it, and journalctl -k on home names it."

  # The batch lane (L4b, #708): file_host decides every 5 s whether home's
  # batch class may run, must pause or must stop (call_weeks::lane, from
  # crates/lane), and writes the decision where the render worker reads it.
  # docs/home-compute.md ("The lane") says what it reads and home's policy.
  # Each rule reads a gauge file_host sets every tick, so file_host not
  # answering a scrape is FileHostDown's, not these.
  - name: home-lane
    rules:
      - alert: LaneStale
        # The lane writes a decision every 5 s, and the render worker treats
        # one older than 30 s as stop (call_weeks::lane::STALE_AFTER). A
        # decision a minute old, held for a minute, is a lane that stopped
        # or cannot write: never one slow tick. A lane that never wrote one
        # reads 0, so it is caught too.
        expr: |
          (time() - max(lane_last_decision_timestamp_seconds)) > 60
        for: 1m
        labels:
          objective: LN3
          says: "Home's batch lane has not written a decision for over a minute, so the render worker reads it as stop: file-host-server's log says why (it writes every 5 s)."

      - alert: LaneStuck
        # LA4: the render in progress was stopped for memory or pressure
        # three times in a row (call_weeks::lane::POLICY.stuck_after). The
        # lane decides this, so no wait is added: a job stays stuck until
        # the worker finishes or gives it up, and a new job starts at zero.
        expr: |
          max(lane_stuck) == 1
        labels:
          objective: LN3
          says: "A render on home was stopped three times in a row for memory or pressure: it may never fit. The CALL dashboard's LANE row shows free memory against its peak and the floor."

      - alert: LaneSignalsUnreadable
        # A signal the lane decides from could not be read (no PSI in the
        # kernel, /proc/meminfo, or a garbled job or peak file from the
        # render worker). Under LA2 that is never room, so batch work never
        # starts; every `unknown` decision comes from one of these. Held 5
        # minutes: a reading that comes back within that is said by the
        # dashboard, not paged.
        expr: |
          min by (signal) (lane_signal_readable) == 0
        for: 5m
        labels:
          objective: LN3
          says: "Home's batch lane has not been able to read its {{ $labels.signal }} signal for 5 minutes, so no render may start: docs/home-compute.md (The lane) says where each signal comes from."

  # What home asks of the outside (paulgsc/some-ui#3330): every HTTP request
  # file_host and its crates send is counted once by crates/outbound, by
  # caller, host and outcome (outbound_requests_total). Each caller's counters
  # are at 0 from the moment its client is built, so the first failure after a
  # restart is an increase. The OUTBOUND dashboard draws them.
  - name: home-outbound
    rules:
      - alert: OutboundNoAnswer
        # A host that has gone dark for one of home's workers: at least three
        # requests in 30 minutes, and not one got an answer (every one timed
        # out or found no connection, a reset or a TLS failure). The watchers'
        # own alerts do not see this, since a pass that gets no answer still
        # completes and stamps. An answer of any status, a refusal included,
        # clears it: a host that refuses is reached, and a refusal is the
        # worker's own to judge (the game feed backs off on a 429, GA2; a push
        # service's 410 is a browser that left). A caller that sends fewer
        # than three requests in 30 minutes (the game feed between games, a
        # rare push) is not judged by it. The health probe exits before any
        # scrape, so it never has a series here. Labels, not a URL: host is a
        # fixed name per caller (crates/outbound, Caller::host).
        expr: |
          sum by (caller, host) (increase(outbound_requests_total{outcome=~"timeout|no_answer"}[30m])) >= 3
          unless on (caller, host)
          sum by (caller, host) (increase(outbound_requests_total{outcome!~"timeout|no_answer"}[30m])) > 0
        labels:
          objective: OB2
          says: "Home's {{ $labels.caller }} has had no answer from {{ $labels.host }} for 30 minutes: every request it sent timed out or could not connect. The OUTBOUND dashboard's Not OK panel shows since when."

      - alert: OutboundRefused
        # The game feed only (the owner, 2026-11-21): ESPN answers, but
        # refuses every request (a 429 rate limit, another 4xx, a 5xx) for 30
        # minutes, at least three of them, and not one is ok. The feed backs
        # off on each refusal (GA2), so a refusal that lasts is one nobody
        # would otherwise hear. A timeout among the refusals does not clear it
        # (OutboundNoAnswer is cleared by a refusal, so a mix of the two would
        # otherwise fire neither); one ok answer does. Other callers are left
        # out: a push service's 410 is a browser that left, which the nudge
        # handles, and the pollers' own failing alerts read their refusals.
        expr: |
          sum by (caller, host) (increase(outbound_requests_total{caller="game_feed",outcome=~"refused_4xx|refused_5xx"}[30m])) >= 3
          unless on (caller, host)
          sum by (caller, host) (increase(outbound_requests_total{caller="game_feed",outcome="ok"}[30m])) > 0
        labels:
          objective: OB3
          says: "Home's game feed has been refused by {{ $labels.host }} for 30 minutes: every request it sent got a 4xx or 5xx (a 429 is a rate limit), and none was answered. The GAME FEED dashboard says what came back."

  # Shared stages (paulgsc/some-ui#3333): a node other pipelines wait on
  # (`crate::stage::Stage` in file_host). The same two alerts for every
  # stage, told apart by the `stage` label; each takes its `objective` from
  # the stage's own promise series, whose value is the promise's bound in
  # seconds (a policy constant in the source, moved by a call), so no stage
  # and no bound is written here. A stage the server has switched off never
  # reports what waits, so neither fires for it.
  - name: home-stages
    rules:
      # How long the oldest item still waiting has waited, aged on every
      # evaluation. The server exports when it arrived (0: nothing waiting),
      # not its age, because a stage reads its queue once a pass and a broken
      # stage's pass is long (the transcriber's: 20 notes of 600 s each).
      - record: stage:oldest_waiting:seconds
        expr: |
          clamp_min(time() - stage_oldest_waiting_since_timestamp_seconds, 0)
          * (stage_oldest_waiting_since_timestamp_seconds > bool 0)

      - alert: StageDegraded
        # Slow, stopped, looping, stuck on one item or backlogged: whichever,
        # the oldest item waiting is older than the stage promises. Held 5
        # minutes, so an item picked up just past its bound is not paged.
        expr: |
          max by (stage) (stage:oldest_waiting:seconds)
          > on (stage) group_left (objective)
          max by (stage, objective) (stage_promise_seconds)
        for: 5m
        labels:
          says: "Home's {{ $labels.stage }} is slow: something has waited on it longer than it promises. The file_host dashboard's SHARED STAGES row says how long, and what waits on it."

      - alert: StageBroken
        # Attempted, and almost nothing ends: more than one item's worth of
        # attempts in the last hour (stage_attempts_per_item, the transcriber's
        # ATTEMPTS, 3: one bad note failing all its attempts is that note's,
        # not the stage's), and under a tenth of them done or refused (a
        # refusal is the stage working: the item itself can't be done). For
        # the transcriber, every note running to its deadline is this. The
        # half is increase()'s extrapolation to the window's edges, which
        # reads one note's 3 failures as a little over 3; real attempts are
        # whole, so a whole one more still passes it.
        expr: |
          (
            sum by (stage) (increase(stage_attempts_total[1h]))
            > on (stage) (max by (stage) (stage_attempts_per_item) + 0.5)
            and on (stage)
            sum by (stage) (increase(stage_attempts_total{result=~"done|refused"}[1h]))
            < 0.1 * sum by (stage) (increase(stage_attempts_total[1h]))
          )
          * on (stage) group_left (objective)
          max by (stage, objective) (stage_promise_seconds > bool 0)
        for: 5m
        labels:
          says: "Home's {{ $labels.stage }} is broken: it made more attempts in the last hour than one item gets, and almost none ended. The file_host dashboard's SHARED STAGES row shows it; its own dashboard says how each attempt ended."

  - name: home-failures
    rules:
      - alert: HomeFailures
        # OA8 (#1189, epic #1174): every failure home counts is one increase
        # of failures_total{process,step}, made only by
        # apps/servers/file_host/src/failure.rs (Failure::record, or
        # Failure::alone where nothing stores the failure), which also logs it
        # at error with its cause. Beside the per-process *Failing
        # alerts, not instead of them: those say a pass keeps failing, this
        # says any one step failed. Over 15 minutes, as HomeShedding is, so a
        # burst is one alert per process and step, resolved after a quiet
        # quarter hour (Grafana's route may send several in one message).
        # Every series exists at 0 from boot (failure::register_all), so a
        # failure after a restart's first scrape is an increase, and a gap in
        # Prometheus's own samples is no increase. A failure before that
        # scrape (a step that fails as the workers start, before file_host
        # listens) can land back at the count from before the restart, which
        # increase() reads as no change: so for a quarter hour after a boot,
        # any step above 0 is told, since a count after a boot is that boot's.
        expr: |
          max by (process, step) (
            increase(failures_total[15m]) > 0
            or
            (failures_total > 0 and on () (time() - max(process_start_time_seconds{job="file_host"}) < 900))
          )
        labels:
          objective: OA8
          says: "Home's {{ $labels.process }} failed at {{ $labels.step }} in the last 15 minutes; each failure is logged at error with its cause."

      - alert: HomeFailuresOpen
        # OA8, #1201 (epic #1174): a failure that persists (an ask home cannot
        # answer, a refused file newest in its folder, a held week that does
        # not read, an index the mailbox did not take) is met again by every
        # pass or every restart, so it is not counted in failures_total, where
        # each meeting would be one more failure. failures_open{process,step}
        # is how many are open now, set afresh by each pass that looks
        # (apps/servers/file_host/src/failure.rs, open), never added to: a
        # restart cannot count one twice, and a fixed one reads 0 at the next
        # pass. For 2 hours, so it has held through at least one more hourly
        # backstop pass than the one that found it. max_over_time bridges a
        # restart, when the series is gone until the new process's first pass
        # sets it, so a deploy does not start the 2 hours again (a first pass
        # that fails for longer than 15 minutes does; its *Failing alert says
        # so). It also holds a cleared level 15 minutes longer, so a condition
        # open for 1h45m can tell. One cleared sooner without a loss never
        # tells: an ask the routine withdrew, an index a newer one replaced. A
        # refused file a newer keep passes is a loss, counted once in
        # failures_total as passed_over, so HomeFailures tells it.
        expr: |
          max by (process, step) (max_over_time(failures_open[15m])) > 0
        for: 2h
        labels:
          objective: OA8
          says: "Home's {{ $labels.process }} has had a failure open at {{ $labels.step }} for about 2 hours, met again each time home looks and not counted again; what each step means is its line in file_host's failure.rs Step table, and failures_open says how many."
