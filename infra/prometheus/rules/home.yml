# What home owes and did not do (AS7, #525): each alert here is one
# objective in paulgsc/some-ui's assurance ledger, named on its `objective`
# label. Prometheus evaluates them (rule_files in ../prometheus.yml); it has
# no Alertmanager, so Grafana reads the firing ones from `ALERTS` and sends
# them to the owner (infra/grafana/provisioning/alerting/home-alerts.yml).
#
# `promtool test rules home.test.yml` proves each fires when its behaviour
# breaks and stays quiet when it holds, in CI (test.yml, metric_contract_ci).
#
# Each alert's words are its `says` label, not an annotation: `ALERTS`, all
# Grafana sees, carries labels only.
#
# A watcher that is switched off is not stale: every stale rule requires its
# `*_enabled` gauge at 1, and its value is the age of its last stamp. A
# mailbox poller or nudge waker that is on with its stamp gone is its own
# alert, and so is file_host itself not answering a scrape.
#
# A watcher whose passes start but keep failing still stamps every attempt,
# so its stale rule never sees it: each `*Failing` rule fires on its
# `*_pass_failing` gauge (any class) held for three of its intervals, while
# its `*_enabled` gauge is 1.
#
# home-health holds what /ready finds wrong with a file_host that is
# answering: a degraded home serves, so the container healthcheck never says.
groups:
  - name: home-watchers
    rules:
      - alert: FileHostDown
        # Every watcher's gauges come from this one scrape, so without it
        # every rule below reads nothing, and nothing would say why.
        expr: (max(up{job="file_host"}) == 0) or absent(up{job="file_host"})
        for: 2m
        labels:
          objective: MI3 NW2 GA4 RR2 AV2
          says: "Home's server has not answered for 2 minutes, so nothing on it is being watched."

      - alert: MailboxPollerStale
        # MI3, two ways. The loop stamps that it is alive every minute while
        # idle and after each pass, never during one (#500): stale past the
        # heartbeat, the pass budget (120 s, AS4 #524) and 60 s, 240 s, means
        # the task died or a pass hangs. Since the backstop is hourly (owner,
        # 2026-11-10), the pass stamp alone would take 63 minutes to say so,
        # past MI3's 20. And no pass started within the interval, the budget
        # and 60 s (3,600 + 120 + 60 = 3,780 s) means the timer itself stopped.
        expr: |
          (
            (time() - max(mailbox_poll_alive_timestamp_seconds)) > 60 + 120 + 60
            or
            (time() - max(mailbox_poll_last_attempt_timestamp_seconds))
              > max(mailbox_poll_interval_seconds) + 120 + 60
          )
          and on() max(mailbox_poll_enabled) == 1
        labels:
          objective: MI3
          says: "The Jobs mailbox poller has not started a pass within its interval, its budget and a minute."

      - alert: MailboxPollerMetricsMissing
        # MI3: the poller is on (file_host says so) but its stamp is gone.
        expr: |
          max(mailbox_poll_enabled) == 1
          unless on() max(mailbox_poll_last_attempt_timestamp_seconds)
        for: 5m
        labels:
          objective: MI3
          says: "The Jobs mailbox poller is on, but home reports no pass at all."

      - alert: MailboxPollerFailing
        # MI3: passes start but every one fails (a 404, a refused token, a
        # mailbox that changed under home), which the stale rule cannot see:
        # a failing pass still stamps its attempt (#641). Three passes in a
        # row, so one blip does not page: the backstop is hourly, but a failed
        # pass is tried again 15 minutes later (`mailbox::RETRY`, #500), so
        # three failures still take 45 minutes. Any class at all, not
        # one: an outage whose class changes from pass to pass (transport,
        # then http) is still an outage, and a per-class timer would restart
        # with each change (Codex on #643). The dashboard's FAILING panel
        # names the class; Grafana forwards labels only.
        expr: |
          max(mailbox_poll_failing) == 1
          and on() max(mailbox_poll_enabled) == 1
        for: 45m
        labels:
          objective: MI3
          says: "The Jobs mailbox poller has failed every pass for 45 minutes; the MAILBOX dashboard's FAILING panel says why."

      - alert: MailboxBellDown
        # #500: home has held no connection to the mailbox's bell for 30
        # minutes. Nothing is lost, since the hourly backstop still reads
        # every file, but nothing reaches home in seconds either, so it is
        # said. 30 minutes rides over a Worker deploy or a reconnect's
        # backoff (5 minutes at most). The MAILBOX dashboard's bell row says
        # why (mailbox_bell_failures_total{why}).
        expr: |
          max(mailbox_bell_connected) == 0
          and on() max(mailbox_poll_enabled) == 1
        for: 30m
        labels:
          objective: MI3
          says: "Home has not held its connection to the mailbox's bell for 30 minutes, so files reach it only on the hourly backstop; the MAILBOX dashboard's bell row says why."

      - alert: NudgeWakerStale
        # NW2: no pass started within the waker's interval, its pass deadline
        # and 60 s.
        expr: |
          (time() - max(nudge_waker_last_attempt_timestamp_seconds))
            > max(nudge_waker_interval_seconds) + max(nudge_waker_pass_deadline_seconds) + 60
          and on() max(nudge_waker_enabled) == 1
        labels:
          objective: NW2
          says: "The study nudge waker has not started a pass within its interval, its deadline and a minute."

      - alert: NudgeWakerMetricsMissing
        expr: |
          max(nudge_waker_enabled) == 1
          unless on() max(nudge_waker_last_attempt_timestamp_seconds)
        for: 5m
        labels:
          objective: NW2
          says: "The study nudge waker is on, but home reports no pass at all."

      - alert: NudgeWakerFailing
        # NW2: passes start but every one fails (a database missing a
        # migration, a locked or full disk), which NudgeWakerStale cannot
        # see: a failing pass still stamps its attempt (#644). Three passes
        # of WAKER_INTERVAL (300 s, a source constant: nudge.rs) in a row.
        # Any class at all, as MailboxPollerFailing: a per-class timer would
        # restart each time the class changed. The file_host dashboard's
        # LOOPS panel names the class (FAILING · <class>).
        expr: |
          max(nudge_waker_pass_failing) == 1
          and on() max(nudge_waker_enabled) == 1
        for: 15m
        labels:
          objective: NW2
          says: "The study nudge waker has failed every pass for 15 minutes; the file_host dashboard's LOOPS panel says why."

      - alert: TranscriberFailing
        # VH1: every pass ends on a storage failure, so no note is heard or
        # given its recorded reason, and the pass still stamps its attempt
        # (#644). Three passes of transcribe::INTERVAL (60 s, a source
        # constant) in a row. Storage is the only way a pass fails: a note
        # that cannot be heard is kept as an attempt, not a failing pass.
        expr: |
          max(transcribe_pass_failing) == 1
          and on() max(transcribe_enabled) == 1
        for: 3m
        labels:
          objective: VH1
          says: "The voice-note transcriber has failed every pass on home's storage for 3 minutes; the TRANSCRIBE dashboard's FAILING panel shows it."

      - alert: GameFeedStale
        # GA4: the feed wakes every 5 s whether or not a game is due, so two
        # minutes without a wake is a task that stopped, not a quiet week.
        expr: |
          (time() - max(game_feed_last_attempt_timestamp_seconds)) > 120
          and on() max(game_feed_enabled) == 1
        labels:
          objective: GA4
          says: "The game feed has not woken for two minutes."

      - alert: GameFeedFailing
        # GA4: the feed wakes but every pass ends on a storage failure, which
        # GameFeedStale cannot see: a failing pass still stamps its wake
        # (#644). Three wakes of game_feed::TICK (5 s, a source constant) in
        # a row: at the 15 s evaluation interval (../prometheus.yml), two
        # evaluations that both find it failing. Storage is the only way a
        # pass fails: an ESPN refusal or no answer is counted and backed off.
        expr: |
          max(game_feed_pass_failing) == 1
          and on() max(game_feed_enabled) == 1
        for: 15s
        labels:
          objective: GA4
          says: "The game feed has failed every pass on home's storage for 15 seconds; the GAME FEED dashboard's FAILING panel shows it."

      - alert: RoutineRunOverdue
        # RR2: 30 minutes after a routine was due, home holds no run that
        # started for it. A run counts for a due time if it started no more
        # than an hour before it, so a run that starts a little early is not
        # missing. `crate::routine_watch` sets both gauges, after each mailbox
        # pass and every 5 minutes between them (`mailbox::WATCH`, #500, since
        # the backstop pass is hourly). A record arrives when its run ends:
        # its put rings the bell and a pass keeps it within seconds, or the
        # hourly backstop does if the bell is down. RR2's 30 minutes is the
        # owner's bound (#525).
        expr: |
          (time() - routine_due_timestamp_seconds > 1800)
          and on(routine) (routine_last_run_timestamp_seconds + 3600 < routine_due_timestamp_seconds)
        labels:
          objective: RR2
          says: "A routine was due more than 30 minutes ago, and home has no record of its run."

      - alert: CallWeeksStale
        # CW2 (some-ui#2635, server#684): the call weeks worker reads
        # paulgsc/testing's index every hour (call_weeks::INTERVAL), sooner
        # after a failure, and stamps each pass it starts. Two hours without
        # one is a task that stopped, not a slow pass: a pass is a few
        # requests of at most 30 s each.
        expr: |
          (time() - max(call_weeks_last_attempt_timestamp_seconds)) > 7200
        labels:
          objective: CW2
          says: "Home has not read the weekly call's weeks for 2 hours (it reads them hourly)."

      - alert: CallWeeksFailing
        # CW2: every pass for 3 hours failed, on storage or on a week it
        # could not read or write; a failing pass is retried after 5, 10, 20
        # and 40 minutes, then hourly, so that is about six passes. A
        # failing source that recovers clears it on its next pass.
        expr: |
          max(call_weeks_pass_failing) == 1
        for: 3h
        labels:
          objective: CW2
          says: "Every pass reading the weekly call's weeks has failed for 3 hours; file-host-server's log names what failed."

      - alert: PlayoffDeltaFillsStale
        # PK2 (some-ui#2647): the Playoff Delta fills worker reads
        # paulgsc/testing's index every hour (pd_fills::INTERVAL), sooner
        # after a failure, and stamps each pass it starts, as the call weeks
        # worker does (CallWeeksStale).
        expr: |
          (time() - max(pd_fills_last_attempt_timestamp_seconds)) > 7200
        labels:
          objective: PK2
          says: "Home has not read Playoff Delta's fills for 2 hours (it reads them hourly)."

      - alert: PlayoffDeltaFillsFailing
        # PK2: every pass for 3 hours failed, on storage or on a fill or
        # season it could not read; retried as CallWeeksFailing's are.
        expr: |
          max(pd_fills_pass_failing) == 1
        for: 3h
        labels:
          objective: PK2
          says: "Every pass reading Playoff Delta's fills has failed for 3 hours; file-host-server's log names what failed."

      - alert: CallRenderFailed
        # CW5: a week home holds has no video and the render worker's last
        # attempt at it failed (infra/render/render-calls.sh keeps that
        # attempt's whole output, and removes it once the week renders).
        # file_host reads that each minute (call_weeks::render). The worker
        # tries again hourly, so a failure that clears on its own stops this.
        expr: |
          max(call_render_weeks_failed) > 0
        labels:
          objective: CW5
          says: "A week of the call failed to render: renders/call-worker/<week>.failed.log on home's database drive has the whole attempt. It is tried again hourly."

      - alert: CallRenderOverdue
        # CW5: a week has waited 3 hours since home took it, with no failed
        # attempt: the worker is stopped, stuck in a render, or held back by
        # the lane for want of room (L4c, docs/home-compute.md, "What the
        # render worker does"). The worker looks every minute and a render
        # takes well under an hour, so 3 hours is past any render that
        # started. A week whose attempt failed is CallRenderFailed's; a lane
        # that holds one job back for good is LaneStuck's too.
        expr: |
          max(call_render_weeks_waiting) > 0
          and on() (time() - max(call_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(call_render_weeks_failed) == 0
        labels:
          objective: CW5
          says: "A week of the call has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: PlayoffDeltaRenderFailed
        # PK5 (some-ui#2647): a voiced fill home holds has no video and the
        # render worker's last attempt at it failed (render-calls.sh's
        # playoff-delta job keeps that attempt's whole output, and removes it
        # once the episode renders). file_host reads that each minute
        # (pd_fills::render). The worker tries again hourly.
        expr: |
          max(pd_render_episodes_failed) > 0
        labels:
          objective: PK5
          says: "A week of Playoff Delta failed to render: renders/playoff-delta-worker/<key>.failed.log on home's database drive has the whole attempt. It is tried again hourly."

      - alert: PlayoffDeltaRenderOverdue
        # PK5: a voiced fill has waited 3 hours since home took it, with no
        # failed attempt, so the worker is not trying it, as
        # CallRenderOverdue reads the call's weeks.
        expr: |
          max(pd_render_episodes_waiting) > 0
          and on() (time() - max(pd_render_oldest_waiting_taken_timestamp_seconds)) > 10800
          and on() max(pd_render_episodes_failed) == 0
        labels:
          objective: PK5
          says: "A week of Playoff Delta has waited 3 hours for its video with no failed attempt: the render worker is not running or is stuck, or home has had no room for it (the CALL dashboard's LANE row; docker logs render)."

      - alert: CallRenderWorkerStale
        # CW5: the worker stamps each pass it starts, a minute apart, and
        # every minute while a job waits for room or is paused (L4c), never
        # while a render runs: four hours is a worker that stopped, or a
        # render that hung (one longer than four hours trips it too), which this
        # catches even with no week waiting. A worker that never stamped
        # (not deployed) is not this; a week it leaves waiting is
        # CallRenderOverdue's.
        expr: |
          max(call_render_worker_last_pass_timestamp_seconds) > 0
          and on() (time() - max(call_render_worker_last_pass_timestamp_seconds)) > 14400
        labels:
          objective: CW5
          says: "Home's render worker has not stamped a pass for 4 hours (it stamps one every minute, waiting for room or not): docker logs render says why."

      - alert: CallServiceRestarted
        # CW5: the speaker, the stage or the render worker died and Docker's
        # restart policy started the same container again, as the speaker
        # did four times on Nov 6 when it ran out of memory twelve lines into
        # a week. Each start gets a new cgroup, so the container's CPU counter
        # starts again from zero on the same series: a reset. cAdvisor's
        # container_start_time_seconds is the container's creation time when
        # it resolves the container through Docker, which a restart in place
        # does not move, so it cannot say this. A deploy makes a new
        # container, a new series, so it is not counted. The render worker's
        # own alerts say which week it cost.
        expr: |
          max by (name) (resets(container_cpu_usage_seconds_total{name=~"kokoro|call-stage|render"}[15m])) > 0
        labels:
          objective: CW5
          says: "Home's {{ $labels.name }} crashed and restarted: the OOM tile on the system dashboard says if memory ran out, and docker logs {{ $labels.name }} says why."

      - alert: CallRenderCacheFull
        # CW6: the render policy caps what one week's step cache keeps
        # (record:call --cache-mb, infra/render/render-calls.sh), and a step
        # past it runs uncached rather than failing; the worker writes each
        # such warning, and each week's work it removed past the total cap,
        # to renders/call-worker/*.cache.log (and Playoff Delta's job to
        # renders/playoff-delta-worker/*.cache.log), whose newest time file_host
        # reads each minute (call_weeks::render::disk). Said for a day, so a
        # render that warned and then finished is still heard.
        expr: |
          max(call_render_cache_warning_timestamp_seconds) > 0
          and on() (time() - max(call_render_cache_warning_timestamp_seconds)) < 86400
        labels:
          objective: CW6
          says: "A render passed its cache policy in the last day, so some steps ran uncached: renders/call-worker/*.cache.log on home's database drive names them."

      - alert: HomeDriveLow
        # CW6: the drive that holds home's database also keeps every video
        # of the call for good and the waiting weeks' caches; file_host reads
        # its free bytes each minute (call_weeks::render::disk). Ten minutes
        # under a tenth free is a drive filling, not a render's moment.
        expr: |
          max(call_render_drive_size_bytes) > 0
          and on() max(call_render_drive_avail_bytes) / max(call_render_drive_size_bytes) < 0.10
        for: 10m
        labels:
          objective: CW6
          says: "Home's database drive, which keeps the call's videos and caches, has under a tenth of its space free."

  - name: home-admission
    rules:
      - alert: ClientRateLimited
        # AD2: home's limiter turned a client away (a 429, which the phone
        # shows as "Home busy"). A client under its limit is never refused
        # (AD1), so a refusal is either a client sending too fast or the
        # limiter wrong again; both are worth hearing, and before the GCRA
        # rewrite neither reached anyone. Over 15 minutes, so a burst of
        # refusals is one message, resolved after a quiet quarter hour. The
        # series exists at 0 from boot (metrics::rate_limit::register_all),
        # so the first refusal after a restart is an increase too.
        expr: sum(increase(rate_limit_decisions_total{outcome="rejected"}[15m])) > 0
        labels:
          objective: AD2
          says: "Home turned a client away for sending too fast in the last 15 minutes (a 429; the phone shows Home busy). The Rate limiting row on the file_host dashboard shows when."

  - name: home-health
    rules:
      - alert: DatabaseBehindBuild
        # AV2 (AS19, #565): the database is missing migrations this build's
        # queries need. /ready is then degraded, not unavailable (AS15,
        # #560), so the container stays healthy and only the queries that
        # touch what the pending migrations add fail. A database never
        # migrated at all trips this too; /ready's body says which it is.
        #
        # dependency_up is fresh without anyone asking /ready:
        # metrics::periodic re-checks every dependency every 10 s. When
        # sqlite itself is down, schema reads 0 as "not checked", so that
        # case is left to sqlite's own answer rather than sent here as a
        # migration to run. 5 minutes is past a deploy that applies the
        # migrations and restarts (#563); a failed migrate that leaves the
        # new binary serving is what this is for.
        expr: |
          max(dependency_up{dependency="schema"}) == 0
          unless on() max(dependency_up{dependency="sqlite"}) == 0
        for: 5m
        labels:
          objective: AV2
          says: "Home's database has been behind this build for 5 minutes: /ready names the migrations to run."

  # Home runs out of memory (LN2, #707): every kill the kernel makes for
  # memory reaches the owner, named when it can be and never dropped when it
  # can't. Home has no swap (paulgsc/dotfiles swapDevices = []), so a kill is
  # how a shortage ends. docs/home-compute.md says who is killed first and
  # what each kill costs.
  #
  # The kernel's own count, node_vmstat_oom_kill (/proc/vmstat oom_kill), is
  # the truth: it counts every OOM kill, inside a container's cap or across
  # the host. cAdvisor names the container from the kernel's log
  # (container_oom_events_total, by `name`). HomeOomKill says which container
  # lost a process; HomeOomKillUnattributed fires when the kernel counted
  # more kills than cAdvisor named, so a kill outside any container, or one
  # cAdvisor missed, is still heard. Both look back an hour, so a kill made
  # while Prometheus itself was down for less than that is still caught.
  - name: home-memory
    rules:
      - alert: HomeOomKill
        expr: |
          max by (name) (round(increase(container_oom_events_total{name!=""}[1h]))) > 0
        labels:
          objective: LN2
          says: "Home's {{ $labels.name }} lost a process to the kernel for memory in the last hour: docs/home-compute.md (What a kill costs) says what that cost and what retries it."

      - alert: HomeOomKillUnattributed
        # Each side rounded, since increase() extrapolates to the window's
        # edges; held 2 m, since the two counters are scraped apart and one
        # can see a kill a scrape before the other.
        expr: |
          max(round(increase(node_vmstat_oom_kill[1h])))
          > on() (sum(round(increase(container_oom_events_total{name!=""}[1h]))) or on() vector(0))
        for: 2m
        labels:
          objective: LN2
          says: "The kernel killed a process on home for memory in the last hour that no container is named for: the WHO DUNNIT dashboard's OOM tile counts it, and journalctl -k on home names it."

  # The batch lane (L4b, #708): file_host decides every 5 s whether home's
  # batch class may run, must pause or must stop (call_weeks::lane, from
  # crates/lane), and writes the decision where the render worker reads it.
  # docs/home-compute.md ("The lane") says what it reads and home's policy.
  # Each rule reads a gauge file_host sets every tick, so file_host not
  # answering a scrape is FileHostDown's, not these.
  - name: home-lane
    rules:
      - alert: LaneStale
        # The lane writes a decision every 5 s, and the render worker treats
        # one older than 30 s as stop (call_weeks::lane::STALE_AFTER). A
        # decision a minute old, held for a minute, is a lane that stopped
        # or cannot write: never one slow tick. A lane that never wrote one
        # reads 0, so it is caught too.
        expr: |
          (time() - max(lane_last_decision_timestamp_seconds)) > 60
        for: 1m
        labels:
          objective: LN3
          says: "Home's batch lane has not written a decision for over a minute, so the render worker reads it as stop: file-host-server's log says why (it writes every 5 s)."

      - alert: LaneStuck
        # LA4: the render in progress was stopped for memory or pressure
        # three times in a row (call_weeks::lane::POLICY.stuck_after). The
        # lane decides this, so no wait is added: a job stays stuck until
        # the worker finishes or gives it up, and a new job starts at zero.
        expr: |
          max(lane_stuck) == 1
        labels:
          objective: LN3
          says: "A render on home was stopped three times in a row for memory or pressure: it may never fit. The CALL dashboard's LANE row shows free memory against its peak and the floor."

      - alert: LaneSignalsUnreadable
        # A signal the lane decides from could not be read (no PSI in the
        # kernel, /proc/meminfo, or a garbled job or peak file from the
        # render worker). Under LA2 that is never room, so batch work never
        # starts; every `unknown` decision comes from one of these. Held 5
        # minutes: a reading that comes back within that is said by the
        # dashboard, not paged.
        expr: |
          min by (signal) (lane_signal_readable) == 0
        for: 5m
        labels:
          objective: LN3
          says: "Home's batch lane has not been able to read its {{ $labels.signal }} signal for 5 minutes, so no render may start: docs/home-compute.md (The lane) says where each signal comes from."
