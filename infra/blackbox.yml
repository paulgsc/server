modules:
  tcp_connect:
    prober: tcp
    timeout: 10s

  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ['HTTP/1.1', 'HTTP/2']
      valid_status_codes: [101, 200, 429, 503] # Treat WebSocket upgrade as "up"
      method: GET
      headers:
        Upgrade: websocket
        Connection: Upgrade
        Sec-WebSocket-Version: '13'
        Sec-WebSocket-Key: 'x3JJHMbDL1EzLkh9GBhXDw=='
        # Lets file_host's client_id_from_request tag this handshake
        # client_type="probe" instead of "direct" — this prober completes a
        # real WS upgrade against /ws and then hangs up immediately, and
        # without this header the resulting connection was indistinguishable
        # from an actual device until STALE_TIMEOUT (120s) reaped it. See
        # apps/servers/file_host/src/websocket/connection.rs and
        # infra/grafana/dashboards/lib/clients-panels.libsonnet's DEVICE
        # CONNS / PROBE split.
        X-Probe-Source: blackbox-exporter
