
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
resolver = "2"


members = [
  # apps
  "apps/servers/file_host",
  "apps/orchestrator",
  "apps/some-obs",

  # crates (transitive deps of the apps above)
  "crates/cursorium",
  "crates/db/activity",
  "crates/db/capture",
  "crates/db/mood_event",
  "crates/db/engagement",
  "crates/db/push",
  "crates/intervention",
  "crates/push_kit",
  "crates/study_domain",
  "crates/db/session",
  "crates/enum-name-derive",
  "crates/file_reader",
  "crates/gsheet_derive",
  "crates/obs-websocket",
  "crates/sdk",
  "crates/some-cache",
  "crates/some-metrics",
  "crates/some-services",
  "crates/some-transport",
  "crates/ws-conn-manager",
  "crates/ws-connection",
  "crates/ws-events",
]

exclude = [".github/scripts"]

[workspace.lints.clippy]
all = { level = "deny", priority = 2 }
pedantic = { level = "deny", priority = 2 }
nursery = { level = "deny", priority = 2 }
cargo = { level = "deny", priority = 2 }

# Duplicate transitive versions are not ours to resolve. `web-push` reaches
# `jwt-simple` -> `superboring`, which pulls a second major of `cpufeatures`,
# `heck`, `r-efi`, and `wit-bindgen`; nothing short of forking the dependency
# changes that. Left denied, the lint fails the build of every crate in the
# workspace for a fact none of them can act on, so it is off deliberately
# rather than by accident. The rest of the `cargo` group still applies.
multiple_crate_versions = { level = "allow", priority = 3 }


[workspace.package]
version = "0.0.0"
authors = ["pgdev"]
repository = "https://github.com/paulgsc/server"
homepage = "https://maishatu.com/"
license = "MIT"
edition = "2021"

[workspace.dependencies]

file_reader = { path = "crates/file_reader" }
sdk = { path = "crates/sdk" }
enum-name-derive = { path = "crates/enum-name-derive" }
gsheet_derive = { path = "crates/gsheet_derive" }
obs-websocket = { path = "crates/obs-websocket" }
some-services = { path = "crates/some-services" }
mood_event = { path = "crates/db/mood_event" }
ws-connection = { path = "crates/ws-connection" }
some-transport = { path = "crates/some-transport" }
ws-conn-manager = { path = "crates/ws-conn-manager" }
ws-events = { path = "crates/ws-events" }
cursorium = { path = "crates/cursorium" }
some-cache = { path = "crates/some-cache" }
some-metrics = { path = "crates/some-metrics" }
activity_repo = { path = "crates/db/activity" }
capture_repo = { path = "crates/db/capture" }
push_repo = { path = "crates/db/push" }
engagement_repo = { path = "crates/db/engagement" }
push_kit = { path = "crates/push_kit" }
intervention = { path = "crates/intervention" }
study_domain = { path = "crates/study_domain" }
session_repo = { path = "crates/db/session" }

anyhow = "1.0"
async-trait = "0.1.64"
axum = { version = "0.7.5", features = ["http2", "macros", "matched-path"] }
clap = { version = "4.5.8", features = ["derive", "env"] }
chrono = "0.4.23"
dotenvy = "0.15.7"
futures = "0.3.26"
lazy_static = "1.4.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Test-only: `metrics_util::debugging::DebuggingRecorder`, used to assert
# recorded values without a live Prometheus — see #226 (C1)'s acceptance
# criterion that connection lifecycle counters have at least one test. Same
# 0.20.4 already resolved transitively through metrics-exporter-prometheus,
# pinned explicitly rather than left to drift since it's now a direct dep.
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
mime = "0.3.17"
notify = "6.1.1"
once_cell = "1.17.1"
proc-macro2 = "1.0.79"
quote = "1.0.23"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
syn = "1.0.107"
sqlx = "0.7"
tempfile = "3.3.0"
thiserror = "1.0.48"
tokio = "1.41.0"
tokio-util = "0.7.17"
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5.0", features = ["add-extension", "trace", "cors"] }
tracing = "0.1.37"
regex = "1.7.0"
base64 = "0.22"
reqwest = { version = "0.12.23", features = ["json"] }
web-push = { version = "0.11", default-features = false }

opentelemetry = "0.29.1"
opentelemetry_sdk = { version = "0.29.0"  }
opentelemetry-otlp = { version = "0.29.0" }
tracing-subscriber = { version = "0.3.20" }
tracing-opentelemetry = "0.30.0"
