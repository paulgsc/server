
[target.'cfg(all())']
rustflags = [
    "-W", "clippy::all",
    "-W", "clippy::pedantic",
    "-W", "clippy::nursery",
    "-W", "clippy::cargo",
    "-D", "clippy::unwrap_used",
    "-W", "clippy::expect_used",
    "-W", "clippy::perf",
    "-W", "clippy::style",
    "-W", "clippy::complexity",
    "-D", "clippy::suspicious",
    "-W", "clippy::doc_markdown",
    "-A", "clippy::missing_docs_in_private_items",
    "-A", "clippy::module_name_repetitions",
    # Cargo appends RUSTFLAGS after the `[lints]` table's flags, so `-W
    # clippy::cargo` above re-enables lints the workspace manifest allows.
    # `multiple_crate_versions` is allowed there deliberately — see the comment
    # on it in the root Cargo.toml — and has to be re-allowed here to stick.
    "-A", "clippy::multiple_crate_versions",
    # Same for `redundant_pub_crate`, which contradicts `unreachable_pub` —
    # see its comment in the root Cargo.toml.
    "-A", "clippy::redundant_pub_crate",
    "-D", "warnings"
]

[build]
rustflags = ["-D warnings"]


[env]
# whisper-rs-sys (file_host's voice-note transcriber) uses the bindings it
# ships for the whisper.cpp it vendors, instead of generating them with
# bindgen. Generating needs a libclang that loads in the build's environment,
# which the Nix CI shell's does not (it finds the runner's, and the runner's
# libstdc++ is outside the shell). The Dockerfile sets the same variable.
WHISPER_DONT_GENERATE_BINDINGS = "1"
