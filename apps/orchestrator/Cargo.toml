[package]
name = "orchestrator"
description = "Service orchestration application"
categories = ["development-tools"]
keywords = ["orchestrator", "services"]
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
some-transport = { workspace = true, features = ["nats"] }
some-metrics = { workspace = true }
ws-events = { workspace = true, features = ["ws-events"] }
cursorium = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }

# Concurrency
dashmap = "6"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }

[lints]
workspace = true
