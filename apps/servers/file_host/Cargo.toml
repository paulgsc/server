[package]
name = "file_host"
description = "File hosting server"
categories = ["web-programming::http-server"]
keywords = ["file", "host", "server"]
readme = "README.md"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

# Declared explicitly because the extra binaries need names Cargo would not
# derive from their filenames. `dump-routes` emits the HTTP surface as JSON
# or, with `--ts`, TypeScript, for the client repo's contract harness; see
# `src/routes/inventory.rs` and `src/routes/ts_emitter.rs`. `dump-proposed-session`
# emits a real RCM3+RCM4 provisioned session's `activities` for the client
# repo's `checkSessionDuration` fixture; see `src/bin/dump_proposed_session.rs`.
# `dump-provisioned-session` emits a full RCM5 provisioned `SessionRecord`
# for the client repo's round-trip fixture; see
# `src/bin/dump_provisioned_session.rs`.
[[bin]]
name = "file_host"
path = "src/main.rs"

[[bin]]
name = "dump-routes"
path = "src/bin/dump_routes.rs"

[[bin]]
name = "dump-proposed-session"
path = "src/bin/dump_proposed_session.rs"

[[bin]]
name = "dump-provisioned-session"
path = "src/bin/dump_provisioned_session.rs"

[[bin]]
name = "import-curriculum"
path = "src/bin/import_curriculum.rs"

[dependencies]
# path crates
mood_event = { workspace = true }
some-services = { workspace = true }
ws-connection = { workspace = true }
ws-conn-manager = { workspace = true }
some-transport = { workspace = true, features = ["nats", "mpsc_utils"] }
ws-events = { workspace = true, features = ["tabsched", "ws-events"] }

axum = { workspace = true, features = ["ws"] }
# Only to recognise the error axum's WebSocket wraps (see
# websocket/message/handlers.rs `is_peer_gone`), so it must be the version
# axum itself uses — axum 0.7 wraps tungstenite 0.24. The real-socket test
# there fails if the two ever drift apart.
tungstenite = { version = "0.24", default-features = false }
anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
lazy_static = { workspace = true }
futures = { workspace = true }
redis = { version = "0.28.2", features = ["aio", "tokio-comp"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = [
  "runtime-tokio-native-tls",
  "sqlite",
  "uuid",
  "time",
] }
regex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["limit", "load-shed"] }
tower-http = { workspace = true, features = ["fs", "limit"] }
uuid = "1.18.0"
chrono.workspace = true
tokio-util = { workspace = true }
reqwest = { workspace = true }

opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "json",
  "registry",
  "tracing-log",
] }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }
some-cache.workspace = true
some-metrics.workspace = true
activity_repo = { workspace = true }
capture_repo = { workspace = true }
curriculum_repo = { workspace = true }
push_repo = { workspace = true }
engagement_repo = { workspace = true }
outcome_repo = { workspace = true }
publication_repo = { workspace = true }
presence_repo = { workspace = true }
session_repo = { workspace = true }
push_kit = { workspace = true, features = ["reqwest-transport"] }
intervention = { workspace = true }
study_domain = { workspace = true }
chrono-tz = "0.10"


[dev-dependencies]
# `test-util` gives the paused clock the sliding-window rate limiter tests use
# to step over a sixty-second window without sleeping for it.
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "test-util",
] }
metrics-util = { workspace = true }
# A real on-disk database for the waker's lock-classification test: two
# connections to `:memory:` would be two databases, not one contended one.
tempfile = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false
